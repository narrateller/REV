      meaning: Синтетический пример нижней границы, не рекомендация запаса для изделия, сварки или усталости.
      provenance: {kind: SYNTHETIC_ASSUMPTION, source_ref: README.md, locator: Демонстрация}
      author: {role: R5, session_id: TEMPLATE_AUTHOR}
      author_sessions: [TEMPLATE_AUTHOR]
      verifier: null
      depends_on: []
      calculation: null
      evidence: []
      baseline_id: null
      history:
        - {revision: 1, from: null, to: RAW, actor: TEMPLATE_AUTHOR, reason: Синтетический пример}
        - {revision: 1, from: RAW, to: ASSUMED, actor: TEMPLATE_AUTHOR, reason: Демонстрация одностороннего критерия}

  # Проектные коэффициенты задавать отдельно по виду разрушения/критерию,
  # материалу, режиму и нормативному основанию. Универсального запаса нет.

# Домены можно дополнять: требования, электрика, управление, испытания,
# численные настройки решателя и критерии сходимости. Их значимые числа
# также регистрировать; не прятать критерии в скриптах или отчётах.
