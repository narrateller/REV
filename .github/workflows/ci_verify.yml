name: REV CI (T-0.4: gates + tests)
'on':
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  basics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pyyaml pytest
      - name: Criteria and task cards parse
        run: |
          python - <<'PY'
          import glob, yaml
          c = yaml.safe_load(open('ops/criteria/design_criteria.yaml', encoding='utf-8'))
          assert c['version'] >= 1 and 'criteria' in c and 'gates' in c
          for g, ids in c['gates'].items():
              for i in ids:
                  assert not i.startswith('C-') or i in c['criteria'], (g, i)
          for f in glob.glob('ops/tasks/*.yaml'):
              t = yaml.safe_load(open(f, encoding='utf-8'))
              for k in ('id', 'backend', 'effort', 'allowed_paths'):
                  assert k in t, (f, k)
              assert t['effort'] not in (None, '', 'none', 'low'), f
          print('ok')
          PY
      - name: Local-only files are not committed
        run: test ! -e ORCHESTRATION_PLAN_OPUS.md
      - name: Unit tests (pure Python, FreeCAD tests skip themselves)
        run: python -m pytest -q tests/ops
      - name: Calc gates calibration — W02-04 must FAIL (exit 1), synthetic must PASS (exit 0)
        run: |
          set +e
          python ops/gates/calc_gates.py --params ops/calibration/w02_04_params.yaml --criteria ops/criteria/design_criteria.yaml --out /tmp/w02.json; e1=$?
          python ops/gates/calc_gates.py --params design/params.example.yaml --criteria ops/criteria/design_criteria.yaml --out /tmp/syn.json; e2=$?
          echo "w02=$e1 synthetic=$e2"; test $e1 -eq 1 && test $e2 -eq 0
      - name: Calibration summary verdict is MATCH
        run: python -c "import json,sys; v=json.load(open('ops/calibration/w02_04.json',encoding='utf-8'))['verdict']; print(v); sys.exit(v!='MATCH')"
      - name: Runner dry-run probe (echo adapter)
        run: |
          git config --global user.email ci@example.invalid && git config --global user.name ci
          git branch -f main HEAD 2>/dev/null || true
          python ops/run_task.py --probe --dry-run
