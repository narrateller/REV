name: REV minimal CI (temporary, T-0.0)
'on':
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  basics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pyyaml pytest
      - name: Criteria and task cards parse
        run: |
          python - <<'PY'
          import glob, yaml
          c = yaml.safe_load(open('ops/criteria/design_criteria.yaml', encoding='utf-8'))
          assert c['version'] >= 1 and 'criteria' in c and 'gates' in c
          for g, ids in c['gates'].items():
              for i in ids:
                  assert not i.startswith('C-') or i in c['criteria'], (g, i)
          for f in glob.glob('ops/tasks/*.yaml'):
              t = yaml.safe_load(open(f, encoding='utf-8'))
              for k in ('id', 'backend', 'effort', 'allowed_paths'):
                  assert k in t, (f, k)
              assert t['effort'] not in (None, '', 'none', 'low'), f
          print('ok')
          PY
      - name: Local-only files are not committed
        run: test ! -e ORCHESTRATION_PLAN_OPUS.md
      - name: Unit tests (pure Python, FreeCAD tests skip themselves)
        run: if [ -d tests/ops ]; then python -m pytest -q tests/ops; else echo "no tests/ops yet"; fi
