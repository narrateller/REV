<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" role="img">
<title>B / V1 / CYC-03 — Задний соосный цилиндр / направляемый носитель</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#37536b"/></marker></defs>
<rect width="1600" height="1100" fill="#f7fafc"/>
<style>text{font-family:DejaVu Sans,sans-serif;fill:#172f43} .t{font-size:19px} .h{font-size:24px;font-weight:bold} .s{font-size:17px} .line{stroke:#37536b;stroke-width:3;fill:none;marker-end:url(#arrow)} .dash{stroke-dasharray:9 6}</style>
<text x="50" y="52" class="h">B / V1 / CYC-03 — Задний соосный цилиндр / направляемый носитель</text>
<text x="50" y="86" class="t">ASSUMED вариант без выбора • условный вид сверху, +x вправо / +y вверх • размеры UNKNOWN • не CAD</text>
<rect x="940" y="190" width="480" height="340" rx="6" fill="#fde6e5" stroke="#37536b" stroke-width="2" stroke-dasharray="9 6"/>
<text x="952" y="220" class="s">Запрещённый штоку объём</text>
<text x="952" y="245" class="s">КАМЕРА + ПОДАЧА (sweep)</text>
<text x="952" y="270" class="s">Рабочее сечение сохранено</text>
<rect x="1030" y="310" width="230" height="95" rx="6" fill="#d9efeb" stroke="#37536b" stroke-width="2"/>
<text x="1042" y="340" class="s">Материал / камера</text>
<text x="1042" y="365" class="s">Свойства UNKNOWN</text>
<rect x="1280" y="310" width="200" height="95" rx="6" fill="#fff0da" stroke="#37536b" stroke-width="2" stroke-dasharray="9 6"/>
<text x="1292" y="340" class="s">B реакция:</text>
<text x="1292" y="365" class="s">упор / замок</text>
<text x="1292" y="390" class="s">unload UNKNOWN</text>
<path d="M160,520 L160,570 L1460,570 L1460,420" stroke="#677d91" fill="none" stroke-width="13"/>
<text x="400" y="605" class="t">Силовые связи / опоры рамы → реакционный узел; размеры и прочность UNKNOWN</text>
<rect x="95" y="480" width="150" height="58" rx="6" fill="#c8d6e4" stroke="#37536b" stroke-width="2"/>
<text x="107" y="510" class="s">Опора цилиндра</text>
<rect x="95" y="310" width="235" height="95" rx="6" fill="#cfe1f5" stroke="#37536b" stroke-width="2"/>
<text x="107" y="340" class="s">Цилиндр: source D</text>
<text x="107" y="365" class="s">Один, крепления</text>
<text x="107" y="390" class="s">COTS UNKNOWN</text>
<rect x="330" y="343" width="210" height="28" rx="6" fill="#edbb7f" stroke="#37536b" stroke-width="2"/>
<text x="342" y="373" class="s"></text>
<text x="335" y="300" class="s">Шток: source d</text>
<rect x="540" y="285" width="65" height="170" rx="6" fill="#d5e8fb" stroke="#37536b" stroke-width="2"/>
<text x="552" y="315" class="s">T</text>
<text x="485" y="250" class="s">T: захваченная траверса</text>
<rect x="605" y="345" width="340" height="30" rx="6" fill="#d5bce5" stroke="#37536b" stroke-width="2"/>
<text x="617" y="375" class="s"></text>
<text x="640" y="325" class="s">Новый носитель</text>
<path d="M565,455 L565,505" class="line dash"/>
<text x="280" y="647" class="t">Требование: весь rod + T остаются сзади камеры во всём ходе.</text>
<rect x="720" y="380" width="185" height="42" rx="6" fill="#c8d6e4" stroke="#37536b" stroke-width="2"/>
<text x="732" y="410" class="s">Направляющие</text>
<path d="M810,422 L810,570" stroke="#677d91" stroke-width="7" stroke-dasharray="6 5"/>
<rect x="955" y="325" width="45" height="75" rx="6" fill="#f4b772" stroke="#37536b" stroke-width="2"/>
<text x="967" y="355" class="s">P</text>
<path d="M690,455 L945,455" class="line"/>
<text x="695" y="485" class="s">+x: те же S_approach/work/eject</text>
<path d="M945,535 L690,535" class="line"/>
<text x="695" y="525" class="s">Возврат: тот же S_return</text>
<text x="50" y="700" class="t">Контур: основание цилиндра → рама → реакция → материал → P → носитель → T → шток → цилиндр.</text>
<rect x="50" y="735" width="730" height="205" rx="6" fill="#e5eff7" stroke="#37536b" stroke-width="2"/>
<text x="62" y="765" class="s">До: прямой source шток входил в камеру/подачу.</text>
<text x="62" y="790" class="s">После: изменена только предлагаемая топология, не BRep.</text>
<text x="62" y="815" class="s">D/d/F/камера/ходы не уменьшены; все 44 source binding.</text>
<text x="62" y="840" class="s">Носитель — новая силовая деталь, не переименованный шток.</text>
<text x="62" y="865" class="s">Двусторонние joints, устойчивость и потери → R3.</text>
<text x="62" y="890" class="s">Нативные пары/прочность: NOT_RUN / INDETERMINATE.</text>
<rect x="825" y="735" width="725" height="205" rx="6" fill="#fff0da" stroke="#37536b" stroke-width="2"/>
<text x="837" y="765" class="s">Доступы и последующая проверка</text>
<text x="837" y="790" class="s">Извлечение цилиндра/штока/носителя и снятие T с опорой.</text>
<text x="837" y="815" class="s">CylinderRemoval / DoserRemoval / новые QueryVolumes.</text>
<text x="837" y="840" class="s">Направляющие, крепления, порты, ограждения, сервис по L.</text>
<text x="837" y="865" class="s">Старые BLOCKED/SHORT_STROKE/unknown не закрыты.</text>
<text x="837" y="890" class="s">B opening и физическая выполнимость L INDETERMINATE.</text>
<text x="50" y="1010" class="s">ASSUMED: символическая топология. UNKNOWN: реальные размеры, силы, свойства, допуски, ресурсы.</text>
<text x="50" y="1038" class="s">Пиксели — оформление, не инженерные координаты. Native geometry NOT_RUN; физический READY NO-GO.</text>
<text x="50" y="1066" class="s">W02 OPEN / NOT_IMPLEMENTED. Архитектура и ТЗ не утверждены. G1 OPEN. Физические испытания NOT_RUN.</text>
</svg>
