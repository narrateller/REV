<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" role="img">
<title>B / CYC-02 — интерфейсы подачи, затвора и пуансона</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#37536b"/></marker></defs>
<rect width="1600" height="1100" fill="#f7fafc"/>
<style>text{font-family:DejaVu Sans,sans-serif;fill:#172f43} .t{font-size:19px} .h{font-size:24px;font-weight:bold} .s{font-size:17px} .line{stroke:#37536b;stroke-width:3;fill:none;marker-end:url(#arrow)} .dash{stroke-dasharray:9 6}</style>
<text x="50" y="52" class="h">B / CYC-02 — интерфейсы подачи, затвора и пуансона</text>
<text x="50" y="86" class="t">BASE_B fixed-budget • NTS без масштаба • условия действия в permissions.json, не программа управления</text>
<rect x="50" y="150" width="245" height="110" rx="6" fill="#fff0da" stroke="#37536b" stroke-width="2"/>
<text x="62" y="180" class="s">Существующая линия</text>
<text x="62" y="205" class="s">Дробление / просев</text>
<text x="62" y="230" class="s">Включения: на линии</text>
<rect x="340" y="150" width="235" height="110" rx="6" fill="#fff0da" stroke="#37536b" stroke-width="2"/>
<text x="352" y="180" class="s">Приём → бункер</text>
<text x="352" y="205" class="s">Транспорт / буфер</text>
<text x="352" y="230" class="s">UNKNOWN</text>
<rect x="620" y="150" width="245" height="110" rx="6" fill="#fff0da" stroke="#37536b" stroke-width="2"/>
<text x="632" y="180" class="s">Дозатор D0 ↔ D1</text>
<text x="632" y="205" class="s">ASSUMED ползун +y</text>
<text x="632" y="230" class="s">S_D UNKNOWN</text>
<rect x="910" y="150" width="225" height="110" rx="6" fill="#fff0da" stroke="#37536b" stroke-width="2"/>
<text x="922" y="180" class="s">Стык / затвор</text>
<text x="922" y="205" class="s">G0 ↔ G1; по y</text>
<text x="922" y="230" class="s">S_G UNKNOWN</text>
<rect x="1180" y="150" width="370" height="110" rx="6" fill="#fff0da" stroke="#37536b" stroke-width="2"/>
<text x="1192" y="180" class="s">Камера / пуансон +x</text>
<text x="1192" y="205" class="s">B: закрытая камера + упор/замок</text>
<text x="1192" y="230" class="s">Выход → приём UNKNOWN</text>
<path d="M295,205 L340,205" class="line"/>
<path d="M575,205 L620,205" class="line"/>
<path d="M865,205 L910,205" class="line"/>
<path d="M1135,205 L1180,205" class="line"/>
<rect x="50" y="310" width="420" height="260" rx="6" fill="#e5eff7" stroke="#37536b" stroke-width="2"/>
<text x="62" y="340" class="s">Базы и положения</text>
<text x="62" y="365" class="s">O: задняя плоскость камеры</text>
<text x="62" y="390" class="s">+x → выход; +y поперёк; +z вверх</text>
<text x="62" y="415" class="s">D/G: свои базы, offsets UNKNOWN</text>
<text x="62" y="440" class="s">P0 = x_P0 UNKNOWN</text>
<text x="62" y="465" class="s">P1 = P0 + S_approach</text>
<text x="62" y="490" class="s">P2 = P1 + S_work</text>
<text x="62" y="515" class="s">P3 = P2 + S_eject</text>
<text x="515" y="340" class="h">Порядок подачи (каждая стрелка — полный путь и guards)</text>
<rect x="515" y="375" width="235" height="90" rx="6" fill="#e2f2ec" stroke="#37536b" stroke-width="2"/>
<text x="527" y="405" class="s">P0/PF</text>
<text x="527" y="430" class="s">FEED_CLEAR</text>
<rect x="770" y="375" width="235" height="90" rx="6" fill="#e2f2ec" stroke="#37536b" stroke-width="2"/>
<text x="782" y="405" class="s">G0: OPEN</text>
<text x="782" y="430" class="s">D0 → D1 → D0</text>
<rect x="1025" y="375" width="235" height="90" rx="6" fill="#e2f2ec" stroke="#37536b" stroke-width="2"/>
<text x="1037" y="405" class="s">Доза учтена</text>
<text x="1037" y="430" class="s">G0 → G1</text>
<rect x="1280" y="375" width="235" height="90" rx="6" fill="#e2f2ec" stroke="#37536b" stroke-width="2"/>
<text x="1292" y="405" class="s">G1 подтверждён</text>
<text x="1292" y="430" class="s">P: подход/работа</text>
<path d="M750,420 L770,420" class="line"/>
<path d="M1005,420 L1025,420" class="line"/>
<path d="M1260,420 L1280,420" class="line"/>
<text x="515" y="505" class="t">Закрытие G до завершения переноса дозы не разрешено.</text>
<text x="515" y="537" class="t">Поза D/G/P ≠ доказательство материала, изоляции или READY.</text>
<rect x="50" y="615" width="730" height="300" rx="6" fill="#e2f2ec" stroke="#37536b" stroke-width="2"/>
<text x="62" y="645" class="s">B load → repeated gather или single</text>
<text x="62" y="670" class="s">GATHER → partial RETURN → REFILL: тот же batch</text>
<text x="62" y="695" class="s">PG_B/PF/вместимость/удержание UNKNOWN</text>
<text x="62" y="720" class="s">SELECT → COMPACT → UNLOAD → UNLOCK → OPEN</text>
<text x="62" y="745" class="s">Открытие B INDETERMINATE, не из конца хода</text>
<text x="62" y="770" class="s">EJECT → CROSS → RECEIVE → RETURN</text>
<text x="62" y="795" class="s">STOP-CLOSE → RELOCK → RESET с остатками</text>
<text x="62" y="820" class="s">B_RESET_CONFIRMED отдельно; P0 ≠ READY</text>
<rect x="825" y="615" width="725" height="300" rx="6" fill="#fff0da" stroke="#37536b" stroke-width="2"/>
<text x="837" y="645" class="s">Условия каждого движения</text>
<text x="837" y="670" class="s">START родителя + текущие инварианты + свои guards</text>
<text x="837" y="695" class="s">Свидетельства: subject / operation / epoch / revisions</text>
<text x="837" y="720" class="s">Изменение материала/позы/ресурса делает guards устаревшими</text>
<text x="837" y="745" class="s">Доказанный отказ → BLOCKED, даже при другом UNKNOWN</text>
<text x="837" y="770" class="s">Иначе обязательный UNKNOWN → INDETERMINATE</text>
<text x="837" y="795" class="s">Recovery: свои guards, новый ID, без общего READY</text>
<text x="837" y="820" class="s">Нельзя снять чужой fault или забыть rejected ID</text>
<text x="50" y="1010" class="s">ASSUMED: символическая топология. UNKNOWN: реальные размеры, силы, свойства, допуски, ресурсы.</text>
<text x="50" y="1038" class="s">Пиксели — оформление, не инженерные координаты. Native geometry NOT_RUN; физический READY NO-GO.</text>
<text x="50" y="1066" class="s">W02 OPEN / NOT_IMPLEMENTED. Архитектура и ТЗ не утверждены. G1 OPEN. Физические испытания NOT_RUN.</text>
</svg>
