    удерживают кассету при обслуживании.
  service: Подпереть шибер при разгруженной и изолированной гидравлике, снять плиту
    и прижимы со стороны камеры, извлечь кассету в сторону камеры, восстановить базу
    и проверить ход.
  wear: Сменные пылесъёмники на входе в направляющие, лабиринт и удаление пыли из
    кармана; дозированная подача совместимой смазки к дорожкам вне канала и отвод
    излишка наружу. Проверка задира при 8–12% влажности сырья по T-1.7c, загрязнение
