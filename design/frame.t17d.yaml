      T-1.7.
    induction_on: Опорные полосы кассеты и ответные дорожки тыльной плоскости плиты.
      Отпуск и окончательное шлифование после упрочнения.
    surface_HRC:
    - 52
    - 57
    SHD_min_mm: 6.0
    roughness_Rz_max_um: 6.3
    hardening_depth_method: ISO 18203, SHD по микротвёрдости на поперечных шлифах,
      в том числе на сбеге и на концах дорожки.
    residual_stress: Контроль остаточных напряжений у конца дорожки и перехода слоя.
      В FKM заложены свойства +QT без прироста от упрочнения.
    fixing: Дно кармана передаёт осевую силу в торец. Сопряжённые боковые упорные
      грани или сменные ключи воспринимают сдвиг по двум осям. Прижимы снаружи проекции
      плиты удерживают кассету при обслуживании.
    service: Подпереть шибер при разгруженной и изолированной гидравлике, снять плиту
      и прижимы со стороны камеры, извлечь кассету в сторону камеры, восстановить
      базу и проверить ход.
    wear: Сменные пылесъёмники на входе в направляющие, лабиринт и удаление пыли из
      кармана; дозированная подача совместимой смазки к дорожкам вне канала и отвод
      излишка наружу. Проверка задира при 8–12% влажности сырья по T-1.7c, загрязнение
      представительными частицами.
