open_items:
- Подтвердить растарировку T0, раздельные пути деаэрации, заглубление и давление на фланце S насоса.
- На безопасной остановке измерить ход, время разряда SAL/SAX, порядок WK и волну уровня.
- Подтвердить паспорт TF 80 л и совместимость корпуса MF Double-B, арматуры, колокола и опор.
- Взвесить станцию и проверить габарит, крепления и доступ на стадии компоновки.
- Подбор поставщика GL180 на фактическое HLP46 (горячий режим и холодный пуск), сверка потерь PC на сборке.
- Анализ воды, подтверждение совместимости материалов и режимов Bowman.
- Проверка взаимных коллизий и притока воздуха, доступа к извлечению трубного пучка и матов.
- Унаследованный RTF с исходной заявкой 1293 л/мин проверить против потока T-2.6.
- В КД подтвердить монтажный зазор к клеммной коробке ABB и настройку тепловой защиты по 55,1 А.
- CB 1,5 бар при 180 л/мин требует 0,625 кВт по принятому КПД. Уставку уточнить по характеристике PC и фактическому расходу
  ветвей.
