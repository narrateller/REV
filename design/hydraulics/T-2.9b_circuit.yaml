    - 550
    - 1117
    - 100
    reserve_upper_XYZ_mm:
    - 1550
    - 1900
    - 2020
    machine_limit_XYZ_mm:
    - 2100
    - 1900
    - 2200
    fits_outer_box: true
    whole_machine_collision_verified: false
    oil_connections: Два заглушённых отвода CP/CF, разъёмные фланцы, место под кабели двух вентиляторов. Подключение воздушной
      сборки вместо водяной ветви при остановленной машине. Сохраняются FT1/FT2 и параллельная гидравлика исходной опции.
    base_mass_row: T25B-AO
    source_ids:
    - asa
    - baseline
    - criteria
    - t16
