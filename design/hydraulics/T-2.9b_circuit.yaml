    - HP
    - MH
    - MA
    - MB
    - MRA
    - D1
    - D2
    - D3
    pockets:
    - MF
    - MC
    - ZSF
    material: steel
    flexible_hose_allowed: false
  rapid_approach_temperature_modes:
    sensor_valid: oil_tt_valid
    full_speed_conditions:
    - oil_tt_valid
