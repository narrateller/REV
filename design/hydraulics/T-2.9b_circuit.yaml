open_items:
  PC: Кандидат 1,5 кВт. Подтвердить расход при 55 °C, баланс FT1/FT2, полный перепад насоса и пусковой момент с выбранным
    CB. Статус — проверка перед выпуском.
  Bowman:
  - Площадь 2,1 м² и точка воды 150 л/мин.
  - Q и Δp масла чистого/загрязнённого аппарата на HLP46 при 42/45/55 °C.
  - Холодный пуск, вязкость, скорость в трубках, CuNi 90/10, NH₃, сульфиды.
  - Режим воды с EV220B 40 вместо 25, давление и переходы.
