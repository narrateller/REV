    line_loss_bar: [4, 3, 4]  # T-2.6/cycle/sources.yaml inlet, tank and regen drop budgets
    main_regen_changeover_bar: 116
    cam_metering_L_min: 110.44661672776617  # Ограничение скорости 0.15 м/с × площадь поршня башмака Ø125 мм, привод кулачка (0.01227185 м²); calc/T-2.2f/candidates.py drive, A_90 (12 мм / 0,080 с).
    gate_metering_L_min: 309.1798410030395  # Ограничение скорости 1.00 м/с × площадь поршня шибера Ø81 мм (0.00515300 м²); calc/T-1.7d/round2.py OPTIONS.gate_speed_m_s.
