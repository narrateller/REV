cycle_model:
  mechanics:  # Physical geometry from T-1.2b and T-1.7d, updated by T-2.2d/f.
    main_rod_mm: 200  # design/params.t12b.yaml, actual CYM rod; the top-level rod is a legacy proxy
    feed_length_mm: 200  # T-1.2b axis_A, width of the metered plug along CYM
    roof_mm: 90  # T-2.6/sources.yaml study, T-2.2d/f roof geometry
    main_cushion_mm: 25.0  # T-1.7d working_trial.geometry, difference between installed and nominal endpoints
    shoe_travel_mm: 257.0  # T-1.2b working shoe position
    cam_stroke_mm: 12
    cam_resistance_N: 31672.44772222222  # T-2.2f/candidates.py drive key inertia and contact; base T-1.2b mechanical_lock_A
    crosshead_mass_kg: 429.68628343055593  # T-2.6/cycle/sources.yaml 400 kg + T-1.7d moving rods + roof extension steel
    crosshead_accel_m_s2: 5  # T-2.6/cycle/sources.yaml, commissioning bound
    gate_mass_kg: 54.311844808818925  # calc/T-1.7d/study.py case_setup.moving_mass_kg при round2.py TRIAL: 45 кг + Δ массы плиты + Δ массы штока Ø45 мм.
    gate_accel_m_s2: 40.0  # calc/T-1.7d/round2.py OPTIONS.gate_accel_m_s2 (проектный предел разгона).
    gate_travel_mm: 100.0  # calc/T-1.7d/round2.py TRIAL.travel_mm → working_trial.geometry.gate_working_travel_mm.
    gate_close_inset_mm: 10.0
    gate_mu: 0.15  # T-2.6/cycle/evaluate.py gate guide friction
    gate_residual_N: 100000  # T-2.6/sources.yaml residual load case
    gate_breakaway_N: 10000  # T-2.6/cycle/x1_calc.py nominal guide resistance
    gate_close_N: 8000  # T-2.6/cycle/x1_calc.py nominal guide resistance
    rapid_return_resistance_N: 40000  # T-2.6/cycle/x1_calc.py nominal crosshead return resistance
    main_guide_N: 8000  # T-2.6/cycle/x1_calc.py regeneration guide resistance
    pre_guide_N: 5000  # T-1.2 precompaction shoe guides
    pre_return_resistance_N: 6182.73192948  # T-2.6/cycle/compare.py and drive.py, guide and extra shoe gravity
    die_ejection_N: 100000  # T-1.2b shoe_load residual product drag
    transfer_edge_N: 12000  # T-1.2b closed_zone_B / T-2.2d transfer_screen
  material:  # T-1.1/curve.yaml power fit and base Janssen parameters, T-1.2/geometry.py.
    scale_MPa: 56.89401598364152
    exponent: 4.052507610637413
    rho_ref_kg_m3: 90
    rho_join_kg_m3: 400
    density_max_kg_m3: 1457
    lateral_K: 0.45
    wall_mu: 0.25
    axial_springback: 0.23
  outlet:  # T-1.7d/stack.py free guide load and working_trial.geometry.
    section_mm: [158.0, 65.0]
    length_mm: 205.0
    transition_mm: 5.0
    overhang_mm: 110
    guide_mu: 0.5
    crumbs_N: 5000
    side_load_to_weight: 2.0
  process:  # T-2.6/cycle/sources.yaml and design/hydraulics/T-1.6_interlocks.yaml.
    bulk_density_kg_m3: 90
    feed_s: 0.64  # T-2.6/sources.yaml, dose delivery process window
    hold_s: 0.3
    unload_s: 0.2
    valve_switch_s: 0.085  # T-2.6/run.py OperatingPoint and T-2.6/sources.yaml
    handover_interlock_s: 0.02  # T-1.6 interlocks 90 ms less nominal valve allowance 70 ms
    gate_release_cap_bar: 5.0  # T-1.6 interlocks, 3 bar instrument threshold plus up to 2 bar error
  pump:  # T-2.1/sources.yaml, Rexroth RE 92050/92088, MEC OMT3-IE3 and T-2.6 regulator settings.
    curve: [[0, 270, 2, 2], [50, 267, 24, 3], [100, 265, 48, 4], [150, 263, 72, 5], [200, 260, 96, 6], [250, 258, 121, 7], [300, 255, 145, 8], [350, 253, 170, 9]]  # [bar, full-flow L/min, full-swash kW, zero-swash kW] from RE 92050
    map_rpm: 1500
    motor_rpm: 1480
    rated_motor_rpm: 1480
    speed_ceiling_rpm: 1500
    displacement_cm3_rev: 180
    standby_bar: 14
    destroke_s: 0.11
    onstroke_s: 0.105
    control_delay_s: 0.01  # T-2.6/cycle/drive.py PV180Drive, inherited control feedback delay budget
    line_limit_L_min: 265  # design/hydraulics/T-1.6_circuit.yaml P1
    delivery_fraction: 1.0
    regulator_fraction: 1.0
    main_shaft_limit_kW: 33.25  # T-2.6/run.py Scenario, main regulator
    nominal_regulator_kW: 33.5
    combined_shaft_limit_kW: 36
    coupling_loss_kW: 0.15
    torque_tolerance: 0.05
