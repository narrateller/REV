    temperature_C: 50
    map_temperature_C: 50
    viscosity_C_mm2_s: [[40, 46], [100, 6.9]]
    density_kg_m3: 870
    bulk_modulus_Pa: 1400000000
    cap_dead_L: 0.8  # T-2.6 inventory and X-1 pressure-side compliance
    rod_dead_L: 0.4  # T-2.6/cycle/x1_calc.py return-port dead oil allowance
