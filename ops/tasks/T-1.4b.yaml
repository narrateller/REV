id: T-1.4b
stage: S1-hyd
role: HYD
backend: voh            # резерв: alm, bos (запуск строго по одному — песочница Windows)
effort: high
web_search: true        # каталожные данные (поиск на стороне модели; shell без сети)
objective: >
  Довести привод V2 (T-1.4: наполнительный клапан главного цилиндра + PV180 FDV + цилиндры быстрого хода Ø90/50, SB330 НД)
  до цикла ≤ 6,0 с на дозе 0,83 кг с запасом ≥ 0,15 с в реалистичном режиме, по правилу мощности D-OP-07
  (средняя и RMS на валу ≤ 30 кВт, пик ≤ 40 кВт, двигатель 30 кВт S1). Выдать design/params.t14b.yaml с перекрытием фаз,
  проходящий G-PFACE, G-DOSE, G-CYCLE.
inputs:
  - DECISIONS.md                           # D-OP-06, D-OP-07, D-GK-01
  - ops/criteria/design_criteria.yaml      # v3
  - ops/tasks/T-1.4.yaml                   # исходная карточка
  - ops/reports/T-1.4/report.md            # круг 2: сравнение V1/V2/V3, рычаги
  - ops/reports/T-1.4/GK_review.md         # решение ГК, оценки Opus по рычагам
  - calc/T-1.4/                            # x1_calc.py, drive.py, make_params_t14.py, sources.yaml, results.json (только читать; скопировать в calc/T-1.4b/)
  - ops/reports/T-0.3b/GK_review.md        # правила применения гейта
  - ops/reports/T-0.3c/report.md           # peak_kW, idle_kW, RMS, защиты групп
  - calc/T-1.2b/results.json, design/params.t12b.yaml
methods:
  - "Скопировать модель T-1.4 (V2) в calc/T-1.4b/; все изменения против неё перечислить. Реалистичный режим T-1.4 круг 2 оставить базовым: клапаны 70 мс, сброс 0,20 с, линейная перекладка шайбы по каталогу, перепады 4/3/4 бар (или обоснованные расчётом тракта), подпор бака для наполнения. Добавить явный разгон/торможение масс (пуансон, траверса быстрых цилиндров, шибер) рампами, обоснованными допустимым ускорением/давлением торможения."
  - "Привод по D-OP-07: ограничение момента PV180 на пик ≤ 40 кВт (с допуском регулятора +5 % — пик ≤ 40 при задании ~38); RMS и средняя за цикл ≤ 30 кВт по мощности на валу, включая холостые потери насоса (каталог, при рабочих давлениях и в standby). Проверить: опрокидывающий момент двигателя 30 кВт 4p (каталог) против пика с запасом; нагрев двигателя по RMS (S1)."
  - "Скорости (сейчас унаследованные 0,24/0,25 м/с, не обоснованы): возврат и выталкивание до 0,35 м/с, подвод до 0,30 — с расчётом слива поршневой полости (до ~1300 л/мин: Ду, перепад, наполнительный клапан SFA 100 или иной по каталогу), торможением у конца хода. Шибер до 600 мм/с с демпфированием плиты 38 мм. Переход с регенерации на прямой ход — по давлению (70 бар вместо 120, если выгоднее; показать). Каждый рычаг — отдельной строкой: Δt, цена, риск."
  - "Аккумулятор НД: объём так, чтобы дозарядка не съедала выдержку/подачу; выдержку 0,30 с не сокращать без обоснования (её снижение — только чувствительность)."
  - "Эталон: base и high, 90 и 160 кг/м³, подача дозы 0,64 и 0,50 с; доза 1,068 кг (110 мм) — производительность ≥ 498 кг/ч; резерв 300 бар — цикл показать. Оптимистичный и пессимистичный наборы, как в T-1.4 круг 2. Шаг ≤ 2,5 мс со сходимостью."
  - "params.t14b.yaml с группами (генератор calc/T-1.4b/make_params_t14b.py), drive.peak_kW, drive.idle_kW (из каталога), drive.eta — консервативный для давления прессования с объяснением. Наполнительную фазу и быстрые цилиндры, если схема параметров их не описывает, — эквивалентом (фазы и площади) с явным объяснением, что именно упрощено и в какую сторону. Правила гейта: press, выдержка, сброс, подача дозы — без перекрытия с движением других приводов."
  - "Тепло, бак, охладитель, масса станции; требования к T-1.5 (клапаны, логика, блокировки) — обновить по сравнению с T-1.4."
deliverables:
  - calc/T-1.4b/x1_calc.py
  - calc/T-1.4b/drive.py
  - calc/T-1.4b/make_params_t14b.py
  - calc/T-1.4b/sources.yaml
  - calc/T-1.4b/results.json
  - design/params.t14b.yaml
  - report.md
  - metrics.json
  - self_check.json
  - gates.t14b.json
acceptance:
  - "эталон, реалистичный режим, base, подача 0,64 с: цикл ≤ 5,85 с при 90 и 160 кг/м³; пессимистичный — показать"
  - "мощность на валу по эталону: пик ≤ 40 кВт, RMS ≤ 30 кВт, средняя ≤ 30 кВт, включая холостые потери"
  - "гейты на design/params.t14b.yaml: G-PFACE, G-DOSE, G-CYCLE PASS (REV_PYTHON ops/gates/calc_gates.py --params design/params.t14b.yaml --criteria ops/criteria/design_criteria.yaml --out <worktree>/gates.t14b.json); |G-CYCLE − эталон| ≤ 0,15 с или объяснение по фазам"
  - "каталожные величины — из sources.yaml с url и местом чтения"
  - "self_check: двойной прогон даёт побайтно одинаковые results.json и params.t14b.yaml"
allowed_paths: [calc/T-1.4b/**, design/params.t14b.yaml, report.md, metrics.json, self_check.json, gates.t14b.json]
forbidden: [git commit, git push, изменение ops/**, изменение design/params.*.yaml кроме params.t14b.yaml, изменение docs/**, изменение calc/** кроме calc/T-1.4b/**, сеть из shell, выдуманные каталожные данные]
gates: [G-PFACE, G-DOSE, G-CYCLE]
gate_inputs: {params: design/params.t14b.yaml}
timebox_min: 150
stop_and_ask_if:
  - "реалистичный цикл base > 5,85 с при всех рычагах в пределах D-OP-07 — покажи лучший и остаток"
  - "RMS > 30 кВт при цикле ≤ 6 с"
  - "нужно поле, которого нет в design/params.schema.yaml — перечисли, схему не меняй"
