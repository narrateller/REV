id: T-2.2j
stage: S2-tech
role: TECH             # TECH/FEA + HYD: коллектор MA задней крышки ГЦ
backend: bos           # alm/voh — по наличию лимита; запуск строго по одному
effort: high
web_search: false
objective: >
  Коллектор MA задней крышки главного цилиндра по D-GK-08 (H2 T-2.2), D-GK-25 и D-OP-25. Сейчас 8 радиальных ветвей Ø44
  в 51 мм от посадки гильзы пересекают окружность M36 (PCD 450, 16 × Ø39): перемычка 2,395 мм < 10 мм. Объём масла
  под давлением в крышке 4,157 л (MA 2,418 + проход ZSF 1,739). При нём G-CYCLE FAIL по запасу ТF (cap_dead_L ≤ 3,99 л).
  Нужна одна трассировка MA с перемычкой ≥ 10 мм ко всем отверстиям и минимальным объёмом. Без роста потерь
  давления против params.t29b и с FEA крышки с новыми каналами. Наружные размеры крышки Ø520 × 144 и её масса
  не меняются (D-OP-25). Задача не зависит от K сырья.
inputs:
  - DECISIONS.md                           # D-GK-08, D-GK-22…D-GK-25, D-OP-19, D-OP-23…D-OP-25 (только читать)
  - ops/criteria/design_criteria.yaml      # v5: C-STR-01 (1,5 при 315 бар), C-FAT-01 (10⁷), C-HYD-01, C-PERF-01 — только читать
  - design/main_cylinder_rear.t22.yaml     # крышка, ZSF NG100, M36, MA (только читать)
  - ops/reports/T-2.2/GK_review.md, ops/reports/T-2.2/report.md   # H1, H2, M1–M5; методика FEA крышки, проверка Opus
  - calc/T-2.2/ (cap_fea/, vdi2230.py, mass.py, results.json, sources.yaml)   # только читать; копия нужного — в calc/T-2.2j/
  - design/hydraulics/T-2.9b_circuit.yaml, design/hydraulics/T-2.9b_interlocks.yaml   # что соединено с MA: MF, MRC (регенерация MB→MA), остаточные сбросы, датчики (только читать)
  - calc/T-2.9b/params/params.t29b.yaml, calc/T-2.9b/oil_modulus.py, calc/T-2.9b/sources.yaml   # расходы по фазам, потери линий, перечень объёмов (только читать)
  - ops/gates/cycle_model/ (inputs.py: правило запаса ТF; hydraulics.py)   # только читать
  - ops/reports/T-2.3/GK_review.md, ops/reports/T-2.3/report.md, calc/T-2.3/   # диагностика объёма крышки и скан cap_dead_L
tools:
  python: E:/Tools/Python313/python.exe     # REV_PYTHON
  freecadcmd_sandbox: E:/Tools/FreeCAD-1.1/bin/freecadcmd.exe
methods:
  - "Расходы MA. Из T-2.9b (схема и params.t29b) — таблица фаз: какие потоки идут через MA (прессование от насоса, регенерация MB→MA, декомпрессия, остаточный сброс, прочие), пиковый расход и допустимый перепад. Требование: потери давления нового коллектора на каждой фазе ≤ потерь действующей трассировки (8 × Ø44 + DN125), которые заложены в params.t29b. Расчёт — Дарси + местные сопротивления, с источником коэффициентов. Входы cycle_model не меняются."
  - "Трассировка — одна (параллельные варианты в FEA не вести). Ручной отбор ≤ 3 схем: таблица объём, перемычки, потери, сверлимость. Затем FEA только выбранной. Ориентир — осевые сверления с заднего торца в полость A внутри окружности M36, коллектор или фланец блока MF/MA на заднем торце. Радиальные ветви через PCD 450 запрещены, если перемычка < 10 мм. Перемычка ≥ 10 мм к: M36 (Ø39), глухим отверстиям шпилек ZSF M27 (8 шт.), проходу ZSF Ø124, посадке и уплотнению гильзы, зоне инструмента и гаек MJT/Superbolt (H1). Сверлимость: длина и диаметр с уводом сверла (L/D, допуск увода — с источником); пересечения каналов с галтелью ≥ R из T-2.2."
  - "Объём. V_cover — масло под давлением прессования в крышке (проход ZSF + MA + отводы) и в коллекторе/блоке до седла MF. Цель: MA + блок ≤ 1,5 л; V_cover + 0,8 ≤ 3,99 л (правило запаса ТF гейта при oil_L 55). Расчёт двумя методами: аналитически и по объёму тел каналов (BRep FreeCAD или Gmsh). Расхождение ≤ 2 %."
  - "FEA крышки с новыми каналами — методика T-2.2 (cap_fea: Gmsh, тот же решатель, граничные условия, преднатяг M36 и шпилек ZSF, давление 315 бар — C-STR-01, размах 0–300 бар — C-FAT-01). Три уровня сетки с локальным сгущением у пересечений каналов, сходимость пика ≤ 5 %. Требования: статика ≥ 1,5 при Rp0,2 650 МПа (и значение при табличном 600), FKM ≥ 1,0 с Kt пересечений. Сравнение с T-2.2 (статика 1,526, FKM 1,41–1,46) в тех же точках и в новых пиках. Независимая ручная оценка (Roark или Ламе + Kt пересечения) — для проверки порядка."
  - "Масса. Масса крышки ≤ T-2.2 (заготовка 184,28 кг в ведомости; каналы её только уменьшают). Коллектор или фланцевый блок вне крышки — отдельной строкой ведомости с массой (каталог или расчёт). Δм машины A против station.t29b / D-GK-24 — построчно."
  - "G-CYCLE. calc/T-2.2j/params/params.t22j.yaml — копия calc/T-2.9b/params/params.t29b.yaml. Меняется только oil.cap_dead_L = 0,8 + V_cover, с комментарием и ссылкой на расчёт. Прочие объёмы вне цилиндра (P0/HP, MH, MF/MC) и податливость — в T-2.3 круг 2, здесь не добавлять. Справочный скан штатным гейтом: таблица cap_dead_L | цикл | RMS | запас ТF."
  - "Результат: design/main_cylinder_rear.t22j.yaml — копия t22 с новой трассировкой MA (координаты, диаметры, перемычки, объём, присоединение блока) и результатами FEA. t22 не трогать. report.md пишется из Python в UTF-8; проект строки D-GK — в конце (ГК вносит сам). self_check: двойной прогон расчётов даёт побайтно одинаковые results.json и params.t22j.yaml (FEA — с фиксированным seed и одинаковой сеткой или сравнение результатов до 1e-6). Временные каталоги и сетки > 5 МБ удалить."
deliverables:
  - design/main_cylinder_rear.t22j.yaml
  - calc/T-2.2j/                              # трассировка, потери, объём, FEA (скрипты .geo/.py, json результатов), mass, params/params.t22j.yaml, sources.yaml, results.json; ≤ 10 МБ
  - report.md
  - metrics.json                              # layout, ma_channels (n, d_mm, L_mm), ligament_min_mm (to M36, ZSF studs, ZSF bore, barrel seat), dp_by_phase_bar_new, dp_by_phase_bar_t29b, V_MA_block_L, V_cover_L, V_cover_L_method2, static_factor_Rp650, static_factor_Rp600, fkm_factor, mesh_convergence, cover_mass_kg, block_mass_kg, machine_A_delta_kg, cycle_gate_s, rms_kW, tf_buffer_ok, cap_dead_scan
  - self_check.json
  - gates.t22j.json
acceptance:
  - "перемычка ≥ 10 мм ко всем отверстиям и посадкам (таблица минимумов с координатами); радиальных ветвей через PCD 450 нет"
  - "потери давления коллектора на каждой фазе ≤ действующих (params.t29b), входы cycle_model не меняются"
  - "V_cover + 0,8 ≤ 3,99 л; цель MA + блок ≤ 1,5 л; два метода объёма расходятся ≤ 2 %"
  - "FEA: статика ≥ 1,5 (Rp 650), FKM ≥ 1,0, сходимость пика ≤ 5 %; ручная проверка порядка"
  - "масса крышки ≤ 184,28 кг (заготовка), наружные размеры Ø520 × 144 без изменений; блок — строкой ведомости, Δм машины A ≤ +5 кг"
  - "G-PFACE, G-DOSE, G-CYCLE PASS на calc/T-2.2j/params/params.t22j.yaml (REV_PYTHON ops/gates/calc_gates.py --params calc/T-2.2j/params/params.t22j.yaml --criteria ops/criteria/design_criteria.yaml --out <worktree>/gates.t22j.json), отличие от params.t29b — только cap_dead_L"
  - "источники с местом чтения в sources.yaml; report.md без «?» (проверено чтением)"
allowed_paths: [design/main_cylinder_rear.t22j.yaml, calc/T-2.2j/**, report.md, metrics.json, self_check.json, gates.t22j.json]
forbidden: [git commit, git push, изменение ops/**, изменение существующих design/** (main_cylinder_rear.t22.yaml, гидросхема T-2.9b, station.t29b — только читать), изменение calc/** кроме calc/T-2.2j/**, изменение docs/**, сеть из shell, выдуманные свойства и коэффициенты, изменение наружных размеров крышки Ø520 × 144, материала и ТУ поковки, M36 (число, PCD, диаметр), ZSF NG100 и его крепления, гильзы и хода ГЦ, функции гидросхемы T-2.9b, входов cycle_model кроме oil.cap_dead_L, уменьшение cap_dead_L ниже 0,8 + V_cover, параллельные варианты в FEA]
gates: [G-PFACE, G-DOSE, G-CYCLE]
gate_inputs: {params: calc/T-2.2j/params/params.t22j.yaml}
timebox_min: 240
stop_and_ask_if:
  - "ни одна трассировка не даёт перемычку ≥ 10 мм без изменения наружных размеров крышки, M36 или ZSF — дать лучший вариант и минимальную перемычку"
  - "потери нового коллектора выше действующих хотя бы на одной фазе — дать таблицу и влияние на цикл (скан гейтом, без изменения входов)"
  - "FEA: статика < 1,5 или FKM < 1,0 — дать пики, место, сходимость"
  - "V_cover + 0,8 > 3,99 л или Δм машины A > +5 кг — дать цифры"
