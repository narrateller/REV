id: T-2.5b
stage: S2-hyd
role: HYD
backend: bos            # alm/voh — по наличию лимита; запуск строго по одному
effort: high
web_search: true        # каталоги: водомасляные охладители (кожухотрубные, пластинчатые), водяные клапаны и арматура, моторы 30 кВт S1 Al B5, предохранительные клапаны TF, ГА, картриджи
objective: >
  Гидростанция схемы A с базовым водомасляным охладителем по D-OP-20 (вместо 2 × ASA0567, строки T25-E1_E2 165,4 + T25-E_hardware 8,0 кг)
  и зачёт условных мер T-2.5 (группа B) по паспортам. Функция гидравлики T-2.6 не меняется.
  База: станция T-2.5 — 1780,56 кг (design/hydraulics/station.t25.yaml, mass_kg, с поправкой ГА +30); машина схемы A с поправкой ГА
  5253,28…5296,63 кг (ops/reports/T-2.5/metrics.json, machine_A_corrected_kg_range; три варианта T-2.2i, приёмка — по верхней границе).
  Цель: машина схемы A ≤ 5000 кг по верхней границе диапазона. Ориентир: охладитель −149 кг (T-2.5, Parker PWO, без арматуры и воды —
  верхняя оценка), группа B −132,8 кг условно (мотор Al −71, TF −19,06, LP −14, DB → картриджи −11,88, стенки бака −8,92, бак как основание −7,96).
  Итог — ведомость станции T-2.5b построчно, тепловой расчёт охладителя, требования к воде площадки, перечень мер «зачтено / не зачтено» с источниками,
  масса машины схемы A.
inputs:
  - DECISIONS.md                           # D-OP-09 (опция воздушного охлаждения), D-OP-11, D-OP-16, D-OP-17, D-OP-19, D-OP-20, D-GK-02, D-GK-18, D-GK-19
  - ops/criteria/design_criteria.yaml      # v4: C-MASS-01, C-PWR-01, C-PERF-01, C-HYD-01, C-ENV-01
  - design/hydraulics/station.t25.yaml, calc/T-2.5/ (results.json: station_mass, machine_mass, heat, cooling_selection, measures, tank; heat.py, cooling.py, mass.py, measures.py, sources.yaml), ops/reports/T-2.5/GK_review.md, ops/reports/T-2.5/metrics.json   # база (только читать)
  - calc/T-2.6/params/params.t26a.yaml (раздел cycle_model), ops/gates/cycle_model/ (только читать), ops/reports/T-0.4/GK_review.md   # G-CYCLE на эталонной модели: A 5,905 с, RMS 29,987 кВт
  - design/hydraulics/T-1.6_circuit.yaml, design/hydraulics/T-1.6_interlocks.yaml, calc/T-2.6/inventory.csv   # схема и контур охлаждения PC / E1/E2 (только читать)
methods:
  - "Тепло: принять тепло эталона T-2.6 по T-2.5 (номинал 20,01 кВт, неблагоприятное 19,34; проверка Opus 19,8) без пересчёта модели; требуемая холодопроизводительность Q_req = max(1,25 × 20,01; 25,0) кВт при масле ≤ 55 °C (на входе в охладитель — по сливу из бака, указать, какая температура нормируется). Коэффициент 1,25 сохраняется (D-OP-20)."
  - "Охладитель: водомасляный, базовое исполнение — кожухотрубный (устойчив к воде площадки) либо пластинчатый с фильтром и с обоснованием; сравнить ≥ 3 аппарата разных производителей по каталогу с url (масса сухая и с водой, характеристика kW при ΔT/расходах, Δp масла и воды, материалы трубок). Загрязнение: холодопроизводительность в загрязнённом состоянии = меньшее из (а) каталог × 0,85 допуск × 0,85 загрязнение и (б) пересчёт U с сопротивлениями загрязнения TEMA (вода оборотная ≥ 0,00035 м²·К/Вт, масло ≥ 0,000176 м²·К/Вт, источник). Q_dirty ≥ Q_req при расчётной воде площадки; Δp масла при расходе PC не больше действующей ветви (≤ 1,25 бар) или показать, что PC 0,55 кВт его даёт."
  - "Вода площадки (требование к заказчику, в массу машины не входит): расчётная температура на входе 30 °C (базовая; показать предельную температуру на входе, при которой Q_dirty = Q_req, и кривую 15…35 °C), расход при ΔT воды ≤ 10 K, давление подачи и допустимый Δp аппарата, качество воды (pH, жёсткость, хлориды, взвесь, фильтрация) по таблице производителя выбранного аппарата, защита от замерзания и слив. Регулирование: термостатический или электромагнитный водяной клапан по температуре масла (без переохлаждения и с экономией воды) — в составе станции."
  - "Масса станции: снять T25-E1_E2 и T25-E_hardware (173,4 кг) один раз; добавить построчно с источником: аппарат с водой, крепление, водяная обвязка станции до фланца-интерфейса на краю станции (клапан регулирования, фильтр-грязевик, шаровые краны, датчики температуры/расхода, трубы/рукава, слив), изменение контура PC и масляной обвязки охладителя. Строки без каталожной массы — проектный резерв с обоснованием, не ноль. Контур площадки вне границы."
  - "Опция воздушного охладителя (D-OP-20): место (габарит 2 × ASA0567 или иного аппарата той же холодопроизводительности по T-2.5) в пределах C-ENV-01 и присоединения по маслу (тройники/заглушенные фланцы, место под кабель вентиляторов) — масса присоединений в базе, масса аппарата нет; установленная мощность с опцией ≤ 34,2 кВт (C-PWR-01), без опции — указать."
  - "Условные меры T-2.5 (группа B): зачесть только подтверждённые источником с url для точного исполнения. Мотор: паспорт/лист данных 30 кВт S1 IE3+ в алюминиевом корпусе именно IM B5 (масса, номинальная частота, момент опрокидывания, посадка под колокол A4VSO180); при изменении частоты — копия params `calc/T-2.5b/params/params.t25b.yaml` (отличается от params.t26a.yaml только полями мотора в cycle_model.pump с источником, в пределах квалифицированных границ T-0.4) и G-CYCLE на ней. TF: паспорт предохранительного клапана — масса и пропускная способность при допустимом превышении над уставкой против наибольшего притока в TF по модели T-2.6 (вязкость HLP46). LP: масса выбранного аккумулятора по паспорту ставится в строку LP вместо пары «поправка ГА + мера EHV» (без двойного счёта; номинал ≥ 330 бар, объём 20 л). DB → картриджи: паспортное давление ≥ 315 бар с запасом и расход; динамика — открытый пункт для образца (D-OP-11). Стенки бака 3 мм с рёбрами и бак как основание: расчёт с методом и источником (гидростатика, подъём, транспорт, соосность муфты); иначе не зачитывать."
  - "Масса машины: пересчитать machine_A_corrected_kg_range (три варианта T-2.2i) по ведомости T-2.5b; база сверена с T-2.5 до 0,1 кг; каждая строка T-2.5 снимается не более одного раза."
  - "Цикл: гидравлика T-2.6 по функции не меняется; G-CYCLE (D-GK-19, эталонная модель) на params.t26a.yaml — без изменений (5,905 с); при замене мотора — G-CYCLE на params.t25b.yaml: цикл ≤ 5,910 с (A 5,905 + допуск сходимости гейта 0,005 с) и RMS ≤ 30,0 кВт, иначе мотор не зачитывается."
  - "Итог: design/hydraulics/station.t25b.yaml (полный, самодостаточный: ведомость построчно с источниками, охладитель и тепловой расчёт, требования к воде площадки, опция воздуха, бак, мотор, цикл), docs/site/cooling_water_requirements.md (требования к воде площадки для КД и договора), проект D-GK в report.md (ГК вносит сам)."
deliverables:
  - calc/T-2.5b/                           # cooler.py, mass.py, measures.py, report.py, sources.yaml, results.json, params/params.t25b.yaml (если мотор меняется); ≤ 5 МБ
  - design/hydraulics/station.t25b.yaml
  - docs/site/cooling_water_requirements.md
  - report.md
  - metrics.json                           # station_t25_kg, station_t25b_kg, cooler_model, cooler_wet_kg, water_hardware_kg, cooling_required_kW, cooling_dirty_kW, water_inlet_design_C, water_inlet_max_C, water_flow_L_min, water_dp_bar, credited_measures_kg, credited_measures, machine_A_kg_range, installed_kW, installed_with_air_option_kW, cycle_gate_s, rms_kW
  - self_check.json
  - gates.t25b.json
acceptance:
  - "машина схемы A ≤ 5000 кг по верхней границе диапазона трёх вариантов T-2.2i, построчно с источниками, без двойного счёта; база сверена с T-2.5 (1780,56 / 5253,28…5296,63 кг)"
  - "Q_dirty выбранного охладителя ≥ Q_req (≥ 25,01 кВт) при воде 30 °C и масле ≤ 55 °C, оба способа учёта загрязнения; Δp масла в пределах контура PC"
  - "требования к воде площадки полные (температура, расход, давление, Δp, качество, фильтрация, замерзание) и согласованы с паспортом аппарата"
  - "опция воздушного охладителя: место и присоединения в ведомости и в габарите C-ENV-01; установленная с опцией ≤ 34,2 кВт"
  - "условные меры зачтены только с паспортом точного исполнения; незачтённые — в перечне с причиной и Δм"
  - "функция гидравлики T-2.6 не изменена; гейты G-PFACE, G-DOSE, G-CYCLE PASS на calc/T-2.6/params/params.t26a.yaml (REV_PYTHON ops/gates/calc_gates.py --params ... --criteria ops/criteria/design_criteria.yaml --out <worktree>/gates.t25b.json), method reference_model; при замене мотора — то же на params.t25b.yaml, цикл ≤ 5,910 с, RMS ≤ 30,0 кВт"
  - "свойства и каталожные данные — sources.yaml с url; self_check: двойной прогон даёт одинаковые results.json и station.t25b.yaml; report.md пишется из Python в UTF-8 и проверяется чтением на отсутствие «?»; временные каталоги удалить"
allowed_paths: [calc/T-2.5b/**, design/hydraulics/station.t25b.yaml, docs/site/cooling_water_requirements.md, report.md, metrics.json, self_check.json, gates.t25b.json]
forbidden: [git commit, git push, изменение ops/**, изменение существующих design/*.yaml и design/hydraulics/* (station.t25.yaml — только читать), изменение docs/** кроме docs/site/cooling_water_requirements.md, изменение calc/** кроме calc/T-2.5b/**, сеть из shell, выдуманные свойства, массы и коэффициенты, масса водяного контура площадки в массе машины, автономный водяной контур (насос, градирня) в базе, отказ от коэффициента 1,25, мотор ≠ 30 кВт S1, насос другого типоразмера или регулятора, изменение функции схемы T-2.6, установленная > 34,2 кВт, изменение силовой части машины (камера, рама, главный цилиндр, задняя крышка — D-OP-19, D-OP-20), уменьшение бака 190 л (D-GK-18), изменение критериев и порогов]
gates: [G-PFACE, G-DOSE, G-CYCLE]
gate_inputs: {params: calc/T-2.6/params/params.t26a.yaml}
timebox_min: 150
stop_and_ask_if:
  - "после всех подтверждённых мер машина схемы A по верхней границе > 5000 кг — остановиться: таблица мер (зачтено / условно / не зачтено, Δм), масса машины по трём вариантам, недостающие килограммы до 5000 и до 5080"
  - "ни один водомасляный охладитель с каталожной массой не даёт Q_dirty ≥ Q_req при воде 30 °C — доложить предельную температуру воды и массу"
  - "водомасляное охлаждение требует изменения контура масла T-2.6 (расход, давление, место врезки) сверх замены аппарата в ветви PC — доложить"
  - "ключевая замена (охладитель, мотор) не подтверждается каталогом с массой и характеристикой — не принимать в итог, доложить"
