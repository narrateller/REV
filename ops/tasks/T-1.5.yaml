id: T-1.5
stage: S1-hyd
role: HYD
backend: voh            # резерв: alm, bos (запуск строго по одному — песочница Windows)
effort: high
web_search: true        # каталоги клапанов, охладителей, баков (поиск на стороне модели; shell без сети)
objective: >
  (A) Принципиальная гидросхема привода D-GK-02 по ISO 1219-1/-2: машиночитаемый перечень элементов и связей (источник
  истины) и сгенерированная из него схема; клапаны с типоразмерами по каталогам; таблица блокировок фаз по датчикам.
  (B) Облегчение и бюджет массы машины по D-OP-08 (цель 4000 кг, предел 5000): гидростанция (бак, масло, рама станции,
  охладитель) и главный цилиндр (стенка, крышки, встройка в раму) + оценка массы всей машины по узлам.
  Цикл ≤ 6 с (C-PERF-01), мощность по D-OP-07 и давления по C-HYD-01 не ухудшать.
inputs:
  - DECISIONS.md                           # D0, D-OP-06, D-OP-07, D-OP-08, D-GK-01, D-GK-02
  - ops/criteria/design_criteria.yaml      # v3
  - ops/reports/T-1.2b/GK_review.md, ops/reports/T-1.4b/GK_review.md, ops/reports/T-1.3/GK_review.md   # все передачи в T-1.5
  - ops/reports/T-1.4b/report.md, ops/reports/T-1.3/report.md
  - calc/T-1.4b/                           # модель привода и цикла (только читать; для прогона — копия в calc/T-1.5/)
  - calc/T-1.3/, design/cylinders.t13.yaml # цилиндры, массы (только читать)
  - design/params.t14b.yaml                # эквивалент для гейта
methods:
  - "Схема (A): design/hydraulics/T-1.5_circuit.yaml — элементы (id, тип по ISO 1219, изготовитель/серия/типоразмер, Ду, расход и давление расчётные, уставка), порты и линии (P, T, A, B, X, Y, L, напорная/сливная/пилот/дренаж), датчики (давление, положение, уровень, температура). Схема в виде SVG генерируется скриптом calc/T-1.5/draw_circuit.py из YAML (символы ISO 1219 упрощённо, читаемая компоновка по контурам: насосная станция, главный цилиндр с наполнением и регенерацией, быстрые цилиндры, подпрессовка с засовами, шибер, ГА НД, охлаждение/фильтрация, пилот)."
  - "Обязательные функции из ревизий: насос PV180 FDV + внешний регулятор мощности (уставка 36 кВт по карте мощности на валу с потерями на нулевой подаче), независимая отсечка 300 бар и предохранительный 315; разгрузка остаточной подачи при переходах; наполнительный клапан ZSF NG100 с баком под подпором 0,45 бар без контакта масла с газом (мембрана/эластичная ёмкость/азот), деаэрация, датчик подпора — блокировка быстрого хода; регенерация и переход на прямой ход; запирание поршневой полости на выдержку (заряд ГА НД в это время); декомпрессия через дроссель ≈Ø8,5 + датчик ≤ 5 бар — разрешение открытия шибера; подпрессовка: локальные сбросы A/B на ~480 л/мин (≤ 315 бар пик), независимый сброс главной полости при потере подтверждения засова; приоритет потоков хвостовой группы (выталкивание, возврат, закрытие шибера, подъём башмака); ГА SB330 20 л с предохранительным блоком (сброс, отсечка, манометр) по EN ISO 4413 / EN 14359; 2WRCE B→A при высоком давлении, пилот 150 бар с накопителем; фильтрация (напорная/сливная, класс чистоты для пропорциональных клапанов) и охлаждение отдельным контуром."
  - "Перепроверить по каталогам (url + место чтения): ZSF RE 20478 — 1600 л/мин при 0,30 бар (ссылка в T-1.4b не открывалась); DB NG32 RE 25802 — расход и характеристика для сброса подпрессовки; охладитель — следующий типоразмер LAC или подтверждённая точка (тепло 18,7 кВт с допусками, воздух +40 °C, масло ≤ 55 °C)."
  - "Блокировки (A): design/hydraulics/T-1.5_interlocks.yaml — для каждой фазы цикла (по params.t14b / эталону T-1.4b): условия разрешения (датчики, пороги), действие при потере сигнала, какие клапаны включены. Полнота: каждая фаза эталона и каждое движение имеют путь потока через перечисленные клапаны; каждая блокировка ссылается на существующий датчик. Проверка — скриптом calc/T-1.5/check_circuit.py (выход в results.json)."
  - "Облегчение (B): бюджет массы машины по узлам (рама — оценка по силовому пути 1,94 МН и 10⁷ циклов, двумя вариантами: стяжная колонная и сварная плитная; траверса с пуансоном ≤ 234 кг или пересчёт цикла; камера, засовы, шибер; цилиндры; станция; подача/бункер; ограждения; электрика). Станция: объём бака (обосновать: деаэрация, тепловой режим с охладителем, объём ГА и цилиндров, минимум уровня) — цель существенно меньше 430 л; масса масла, рамы станции, насоса с двигателем; главный цилиндр: стенка ~35 мм по чистому Ламе с C-STR-01 1,5 при 315 бар без зависимости от преднатяга, или днище/фланец во встройке в раму — масса и последствия. Итог: таблица «узел | T-1.3 | после облегчения | источник», сумма против 4000/5000 кг."
  - "Если меняются площади/объёмы, влияющие на цикл (бак — нет; цилиндр — только стенка) — прогнать эталон копией calc/T-1.4b и гейты; иначе указать, что params.t14b в силе."
deliverables:
  - design/hydraulics/T-1.5_circuit.yaml
  - design/hydraulics/T-1.5_circuit.svg     # генерируется
  - design/hydraulics/T-1.5_interlocks.yaml
  - calc/T-1.5/draw_circuit.py
  - calc/T-1.5/check_circuit.py
  - calc/T-1.5/mass_budget.py
  - calc/T-1.5/sources.yaml
  - calc/T-1.5/results.json
  - report.md                               # перечень клапанов с типоразмерами, таблица блокировок (кратко), бюджет массы, охладитель, что осталось на стенд
  - metrics.json
  - self_check.json
  - gates.t15.json
acceptance:
  - "check_circuit.py: 0 фаз без пути потока, 0 блокировок со ссылкой на несуществующий датчик, 0 элементов без типоразмера или с давлением ниже расчётного"
  - "все обязательные функции из methods присутствуют в circuit.yaml (перечень с id в report.md)"
  - "бюджет массы с суммой и источником каждой строки; если > 4000 кг — список дальнейших мер с оценкой; если > 5000 — остановиться"
  - "гейты G-PFACE, G-DOSE, G-CYCLE PASS (REV_PYTHON ops/gates/calc_gates.py --params design/params.t14b.yaml --criteria ops/criteria/design_criteria.yaml --out <worktree>/gates.t15.json)"
  - "каталожные величины — из sources.yaml с url; self_check: двойной прогон скриптов даёт побайтно одинаковые results.json, circuit.svg"
allowed_paths: [design/hydraulics/**, calc/T-1.5/**, report.md, metrics.json, self_check.json, gates.t15.json]
forbidden: [git commit, git push, изменение ops/**, изменение design/params.*.yaml, design/cylinders.t13.yaml, изменение docs/**, изменение calc/** кроме calc/T-1.5/**, сеть из shell, выдуманные каталожные данные, CAD]
gates: [G-PFACE, G-DOSE, G-CYCLE]
gate_inputs: {params: design/params.t14b.yaml}
timebox_min: 150
stop_and_ask_if:
  - "бюджет массы после облегчения > 5000 кг"
  - "обязательная функция не реализуема каталожными элементами без ухудшения цикла > 0,1 с"
