id: T-1.1
stage: S1-tech
role: TECH
backend: voh            # резерв: alm, bos (запуск строго по одному — песочница Windows)
effort: high
web_search: true        # 25.11 оператор: Codex с веб-поиском (поиск на стороне модели; shell без сети)
objective: >
  Модель уплотнения древесных опилок в закрытой камере 150 × 60 мм без нагрева: зависимость давления на торце пуансона
  от средней плотности p(ρ) от насыпной (90–160 кг/м³) до 1250 кг/м³, коэффициент бокового давления K, трение о стенку μ,
  осевое упругое восстановление после выхода. Основа — опубликованные экспериментальные данные, а не подгонка под проект.
  Это закрывает главный открытый риск M-1/X-1: обе их кривые сценарные (docs/M-1_master_calc.md §4, §8).
inputs:
  - ops/criteria/design_criteria.yaml      # C-RAW-01 (сырьё 8–12 %, фракция ≤ 3,15 мм), C-PROD-03 (≥ 1000 кг/м³ после выхода), C-PFACE-01
  - DECISIONS.md                           # D0: закрытая камера, подпрессовка, один главный цилиндр
  - docs/M-1_master_calc.md                # §4 кривая-заглушка, §8 итог X-1
  - ops/reports/X-1/report.md              # сценарный степенной закон X-1, чувствительность
  - calc/X-1/x1_calc.py                    # только читать: прогон чувствительности цикла с новой кривой
methods:
  - "Источники: не меньше 3 независимых экспериментальных работ по одноосному прессованию древесины/опилок (хвойные и лиственные, влажность 6–15 %, без нагрева или с указанием температуры) в закрытой матрице. Ориентиры по теме: работы по уплотнению древесных остатков при высоком давлении (Li & Liu), по пеллетированию в одиночной матрице (Stelte, Holm, Nielsen), обзоры Kaliyan & Morey, Tumuluru, работы Mani/Tabil/Sokhansanj с моделями Kawakita/Cooper–Eaton/Panelli–Filho."
  - "Из каждого источника выписать: материал, влажность, фракция, диаметр матрицы и отношение высоты к диаметру, температура, скорость, выдержка, диапазон давлений; точки (давление, плотность под нагрузкой и/или после выхода) с номером таблицы/рисунка. Оцифровка с рисунка — пометка digitized и оценка погрешности."
  - "Привести всё к одному определению: давление на торце пуансона ↔ средняя плотность ПОД нагрузкой. Плотность после выхода — отдельно, через упругое восстановление. Различие плотности под нагрузкой и после выхода не смешивать."
  - "Трение о стенку: поправка Янссена для камеры 150 × 60 (гидравлический диаметр 85,7 мм) и длины брикета 80–110 мм; K и μ — из литературы с вилкой. Показать, как p на торце соотносится со средним давлением в брикете и с давлением на шибере (противодержателе)."
  - "Подгонка минимум двух моделей (например, Kawakita, Panelli–Filho, степенной закон или Heckel) по объединённым данным; кривые base / low / high, где low/high — огибающая разброса источников и влажности 8–12 %."
  - "Следствия для проекта при доза 0,83 кг, сечение 9 000 мм²: (а) давление на торце для ρ после выхода = 1000 кг/м³ с учётом восстановления; (б) ρ под нагрузкой и длина брикета при 166,7 МПа; (в) работа уплотнения ∫p dV от 461 кг/м³ (после подпрессовки) и длина участка хода выше 120 бар в главном цилиндре Ø280/200; (г) сила подпрессовки для 90 → 461 кг/м³ в окне 150 × 200 мм; (д) время цикла с новой кривой — прогоном копии calc/X-1/x1_calc.py (копия в calc/T-1.1/, исходник не менять), вариант перекрытие + аккумулятор 5 л, Q 360 л/мин."
  - "Сравнение при 1000 кг/м³: давление по новой кривой против M-1 (80 МПа) и X-1 (80,8 МПа)."
deliverables:
  - calc/T-1.1/sources.yaml       # по каждому источнику: authors, year, title, journal, volume, pages, doi (или null), doi_verified: false, material, moisture_pct, particle_mm, die, temperature_C, points[]: {p_MPa, rho_loaded_kg_m3 | rho_relaxed_kg_m3, where: "Table 2" | "Fig. 4 (digitized)"}, confidence
  - calc/T-1.1/compaction.py      # загрузка sources.yaml, подгонка, кривые, следствия; запуск без сети
  - calc/T-1.1/curve.yaml         # машиночитаемо: таблица ρ_loaded 90…1250 шаг ≤ 25 кг/м³ → p_MPa {low, base, high}; K, μ, springback {low, base, high}; модель и параметры
  - calc/T-1.1/results.json
  - report.md
  - metrics.json
  - self_check.json
acceptance:
  - "каждое число в curve.yaml и в report.md прослеживается до точки в sources.yaml или помечено как допущение с обоснованием"
  - "DOI не выдумывать: если не уверен в DOI — doi: null и полная библиографическая ссылка; у всех источников doi_verified: false (проверяет ГК)"
  - "для каждого источника: url — страница, где ты прочитал данные; read: abstract | full_text | table_only; числа брать только из прочитанного текста или таблиц, не из памяти; если точки только на рисунке, а рисунок недоступен — точку не вводить, отметить в sources.yaml"
  - "таблица следствий (а)–(д): величина | M-1 | X-1 | T-1.1 base | low | high"
  - "явный вывод: хватает ли 166,7 МПа на торце для ρ ≥ 1000 кг/м³ после выхода при влажности 8–12 % и фракции ≤ 3,15 мм; с каким запасом"
  - "self_check: прогон compaction.py дважды даёт одинаковый results.json; подгонка — остаточная ошибка по каждому источнику"
allowed_paths: [calc/T-1.1/**, report.md, metrics.json, self_check.json]
forbidden: [git commit, git push, изменение ops/**, изменение design/**, изменение docs/**, изменение calc/M-1/**, изменение calc/X-1/**, сеть из shell (curl, pip, git fetch), выдуманные данные или DOI]
timebox_min: 120
stop_and_ask_if:
  - "найдено меньше 3 источников с точками давление–плотность для древесины — остановиться, перечислить, что есть, и что нужно от оператора"
  - "давление на торце для ρ после выхода = 1000 кг/м³ по base-кривой > 166,7 МПа (концепция силы под вопросом)"
  - "base-кривая отличается от M-1 больше чем вдвое по давлению при ρ = 1000 кг/м³"
# дополнено ГК 25.11 (круг 2): круг 1 остановлен по стоп-условию — локальных источников нет, сеть была запрещена.
#  Теперь доступен веб-поиск (Responses web_search). Приоритет — открытый доступ с таблицами в тексте (MDPI, BioResources,
#  PLOS, Elsevier OA, диссертации/отчёты университетов). Минимум 3 независимые работы с точками давление–плотность.
#  Если и с поиском меньше 3 — остановись, перечисли найденное (с url) и что нужно от оператора.
