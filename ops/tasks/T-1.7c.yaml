id: T-1.7c
stage: S1-str
role: TECH
backend: voh            # резерв: alm, bos (запуск строго по одному — песочница Windows)
effort: high
web_search: true        # брикетировочные прессы с каналом выдачи, трение древесного брикета о сталь, литература (поиск на стороне модели; shell без сети)
objective: >
  Устранить дефект силового пути шибера (D-GK-01, T-1.7b): одно сравнительное исследование интерфейса выдачи брикета.
  Основной вариант (1) — канал выдачи через торец камеры рамы со «стопкой» брикетов: шибер вплотную к торцу, опора по контуру
  канала, каждый новый брикет проталкивает предыдущие. Базы сравнения — коротким ручным расчётом без объёмной FEA:
  (2) убирающаяся нижняя опора шибера с сохранением падения; (3) полная осевая выдача через торец с ходом ≥ 454 мм.
  Выбрать один, дать проект решения D-GK-04 и для выбранного — прочность узла шибера/канала, выдачу, цикл, массу.
inputs:
  - DECISIONS.md                           # D0, D-OP-06, D-GK-01 (шибер, засовы, перебег), D-GK-02
  - ops/criteria/design_criteria.yaml      # v3: C-PROD-01..03, C-PFACE-01, C-PERF-01, C-STR-01, C-FAT-01, C-CLR-01, C-MASS-01, C-ENV-01
  - ops/reports/T-1.7b/GK_review.md, ops/reports/T-1.7b/report.md   # причина дефекта, геометрия 205/243/433 мм, контакт, сила открытия
  - ops/reports/T-1.7/GK_review.md, design/frame.t17.yaml, calc/T-1.7/   # рама и FEA (только читать; копия в calc/T-1.7c/)
  - design/slide_gate.t17b.yaml, calc/T-1.7b/                        # модели шибера/контакта (только читать)
  - ops/reports/T-1.2b/GK_review.md, calc/T-1.2b/results.json, calc/X-1/   # геометрия камеры, восстановление длины брикета, сопротивление выдаче 100 кН
  - calc/T-1.1/curve.yaml                   # p(ρ) base/high
  - calc/T-1.4b/, design/params.t14b.yaml   # модель цикла (только читать; для прогона — копия)
  - design/cylinders.t16.yaml               # быстрые цилиндры 2 × Ø90/50 — выталкивание
methods:
  - "Вариант (1), технология: канал сечением по брикету после упругого восстановления (C-PROD-01: 150 × 60 ± 1, восстановление по T-1.2b/X-1) с обоснованным уклоном/расширением; длина канала = глубина торца камеры (205 мм по T-1.7, уточнить) → число брикетов в стопке при длине 40…110 мм (C-PROD-02). Сопротивление проталкиванию стопки: боковое давление восстановления брикета × периметр × длина × μ (μ древесина/сталь — источник с url; диапазон 0,2…0,5), с температурой и влажностью как вилкой; сравнить с 100 кН X-1. Влияние сопротивления стопки на плотность (противодавление не участвует при закрытом шибере — показать) и на силу/время выталкивания: хватает ли 2 × Ø90/50, или выталкивание главным цилиндром — Δцикл копией модели T-1.4b."
  - "Вариант (1), пуск/останов/отказ: первый брикет при пустом канале (нужен ли упор/пробка), опорожнение канала при останове и смене сырья, заклинивание (сила выше расчётной — давление, датчик, способ извлечения), очистка; блокировки — перечислить требования к T-1.6 interlocks (не менять файлы гидравлики)."
  - "Вариант (1), компоновка и прочность: шибер вплотную к торцу камеры, опора на обработанную поверхность торца/вставки по контуру канала (пролёт ≈ высота канала + фаски), ход шибера 75 мм, перемещение камеры/окна к торцу — новая длина колонн и рамы (масса −), осевая привязка пуансона, перебег. FEA узла шибер–вставка–торец копией модели T-1.7/T-1.7b (gmsh + ccx, *CONTACT PAIR μ 0,15): C-STR-01 ≥ 1,5 при 1,94 МН, C-FAT-01 ≥ 1,0 при 0 → 1,70 МН 10⁷ (FKM как в T-1.7: k_D 15, n_σ, M_σ, j 1,5 · j_G 1,25), сходимость < 5 % на трёх сетках в управляющих точках, кромки пятна с сбегом; запас R20/канала торца с реальными реакциями. Сила открытия шибера при μ 0,15 и остаточной силе — Ø80/45 с запасом ≥ 2. C-CLR-01 при базах направляющих на модуле камеры."
  - "Варианты (2) и (3) — ручная оценка по одной строке: (2) привод опоры, ход, блокировка, время в цикле, масса, надёжность при пыли; (3) ход ≥ 454, объём и время главного цилиндра (Δцикл моделью или оценкой), длина машины против C-ENV-01, масса цилиндра и рамы."
  - "Итог: таблица «вариант | масса машины | цикл | прочность узла шибера | выдача/надёжность | габарит | риск»; выбрать один; проект D-GK-04 в report.md (ГК вносит сам). Для выбранного — design/frame.t17c.yaml и design/slide_gate.t17c.yaml; если меняется длина хода/фазы — design/params.t17c.yaml генератором копии T-1.4b и гейты на нём."
deliverables:
  - calc/T-1.7c/                           # stack.py (сопротивление стопки), layout, fea/ (только входы без сеток, .geo, сводки .json), mass_budget.py, sources.yaml, results.json; ≤ 5 МБ
  - design/frame.t17c.yaml
  - design/slide_gate.t17c.yaml
  - design/params.t17c.yaml                # только если меняется цикл (ход, фазы выталкивания)
  - report.md                              # сравнение, технология стопки, пуск/останов, прочность, масса, проект D-GK-04, что на стенд
  - metrics.json
  - self_check.json
  - gates.t17c.json
acceptance:
  - "выбранный вариант: узел шибера C-STR-01 ≥ 1,5 и C-FAT-01 ≥ 1,0 по FEA со сходимостью < 5 % и контактным давлением ≤ экрана смятия; торец камеры с реальными реакциями ≥ 1,0; C-CLR-01 ≤ 0,15 мм"
  - "сопротивление выдаче и сила/время выталкивания с вилкой μ; цикл ≤ 6,0 с (C-PERF-01) на эталоне; если цикл меняется — |G-CYCLE − эталон| ≤ 0,15 с"
  - "масса машины с источником строк и неопределённостью — показать против 4850 и 5000"
  - "гейты G-PFACE, G-DOSE, G-CYCLE PASS (REV_PYTHON ops/gates/calc_gates.py --params design/params.t17c.yaml или design/params.t14b.yaml --criteria ops/criteria/design_criteria.yaml --out <worktree>/gates.t17c.json)"
  - "каталожные величины, свойства и коэффициенты трения — sources.yaml с url и местом чтения; self_check: двойной прогон даёт одинаковые results.json и design/*.t17c.yaml (FEA — допуск 1e-6)"
  - "все файлы в worktree читаются обычным пользователем"
allowed_paths: [calc/T-1.7c/**, design/frame.t17c.yaml, design/slide_gate.t17c.yaml, design/params.t17c.yaml, report.md, metrics.json, self_check.json, gates.t17c.json]
forbidden: [git commit, git push, изменение ops/**, изменение существующих design/*.yaml и design/hydraulics/**, изменение docs/**, изменение calc/** кроме calc/T-1.7c/**, сеть из shell, выдуманные коэффициенты трения и свойства, CAD-модель изделия, запись в DECISIONS.md, параллельная проработка двух вариантов после выбора]
gates: [G-PFACE, G-DOSE, G-CYCLE]
gate_inputs: {params: design/params.t14b.yaml}
timebox_min: 180
stop_and_ask_if:
  - "сопротивление стопки при верхней вилке μ требует выталкивания главным цилиндром и цикл > 6,0 с"
  - "ни один вариант не даёт узла шибера с C-FAT-01 ≥ 1,0 без изменения сечения камеры или главного цилиндра"
  - "масса машины выбранного варианта > 5000 кг"
