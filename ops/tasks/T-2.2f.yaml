id: T-2.2f
stage: S2-str
role: TECH
backend: alm            # bos/voh — резерв (CLAUDE.md §3); запуск строго по одному
effort: high
web_search: true        # аналоги RUF/WEIMA/HOLZMAG (окончательное сжатие под неподвижной крышей), ГА-ускорение хода, клиновые замки, FKM
objective: >
  Второе сравнительное исследование замка башмака подпрессовки по D-OP-14. Байонет с пролётом 444 мм отклонён (D-GK-11:
  Δh 1,40 мм, FKM 0,52; нижняя граница по балке 0,70 мм; для 0,6 мм ≈ +300 кг). Найти одно исполнение, которое при нагрузке
  D-GK-10 (или меньшей — если концепция снижает нагрузку на башмак) даёт: C-STR-01 ≥ 1,5 (315 бар), C-FAT-01 ≥ 1,0 (0 → 300 бар, 10⁷),
  контакт ≤ экрана с источником, Δh ≤ 0,6 мм при 300 бар с расчётным перекосом, G-CYCLE ≤ 5,95 с (C-PWR-01: RMS ≤ 30 кВт, пик ≤ 40 кВт),
  Δ узла ≤ +40 кг против строки камеры 180,22 кг (машина ≤ 5000 кг с облегчением станции ≤ 45 кг по D-OP-10).
inputs:
  - DECISIONS.md                           # D-GK-01, D-GK-07, D-GK-09, D-GK-10, D-GK-11, D-OP-10, D-OP-13, D-OP-14
  - ops/criteria/design_criteria.yaml      # v4: C-STR-01, C-FAT-01, C-PROD-01/02, C-PERF-01, C-PWR-01, C-MASS-01
  - ops/reports/T-2.2e/GK_review.md, ops/reports/T-2.2e/report.md, calc/T-2.2e/   # почему байонет отклонён; FEA-методика C3D10; привод совмещённого поворота (только читать)
  - ops/reports/T-2.2c/GK_review.md, ops/reports/T-2.2b/GK_review.md, calc/T-2.2c/, calc/T-2.2b/   # прежние кандидаты и отказы (только читать)
  - ops/reports/T-2.2d/, calc/T-2.2d/, design/prepress_lock.t22d.yaml   # нагрузка по K × μ, крыша X, цикл (копия в calc/T-2.2f/)
  - ops/reports/T-1.2b/report.md, calc/T-1.2b/   # Janssen, вариант B (зона сжатия за окном, +1,2 с)
  - calc/T-2.1/cycle/, design/params.t22d.yaml, design/hydraulics/   # эталон цикла A4VSO, эквивалент гейта, гидросхема (только читать)
  - design/frame.t17d.yaml, design/slide_gate.t17d.yaml, design/cylinders.t17d.yaml, design/main_cylinder_rear.t22.yaml
methods:
  - "Уроки D-GK-11 обязательны для каждого кандидата: реальный силовой путь до рамы (доли опор при перекосе, x-центроид 165,2 мм), сдвиговый прогиб, эффективная ширина поясов (shear lag), податливость присоединений и стыков; нижняя граница Δh замкнутой формулой и отдельная оценка с присоединениями. Литьё — FKM jG 1,25; номинальный размах в поясах против допускаемого — сразу, до деталировки."
  - "Кандидаты (3–4, каждый одной строкой с причиной): (A) окончательное сжатие под неподвижной закрытой крышей (аналоги RUF/WEIMA, источник): крыша на длине брикета под нагрузкой или её части, башмак только подпрессовывает (нагрузка башмака — по Janssen с остаточной длиной под окном); прибавка хода/перебега и цикла; восстановление цикла в пределах C-PWR-01 — ГА-ускорение быстрого хода, регенерация, перераспределение фаз (расчёт по копии calc/T-2.1/cycle с реальной характеристикой A4VSO и ГА с источником; гидросхему не менять — изменения списком для отдельной задачи); (B) короткопролётный замок в замкнутом корпусе камеры (пролёт ≤ ширины корпуса, клинья/пальцы на нескольких станциях x вне огибающей шибера) с учётом отказов T-2.2b (контакт, ресурс стяжек); (C) ярмо/портал в основной раме (кованые сечения) при нагрузке D-GK-10 — пересмотр отказа T-2.2c по изгибу крыши; (D) гибрид: крыша X 30–90 мм + облегчённый замок B/C с восстановлением цикла — если A не проходит по циклу."
  - "Для каждого — ручной расчёт: статика 315 бар, ресурс 0 → 300 бар, контакт с источником, Δh (нижняя граница и с присоединениями), Δмасса, кинематика и привод, цикл (G-CYCLE по копии генератора params), C-PWR-01 (RMS, пик), изготовление и сборка, риск. Таблица «кандидат | статика | FKM | контакт | Δh | Δмасса | цикл | RMS/пик кВт | риск». Выбор по ручному расчёту."
  - "FEA только выбранного (gmsh + ccx из E:\\Tools\\FreeCAD-1.1\\bin), глобальная объёмная модель силового пути до рамы по методике T-2.2e круг 2 (C3D10, ступени 0 → 100 → 200 → 300 → 315 бар, перекос, реальные присоединения, галтели R ≥ 15 в узлах): Δh, C-STR-01, C-FAT-01 в управляющих точках вне сингулярных кромок, сходимость < 5 % на трёх сетках, баланс ≤ 0,1 %, ручной расчёт против FEA в 2–3 сечениях ±15 %. Контакт — экран и средние по полосам; локальная контактная FEA — только если ручной контакт > 0,8 экрана."
  - "Масса машины: 4942,65 − 180,22 + узел + Δрама/цилиндры (от изменения хода) + строка H2 T-2.2 (+5…18 кг) отдельно; требуемое облегчение станции."
  - "Итог: design/prepress_lock.t22f.yaml (выбранное исполнение, полный, самодостаточный), design/params.t22f.yaml (если меняются ход или фазы), проект D-GK в report.md (ГК вносит сам)."
deliverables:
  - calc/T-2.2f/                           # candidates.py, hand.py, cycle/, fea/ (без сеток > 1 МБ), mass.py, sources.yaml, results.json; ≤ 5 МБ
  - design/prepress_lock.t22f.yaml
  - design/params.t22f.yaml                # только если меняются ход или фазы цикла
  - report.md
  - metrics.json
  - self_check.json
  - gates.t22f.json
acceptance:
  - "таблица кандидатов с нижними границами Δh и номинальным FKM для каждого; выбор обоснован"
  - "выбранное: C-STR-01 ≥ 1,5 и C-FAT-01 ≥ 1,0 по FEA со сходимостью < 5 %; Δh ≤ 0,6 мм при перекосе (FEA); контакт ≤ экрана с источником"
  - "цикл: G-CYCLE ≤ 5,95 с, эталон ≤ 5,90 с; C-PWR-01 (RMS ≤ 30, пик ≤ 40 кВт) — если меняется гидравлика, список изменений для отдельной задачи"
  - "масса машины с источниками строк; требуемое облегчение станции ≤ 45 кг"
  - "гейты G-PFACE, G-DOSE, G-CYCLE PASS (REV_PYTHON ops/gates/calc_gates.py --params design/params.t22f.yaml (или t22d) --criteria ops/criteria/design_criteria.yaml --out <worktree>/gates.t22f.json)"
  - "свойства и коэффициенты — sources.yaml с url; self_check: двойной прогон даёт одинаковые results.json и design/*.t22f.yaml (FEA — допуск 1e-6); report.md в UTF-8, проверен чтением; временные каталоги удалить; все файлы читаются обычным пользователем"
allowed_paths: [calc/T-2.2f/**, design/prepress_lock.t22f.yaml, design/params.t22f.yaml, report.md, metrics.json, self_check.json, gates.t22f.json]
forbidden: [git commit, git push, изменение ops/**, изменение существующих design/*.yaml и design/hydraulics/**, изменение docs/**, изменение calc/** кроме calc/T-2.2f/**, сеть из shell, выдуманные свойства и коэффициенты, CAD-модель изделия, запись в DECISIONS.md, изменение критериев, нагрузки D-GK-10 для концепций без крыши, сечения камеры 150 × 60, окна 150 × 200, Ø главного цилиндра, байонет с выносными опорами вне ширины корпуса]
gates: [G-PFACE, G-DOSE, G-CYCLE]
gate_inputs: {params: design/params.t22d.yaml}
timebox_min: 180
stop_and_ask_if:
  - "ни один кандидат по ручному расчёту не даёт одновременно Δh ≤ 0,6 мм (нижняя граница с присоединениями), FKM ≥ 1,0 и G-CYCLE ≤ 5,95 с при Δ узла ≤ +40 кг — дать таблицу и минимальную цену (масса или цикл) для каждого"
  - "лучший кандидат требует изменения гидросхемы сверх ГА/регенерации или превышает C-PWR-01"
  - "FEA выбранного: FKM < 1,0 или Δh > 0,6 мм, которые нельзя исправить в пределах +40 кг"
