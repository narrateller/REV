id: X-1
stage: S1-tech
role: TECH
backend: alm            # резерв: voh, bos (запуск строго по одному — песочница Windows)
effort: high
objective: >
  Независимо пересчитать мастер-расчёт ГК M-1 (docs/M-1_master_calc.md) ДРУГИМ методом, не используя
  calc/M-1/m1_calc.py и не копируя его допущения без проверки. Подтвердить или опровергнуть: Ø главного цилиндра,
  давление для номинальной силы, потребный ход, силу подпрессовки, работу уплотнения, время цикла и мощность.
inputs:
  - ops/criteria/design_criteria.yaml
  - DECISIONS.md            # D0 — схема
  - docs/M-1_master_calc.md # что проверяем (числа, допущения)
  - design/params.m1.yaml
methods:
  - "сила/давление/площади: аналитически, свои η и проверка по ISO 3320 рядам"
  - "ход и доза: геометрическая модель камеры с явной схемой положений пуансона и шибера (эскиз в report.md)"
  - "работа уплотнения: другая модель p(ρ) — например, Kawakita/Heckel или степенной закон, параметры из открытой литературы по древесным опилкам 8–12 % влажности (с DOI); сравнить с заглушкой M-1"
  - "цикл: пошаговая (по времени, dt ≤ 5 мс) симуляция привода с регулятором мощности насоса, дифференциальной схемой и реальным числом переключений; вариант с аккумулятором ~5 л"
deliverables:
  - calc/X-1/x1_calc.py
  - calc/X-1/x1_results.json
  - report.md
  - metrics.json
  - self_check.json
acceptance:
  - "таблица: величина | M-1 | X-1 | расхождение % | вывод; расхождение > 10 % по любой ключевой величине — объяснить"
  - "явный вывод: достижим ли цикл ≤ 6,0 с при 30 кВт в схеме D0, с каким запасом, при каких условиях (перекрытие, аккумулятор, Q_max)"
  - "прогон ops/gates/calc_gates.py на design/params.m1.yaml и на своём наборе параметров (если предлагаешь изменения — отдельным файлом calc/X-1/params.x1.yaml, design/** не менять)"
allowed_paths: [calc/X-1/**, report.md, metrics.json, self_check.json]
forbidden: [git commit, git push, изменение ops/**, изменение design/**, изменение docs/**, сеть]
timebox_min: 120
stop_and_ask_if:
  - "литературная кривая p(ρ) отличается от заглушки M-1 больше чем вдвое по давлению при ρ = 1000 кг/м³"
  - "цикл ≤ 6 с недостижим в схеме D0 при 30 кВт ни в одном варианте"
