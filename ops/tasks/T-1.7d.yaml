id: T-1.7d
stage: S1-str
role: TECH
backend: voh            # резерв: alm, bos (запуск строго по одному — песочница Windows)
effort: high
web_search: true        # контактная прочность, FKM, материалы плит шибера, упрочнение (поиск на стороне модели; shell без сети)
objective: >
  Узел шибера для выбранного в T-1.7c интерфейса выдачи (свободный канал 205 мм через торец камеры, стопка брикетов):
  найти исполнение шибера с C-STR-01 ≥ 1,5 (1,94 МН), C-FAT-01 ≥ 1,0 (0 → 1,70 МН, 10⁷), контактом ≤ экрана смятия
  при МИНИМАЛЬНОЙ прибавке перебега/хода главного цилиндра против D-GK-01 (264/289, перебег 59/69, шибер 38 мм),
  сохранив цикл ≤ 6,0 с по эталону и G-CYCLE. Одно сравнительное исследование, итог — одно исполнение и проект изменения D-GK-01.
inputs:
  - DECISIONS.md                           # D0, D-OP-06, D-OP-07, D-OP-08, D-OP-09, D-GK-01, D-GK-02
  - ops/criteria/design_criteria.yaml      # v3
  - ops/reports/T-1.7c/GK_review.md, ops/reports/T-1.7c/report.md   # причина FAIL: толщина в окне 38,11 мм ограничена перебегом
  - design/frame.t17c.yaml, design/slide_gate.t17c.yaml, design/params.t17c.yaml, calc/T-1.7c/   # рабочая база (только читать; копия в calc/T-1.7d/)
  - ops/reports/T-1.7/GK_review.md, design/frame.t17.yaml, calc/T-1.7/   # действующая рама, методика FEA/FKM
  - ops/reports/T-1.7b/report.md            # контакт, сила открытия шибера
  - design/cylinders.t16.yaml, calc/T-1.3/  # главный цилиндр (ход, длина, масса), шибер Ø80/45
  - calc/T-1.4b/                            # модель цикла (только читать; для прогона — копия calc/T-1.7c/cycle или calc/T-1.4b)
methods:
  - "Рычаги (каждый — отдельной строкой: Δ запаса, Δ перебег/ход, Δ масса, Δ цикл, риск): (а) толщина плиты 38…65 мм с соответствующим перебегом; (б) пролёт опоры: опоры как можно ближе к контуру окна/канала (≤ 180 мм против 258), с учётом направляющих шибера и посадки вставки; (в) ступенчатый/Т-профиль: в окне тоньше, на опорах толще — с FEA концентратора на переходе (FKM с n_σ по градиенту); (г) площадь опоры для контакта (ширина опорных полос, закалка/азотирование поверхности, предел смятия по источнику с url); (д) материал плиты (кованая 34CrNiMo6+QT или 42CrMo4+QT, Rm/Rp0,2 по EN 10083-3) — как добавка. Критерий выбора: минимальная прибавка перебега при всех запасах; затем масса."
  - "Геометрия хода: для выбранной толщины — перебег, установленный ход главного цилиндра, зазор хвост брикета–шибер ≥ 5 мм при восстановлении по T-1.7c, длина колонн/рамы, осевая привязка пуансона. Главный цилиндр: новая длина, масса, устойчивость штока (если меняется вылет) — эквивалент design/cylinders.t17d.yaml (только изменённые строки + ссылка на t16 для прочих)."
  - "FEA узла шибер–вставка–торец копией модели T-1.7c (gmsh + ccx из E:\\Tools\\FreeCAD-1.1\\bin, *CONTACT PAIR μ 0,15): подмодель узла с граничными условиями из модели рамы (не полная сборка — в T-1.7c тайм-аут); C-STR-01 ≥ 1,5 при 1,94 МН; C-FAT-01 ≥ 1,0 при 0 → 1,70 МН 10⁷ по методике T-1.7 (k_D 15, n_σ из градиента, M_σ, j 1,5 · j_G 1,25 для литья; для поковки — по FKM для кованой стали); сходимость < 5 % на трёх сетках в управляющих точках (кромки пятна со сбегом, переход ступени); контактное давление против экрана; реакции на R20 и торец камеры с запасом ≥ 1,0. Сила открытия шибера при μ 0,15 и остаточной силе 201 кН (порог T-1.7c) — цилиндр Ø80/45 с запасом ≥ 2, иначе новый Ø."
  - "Цикл: если ход меняется — design/params.t17d.yaml генератором копии (как params.t17c, уставка peak_kW 36,0 по D-GK-02), эталон и G-CYCLE; |G-CYCLE − эталон| ≤ 0,15 с или объяснение по фазам. Указать запас до 6,0 с по гейту и эталону. Если G-CYCLE > 6,0 с — сначала рычаги (б)–(г) для уменьшения хода, затем остановиться."
  - "C-CLR-01 ≤ 0,15 мм с базами направляющих на модуле камеры (как T-1.7). Масса машины по бюджету T-1.7c с изменёнными строками и вилкой."
  - "Итог: таблица рычагов, выбранное исполнение, design/frame.t17d.yaml и design/slide_gate.t17d.yaml (полные, самодостаточные), проект изменения D-GK-01 (ход, перебег, толщина шибера) в report.md — ГК вносит сам."
deliverables:
  - calc/T-1.7d/                           # study.py, layout.py, fea/ (входы, .geo, сводки .json; без сеток > 1 МБ), cycle/, mass_budget.py, sources.yaml, results.json; ≤ 5 МБ
  - design/frame.t17d.yaml
  - design/slide_gate.t17d.yaml
  - design/cylinders.t17d.yaml             # если меняется ход/длина цилиндров
  - design/params.t17d.yaml                # если меняется ход/фазы
  - report.md
  - metrics.json
  - self_check.json
  - gates.t17d.json
acceptance:
  - "выбранное исполнение: C-STR-01 ≥ 1,5, C-FAT-01 ≥ 1,0 по FEA со сходимостью < 5 %, контакт ≤ экрана смятия (с источником), торец/R20 с реальными реакциями ≥ 1,0, C-CLR-01 ≤ 0,15 мм"
  - "прибавка перебега/хода обоснована как минимальная по таблице рычагов; цикл ≤ 6,0 с на эталоне и G-CYCLE"
  - "масса машины с источником строк и вилкой против 4850 и 5000"
  - "гейты G-PFACE, G-DOSE, G-CYCLE PASS (REV_PYTHON ops/gates/calc_gates.py --params design/params.t17d.yaml (или t17c, если ход не менялся) --criteria ops/criteria/design_criteria.yaml --out <worktree>/gates.t17d.json)"
  - "свойства материалов, пределы смятия, коэффициенты — sources.yaml с url и местом чтения; self_check: двойной прогон даёт одинаковые results.json и design/*.t17d.yaml (FEA — допуск 1e-6)"
  - "все файлы в worktree читаются обычным пользователем; файлы FEA > 1 МБ не оставлять"
allowed_paths: [calc/T-1.7d/**, design/frame.t17d.yaml, design/slide_gate.t17d.yaml, design/cylinders.t17d.yaml, design/params.t17d.yaml, report.md, metrics.json, self_check.json, gates.t17d.json]
forbidden: [git commit, git push, изменение ops/**, изменение существующих design/*.yaml и design/hydraulics/**, изменение docs/**, изменение calc/** кроме calc/T-1.7d/**, сеть из shell, выдуманные свойства и коэффициенты, CAD-модель изделия, запись в DECISIONS.md, изменение сечения камеры и диаметра главного цилиндра, параллельная проработка двух исполнений после выбора]
gates: [G-PFACE, G-DOSE, G-CYCLE]
gate_inputs: {params: design/params.t17c.yaml}
timebox_min: 180
stop_and_ask_if:
  - "ни одно исполнение не даёт C-FAT-01 ≥ 1,0 при прибавке хода ≤ 40 мм"
  - "G-CYCLE > 6,0 с при минимально нужной прибавке хода"
  - "масса машины > 5000 кг номинал"
