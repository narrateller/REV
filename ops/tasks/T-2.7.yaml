id: T-2.7
stage: S2-str
role: TECH
backend: bos            # запуск строго по одному, после T-2.2i
effort: high
web_search: true        # первоисточники по боковому давлению и трению при прессовании биомассы
objective: >
  Уточнение нагрузки на стенки камеры по D-GK-15 / D-OP-18: коэффициент бокового давления K и трение μ (и произведение μ·K) для древесных опилок/щепы
  при брикетировании 100–200 МПа (сечение 150 × 60, длина под нагрузкой ≤ 89,4 мм, влажность 6–15 %, температура стенки до 80…120 °C).
  Сейчас огибающая K 0,35–0,60 × μ 0,20–0,30 даёт трение 39–53 % усилия и определяет массу схемы A; ослабить её можно только измерением (D-GK-15).
  Результат — обзор первоисточников с числами и план испытания сырья, а не новая огибающая.
inputs:
  - DECISIONS.md                           # D-GK-12…D-GK-15, D-OP-18
  - ops/reports/T-2.2h/GK_review.md, calc/T-2.2h/loads.py, calc/T-2.2h/sources.yaml   # действующая модель Janssen и её источники (только читать)
  - ops/criteria/design_criteria.yaml      # v4
methods:
  - "Поиск первоисточников (рецензируемые статьи, диссертации, стандарты): Holm et al. 2006 (Energy & Fuels), Nielsen et al. 2009, Stelte et al. 2011 и др.; прессование в закрытой матрице и пеллетирование древесины, лигноцеллюлозы; измеренные K (ratio of radial to axial stress), μ стенки, μ·K; зависимость от плотности, влажности, температуры, шероховатости. Для каждого числа — url/DOI, страница/таблица, условия опыта. Числа не придумывать; если доступен только реферат — так и указать."
  - "Пересчёт к условиям REV: трение и нагрузка на крышу по модели calc/T-2.2h/loads.py для найденных диапазонов (копия модели в calc/T-2.7/), таблица «источник | материал | p, МПа | влажность | T | K | μ | μ·K | трение, % усилия | нагрузка на крышу, кН»."
  - "Оценка: подтверждает ли литература огибающую, верхнюю границу K 0,6 и μ 0,3; где неопределённость наибольшая."
  - "План испытания сырья: инструментированная закрытая матрица с датчиком бокового давления (или разрезная с тензометрией), 100–200 МПа, 2–3 влажности и 2 температуры, число повторов, точность, обработка (μ·K из профиля усилия по длине, K отдельно), где выполнить (университетские лаборатории/институты — по открытым источникам), ориентир сроков; стоимость — только диапазоном с источником или «нет данных»."
deliverables:
  - calc/T-2.7/                            # loads.py (копия + перебор), sources.yaml, results.json, literature.md; ≤ 2 МБ
  - report.md
  - metrics.json
  - self_check.json
  - gates.t27.json
acceptance:
  - "каждое K, μ, μ·K — с url/DOI и местом в источнике; без источника — не использовать"
  - "таблица пересчёта к условиям REV и вывод о действующей огибающей"
  - "план испытания: схема матрицы, датчики, режимы, повторы, обработка, исполнители-кандидаты, сроки; стоимость диапазоном с источником или «нет данных»"
  - "гейты G-PFACE, G-DOSE PASS (REV_PYTHON ops/gates/calc_gates.py --params calc/T-2.6/params/params.t26a.yaml --criteria ops/criteria/design_criteria.yaml --out <worktree>/gates.t27.json) — контроль неизменности параметров"
  - "self_check: двойной прогон даёт одинаковые results.json; report.md пишется из Python в UTF-8 и проверяется чтением на отсутствие «?»"
allowed_paths: [calc/T-2.7/**, report.md, metrics.json, self_check.json, gates.t27.json]
forbidden: [git commit, git push, изменение ops/**, изменение design/**, изменение docs/**, изменение calc/** кроме calc/T-2.7/**, сеть из shell, выдуманные числа и источники, запись в DECISIONS.md, изменение критериев и огибающей, заказ или запрос коммерческих предложений]
gates: [G-PFACE, G-DOSE]
gate_inputs: {params: calc/T-2.6/params/params.t26a.yaml}
timebox_min: 120
stop_and_ask_if:
  - "первоисточники с измеренными K или μ·K для лигноцеллюлозы при > 50 МПа не найдены"
  - "литература указывает, что огибающая K 0,6 / μ 0,3 не консервативна (K или μ·K выше)"
