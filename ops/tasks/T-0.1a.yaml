  - "consumed_objects: эвристика «любой Part::Feature в OutList» может скрыть независимое тело; перейти на явный список потребляющих типов/свойств + WARN на неизвестные."
acceptance:
  - "контрпример эксцентричного пуансона -> G-CLEAR FAIL с верным максимальным зазором"
  - "контакт пути подачи по ребру -> G-FEED FAIL"
  - "калибровка W02 A/B V1 не меняется"
