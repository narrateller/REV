id: T-0.1a
stage: S0-followup         # закрыть до первой силовой CAD-модели (T-2.3, T-2.4)
role: TOOL-CAD             # TOOLS: инструмент гейта, изменение ops/gates/** разрешено (allow_protected)
backend: bos               # резерв: alm, voh — по наличию лимита; запуск строго по одному (песочница Windows, 1909)
effort: high
objective: >
  Закрыть три остаточных дефекта геометрических гейтов T-0.1 (независимая проверка Sonnet 24.11.2026, ACCEPT_WITH_NOTES),
  пока по гейтам не принята ни одна силовая CAD-модель. Каждый дефект — сначала воспроизводящий тест, который падает
  на текущем коде main, затем исправление, после которого тест зелёный. Пороги и критерии не меняются; калибровка
  W02-04 (отрицательный пример) остаётся MATCH.
defects:
  D1_G-CLEAR_eccentric: >
    side_gap() берёт distToShape между сечением пуансона и контуром отверстия — минимальное расстояние. Эксцентричный
    пуансон (0 мм с одной стороны, 40 мм с другой) даёт clearance 0 и PASS. C-CLR-01 — зазор «на сторону», max_mm 0,3.
  D2_G-FEED_edge_contact: >
    Контакт пути подачи с вкладышем (и бункером) засчитывается по расстоянию (distance ≤ CONTACT_TOL_MM), площадь
    окна считается только по совпадающим граням. Касание по ребру или точке даёт touches = true и окно 0 мм²; при
    отсутствии min_window_area_mm2 в C-FEEDPATH-01 (как сейчас в v4) — WARN вместо FAIL. Путь, отстоящий на зазор
    0 < g ≤ CONTACT_TOL_MM гранью к грани, наоборот, получает площадь 0.
  D3_consumed_objects: >
    Для любого Part::Feature все объекты с Shape из OutList, кроме Support/AttachmentSupport/PlacementRelTo/RevPair,
    считаются поглощёнными и выпадают из G-MASS/G-COLL/G-ENV/G-FEED/G-CLEAR. Объект со ссылкой (PropertyLink,
    выражение, пользовательское свойство) на независимое тело скрывает это тело.
inputs:
  - ops/gates/geom_gates.py                 # side_gap, measure_clearance, clearance, contact_area, feed, consumed_objects, read_bodies
  - tests/ops/test_geom_gates.py            # CAD-тесты запускаются freecadcmd (под pytest пропускаются)
  - ops/reports/T-0.1/report.md, ops/reports/T-0.1/metrics.json   # методика и калибровка T-0.1
  - ops/calibration/w02_04.json, ops/calibration/w02_A_V1.json, ops/calibration/w02_B_V1.json
  - ops/gates/roles/w02_legacy.yaml
  - ops/criteria/design_criteria.yaml       # C-CLR-01 max_mm 0,3 на сторону; C-FEEDPATH-01 rule; C-COLL-01 0 мм³ — только читать
  - "модели калибровки (только читать, в worktree не копировать): E:/Projects/REV/drawings/W02/output/W02-A-V1.FCStd (sha256 d52c72f4…fede), W02-B-V1.FCStd (sha256 8fd8f334…3e46)"
tools:
  freecadcmd_sandbox: E:/Tools/FreeCAD-1.1/bin/freecadcmd.exe     # REV_FREECADCMD внутри песочницы исполнителя
  freecadcmd_gk: "C:/Users/user/AppData/Local/Programs/FreeCAD 1.1/bin/freecadcmd.exe"   # прогон ГК вне песочницы (та же 1.1.4)
  python: E:/Tools/Python313/python.exe     # REV_PYTHON
methods:
  - "Порядок по каждому дефекту: (1) воспроизводящий тест в tests/ops/test_geom_gates.py; (2) прогон на НЕИЗМЕНЁННОМ geom_gates.py — тест падает, вывод сохранить в report.md (команда, код возврата, строка ассерта); (3) исправление; (4) тест зелёный. Тест, который проходит на старом коде, не считается воспроизводящим."
  - "D1 G-CLEAR: зазор на сторону = расстояние от стенки отверстия до профиля пуансона по внутренней нормали к стенке. Дискретизация: точки по каждому ребру контура отверстия (не менее 8 на ребро, для дуг шаг по углу ≤ 5°, без концевых точек ребра в пределах допуска), луч по нормали до профиля пуансона. Сечения: не менее трёх по осевому перекрытию (у входа, середина, у дна перекрытия). Зазор пары = максимум по точкам и сечениям; значение гейта = максимум по парам (как сейчас). В details пары: clearance_mm (максимум), min_side_mm, число точек/сечений, сечение и точка максимума. Луч, не встречающий профиль пуансона, — FAIL пары с причиной (не PASS и не пропуск). Существующие ветки (пересечение материала → 0 и G-COLL, пуансон вне камеры, RevPair) сохраняются."
  - "D2 G-FEED: контакт с chamber_liner и hopper засчитывается только по площади: площадь контакта = площадь граней тела, отстоящих от пути подачи не более CONTACT_TOL_MM гранью к грани (совпадающие и параллельные с зазором ≤ допуска). Касание по ребру или точке — площадь 0, контакта нет → missing_contact → FAIL независимо от min_window_area_mm2. Минимальная засчитываемая площадь — геометрический допуск (константа в коде с обоснованием, ≤ 0,01 мм², не порог критерия). window_area_mm2 по-прежнему минимум по путям подачи. Ветка «порог окна не задан» → WARN остаётся только для пути с ненулевым окном и всеми контактами по площади."
  - "D3 consumed_objects: явная таблица потребляющих типов и свойств (TypeId → свойства-операнды), минимум: PartDesign::Body (Group); Part::Cut/Fuse/Common (Base, Tool); Part::MultiFuse/MultiCommon (Shapes); Part::Extrusion (Base); Part::Revolution (Source); Part::Mirroring (Source); Part::Scale (Base); Part::Offset/Offset2D (Source); Part::Thickness (Faces[0]); Part::Fillet/Chamfer (Base); Part::Compound (Links); Part::Loft/Sweep (Sections, Spine); App::Link (скрытый источник в том же документе — как сейчас). Тип проверять по TypeId и isDerivedFrom, список — в коде с комментарием. Объект неизвестного типа со ссылками на тела в OutList: ссылочные тела НЕ поглощаются (учитываются как независимые — консервативно для массы и коллизий), а в details G-MASS и G-COLL выводится unknown_dependencies [{object, type, links}], статус этих гейтов не лучше WARN (FAIL сохраняется)."
  - "Базовое состояние (круг 1): CAD-тест на main падает на assert report['criteria_version'] == 1 — критерии сейчас v4. Исправить ассерт на точное совпадение с версией переданного файла критериев (не ослаблять). Базой для «FAIL на main» считать geom_gates.py из main + test_geom_gates.py только с этой правкой."
  - "Регрессия: все существующие проверки check_freecad остаются и проходят (пары 0,1/0,8 мм, RevPair, нулевой зазор, позиции, окно 108,8 мм², разрыв подачи, consumed extrusion/mirror/scale/offset/thickness, WARN оболочки, коллизия 200 мм³, стальной куб 7850 кг, коды возврата). Ослаблять или удалять существующие ассерты нельзя; менять ожидаемое значение — только если оно было следствием дефекта, с объяснением в report.md."
  - "Калибровка: TOOL_VERSION поднять до 1.2.0; прогнать гейты на W02-A-V1 и W02-B-V1 (ops/gates/roles/w02_legacy.yaml, команда — ops/reports/T-0.1/report.md, раздел «Воспроизведение»), перезаписать ops/calibration/w02_A_V1.json и w02_B_V1.json, обновить w02_04.json (статусы и match по гейтам, verdict). Если модели недоступны из песочницы — не копировать их, записать в report.md, калибровку прогонит ГК."
counterexamples_required:          # каждый — отдельная проверка в test_geom_gates.py, сначала FAIL на коде main
  D1:
    - "квадратное отверстие 10 × 10, пуансон 9,8 × 9,8 концентрично → PASS, 0,1 ± 1e-6 (не 0,1·√2 по углу)"
    - "квадратное отверстие 10 × 10, пуансон 9,6 × 9,6 прижат к одной стенке (0 / 0,4) → FAIL, clearance 0,4 ± 1e-6, min_side 0"
    - "эксцентричный пуансон 0 / 40 мм (как в замечании проверки) → FAIL, clearance 40 ± 1e-6"
    - "круглое отверстие Ø 50, пуансон Ø 49,8 концентрично → PASS 0,1 ± 0,002; тот же пуансон со смещением 0,1 к стенке → PASS, clearance 0,2 ± 0,002, min_side 0 ± 0,002 (на main — 0)"
    - "круглое отверстие Ø 50, пуансон Ø 49,6 со смещением 0,15 → FAIL, clearance 0,35 ± 0,002, min_side 0,05 ± 0,002 (круг 1: исправлена ошибка карточки, исполнитель bos)"
    - "пуансон, наклонённый в отверстии (зазор 0,05 у входа, 0,5 в глубине перекрытия) → FAIL, значение ≥ 0,45 (проверка сечений по длине)"
  D2:
    - "путь подачи касается вкладыша только ребром → G-FEED FAIL, missing_contact содержит chamber_liner, окно 0"
    - "касание точкой (вершина к грани) → FAIL"
    - "касание бункера только ребром при контакте вкладыша гранью → FAIL (missing_contact hopper)"
    - "грань к грани с зазором 0,005 мм (≤ CONTACT_TOL_MM) → контакт есть, площадь = площадь перекрытия граней ± 1e-6"
    - "существующий случай окна 108,8 мм² — без изменений"
  D3:
    - "независимое тело, на которое ссылается Part::Feature через пользовательское свойство App::PropertyLink (не RevPair) → тело учтено в G-MASS (масса = сумма), участвует в G-COLL"
    - "то же через выражение (setExpression на свойство, ссылающееся на тело) → тело учтено"
    - "объект неизвестного типа со ссылкой на тело → тело учтено, unknown_dependencies непуст, G-MASS не лучше WARN"
    - "Part::Cut, Part::MultiFuse, Part::Compound, PartDesign::Body — операнды поглощены, масса без двойного счёта"
deliverables:
  - ops/gates/geom_gates.py
  - tests/ops/test_geom_gates.py
  - ops/calibration/w02_A_V1.json, ops/calibration/w02_B_V1.json, ops/calibration/w02_04.json
  - report.md                # по дефекту: тест, вывод на старом коде (FAIL), исправление, вывод на новом (PASS); метод D1 и допуски; таблица потребляющих типов D3; калибровка до/после; команды
  - metrics.json             # {defects: {D1,D2,D3: {tests: [...], fail_on_main: true, pass_after: true}}, calibration: {W02-A-V1, W02-B-V1: {status, value} по гейтам, verdict}, cad_test_runtime_s, tool_version}
  - self_check.json          # двойной прогон CAD-тестов и калибровки даёт одинаковые отчёты (кроме времени)
acceptance:
  - "D1: эксцентричный пуансон 0/40 → G-CLEAR FAIL, значение 40 ± 1e-6; все контрпримеры D1 по counterexamples_required"
  - "D2: контакт по ребру/точке с вкладышем или бункером → G-FEED FAIL; зазор ≤ CONTACT_TOL_MM гранью к грани → площадь засчитана"
  - "D3: тело, на которое ссылается непотребляющий объект, не исчезает из G-MASS/G-COLL; неизвестные зависимости → WARN с перечнем"
  - "каждый новый тест падает на коде main (вывод в report.md) и проходит после исправления"
  - "регрессия: все прежние проверки check_freecad проходят без ослабления"
  - "калибровка W02-A-V1 и W02-B-V1: G-ENV, G-MASS, G-COLL — статус и значение как в main (масса до 1e-6 отн.); G-FEED FAIL по той же причине; G-CLEAR FAIL, 5,5 ± 0,01 мм (иначе — stop_and_ask); w02_04.json verdict MATCH"
  - "pytest tests/ops зелёный (объём CI; tests/test_operator_rotation.py — наследие, вне задачи): REV_PYTHON -B -m pytest -p no:cacheprovider --basetemp <внутри worktree> tests/ops (CAD-тест пропускается); freecadcmd tests/ops/test_geom_gates.py → код 0; CAD-тесты ≤ 5 мин"
  - "пороги и критерии не меняются: ops/criteria/** без изменений; CONTACT_TOL_MM, GEOMETRY_TOL_MM, C-CLR-01 0,3 мм, C-COLL-01 0 мм³ — прежние"
allowed_paths:
  - ops/gates/geom_gates.py
  - ops/gates/roles/**
  - ops/calibration/w02_A_V1.json
  - ops/calibration/w02_B_V1.json
  - ops/calibration/w02_04.json
  - tests/ops/test_geom_gates.py
  - report.md
  - metrics.json
  - self_check.json
allow_protected: ["ops/gates/geom_gates.py", "ops/gates/roles/**"]
forbidden: [git commit, git push, изменение ops/criteria/**, изменение ops/gates/calc_gates.py и ops/gates/cycle_model/**, изменение ops/run_task.py и ops/lib/**, изменение .github/**, изменение drawings/**, копирование FCStd в worktree, сеть, изменение допусков CONTACT_TOL_MM и GEOMETRY_TOL_MM, ослабление или удаление существующих ассертов, запись в DECISIONS.md и PLAN.md]
gates: []                  # G-SCOPE — раннер; CAD-тесты и калибровку ГК прогоняет сам из worktree (раннер при allow_protected берёт гейты из main, T-0.3a)
timebox_min: 150
notes_for_gk:
  - "Гейты кандидата при allow_protected раннер запускает из main (T-0.3a не закрыт). ГК прогоняет из worktree вне песочницы: pytest tests, freecadcmd tests/ops/test_geom_gates.py, калибровку W02 A/B; после слияния — то же из main."
stop_and_ask_if:
  - "G-CLEAR на W02-A-V1 или W02-B-V1 после исправления ≠ 5,5 ± 0,01 мм (модель эксцентрична или метод даёт иной максимум) — дай разбор по сторонам и сечениям, калибровку не подгоняй"
  - "любой статус калибровки W02 меняется или verdict ≠ MATCH"
  - "дефект не воспроизводится на коде main (тест проходит до исправления) — опиши, почему замечание проверки неверно"
  - "в W02 есть объекты неизвестного типа, из-за которых меняется число тел, масса или G-COLL — перечисли, не расширяй таблицу без источника в документации FreeCAD"
  - "исправление требует менять критерии, допуски или раннер"
