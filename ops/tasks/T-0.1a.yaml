  - "G-CLEAR: зазор = distToShape (минимальный). Эксцентричный пуансон (0 мм с одной стороны, 40 мм с другой) даёт PASS. Нужен зазор по каждой стороне сечения, итог — максимум по сторонам и парам (geom_gates.py side_gap/measure_clearance)."
