id: T-0.3b
stage: S1-tool             # до T-1.4
role: TOOL-CALC
backend: alm               # резерв: voh, bos (запуск строго по одному — песочница Windows)
effort: high
objective: >
  G-CYCLE должен уметь проверять циклограмму с перекрытием фаз, иначе цикл ≤ 6 с (C-PERF-01) нечем проверить:
  в T-1.2/T-1.2b последовательная модель гейта даёт 7,72/7,97 с, а модель X-1 с перекрытием — 6,73/6,91 с.
  Добавить в схему параметров и в calc_gates.py параллельные группы фаз с общей подачей насоса, негидравлические
  фазы (подача дозы, выдержка, сброс давления) и зарядку аккумулятора во время них. Пороги критериев не менять.
inputs:
  - ops/gates/calc_gates.py                # evaluate_phase, recharge_phase, evaluate_cycle (G-CYCLE)
  - design/params.schema.yaml              # cycle[]: phase fields
  - tests/ops/test_calc_gates.py
  - ops/calibration/                       # калибровка W02-04 (вердикт MATCH должен сохраниться)
  - calc/X-1/x1_calc.py                    # эталонная модель с перекрытием (шаг 5 мс): simulate(..., overlap, accumulator)
  - calc/T-1.2b/x1_calc.py, calc/T-1.2b/results.json   # последняя версия модели и трассы цикла варианта A
  - design/params.m1.yaml, design/params.t12.yaml, design/params.t12b.yaml   # только читать
  - ops/reports/T-1.2b/GK_review.md        # бюджет фаз цикла (Opus): мёртвые времена, выдержка, сброс, хвост
methods:
  - "Схема (обратная совместимость обязательна, все новые поля необязательные): (1) у фазы поле `group` (строка). Подряд идущие фазы с одинаковым group выполняются одновременно; группа завершается, когда завершилась последняя её фаза. (2) у фазы `start_delay_s` (≥ 0) — задержка старта внутри группы относительно начала группы (так задаётся старт по положению другого привода; в отчёте фазы должно быть видно, от чего отсчитана задержка). (3) actuator `none` — негидравлическая фаза: только dwell_s (подача дозы, выдержка под давлением, сброс), stroke_mm 0; может входить в группу. (4) у drive.accumulator поле `recharge_when_idle: true` — зарядка насосом во время фаз и интервалов, когда насос не занят движением (на charge_pressure_bar, с round_trip_eta); остаток незаряженного масла в конце цикла — отдельная фаза зарядки, как сейчас."
  - "Модель группы: шаг по времени ≤ 5 мс. Один насос: суммарная подача фаз группы ≤ pump_flow_L_min(drive, p_max), где p_max — максимальное давление среди одновременно движущихся фаз (консервативно: насос работает на самое нагруженное давление, разница — дросселирование и потери). Мощность на валу p_max·Q_сумм/(600·η) ≤ motor_kW. Приоритет подачи — по порядку фаз в YAML (первая получает подачу первой); аккумулятор доотдаёт по use_accumulator в пределах max_flow_L_min и usable_oil_L. Скорость фазы ограничена её speed_mm_s, если задана."
  - "Переключение SWITCH_S начисляется один раз на группу при её старте (и на каждую фазу со start_delay_s > 0 — свой старт клапана), не на каждую фазу группы. continues сохраняет нынешний смысл."
  - "Проверки, которые должны работать и для групп: ход в пределах, возврат в исходное, давление ≤ C-HYD-01, пик и средняя мощность ≤ C-PWR-01, фаза press есть и не в регенерации, requested_speeds_met, аккумулятор. Новая проверка: в одной группе один привод не может двигаться в двух фазах одновременно (иначе InputError)."
  - "Калибровка против модели X-1/T-1.2b (эталон независимый от гейта): описать в новых файлах ops/calibration/x1_overlap.params.yaml (геометрия M-1, перекрытие + акк. 5 л, Q 360, подача 0,50 с) и ops/calibration/t12b_overlap.params.yaml (вариант A T-1.2b, подача 0,50 и 0,64 с — два файла или параметр) фазами с группами; сравнить G-CYCLE с эталоном (X-1: 5,87 с; T-1.2b A: 6,769 / 6,909 с). Допуск |Δ| ≤ 0,15 с; расхождение объяснить по фазам (таблица фаза | эталон | гейт). Подгонять модель гейта под эталон коэффициентами запрещено — только описание фаз и общий механизм."
  - "Учесть: эталон X-1 считает гидравлику с переменным давлением по ходу (кривая), гейт — полосами давления по фазам; это допустимое различие, его вклад показать."
deliverables:
  - ops/gates/calc_gates.py
  - design/params.schema.yaml
  - tests/ops/test_calc_gates.py           # новые тесты: группа из двух фаз с общей подачей быстрее последовательной и не быстрее max(фаз) при неограниченной подаче; start_delay_s; actuator none; зарядка в простое; ошибка двойного движения привода; обратная совместимость (params.m1/t12/t12b — отчёты G-CYCLE совпадают с нынешними до 1e-9)
  - ops/calibration/x1_overlap.params.yaml
  - ops/calibration/t12b_overlap*.params.yaml
  - ops/calibration/overlap_calibration.json   # эталон, гейт, Δ, вердикт MATCH/MISMATCH
  - report.md
  - metrics.json
  - self_check.json
acceptance:
  - "обратная совместимость: для design/params.m1.yaml, design/params.t12.yaml, design/params.t12b.yaml результат G-PFACE/G-DOSE/G-CYCLE (статус и значение) совпадает с main до 1e-9; калибровка W02-04 — MATCH (три FAIL)"
  - "калибровка перекрытия: |Δ| ≤ 0,15 с для X-1 и обоих случаев T-1.2b; таблица по фазам в report.md"
  - "pytest tests/ops зелёный (REV_PYTHON -m pytest -p no:cacheprovider --basetemp <внутри worktree>)"
  - "ops/criteria/** не изменён; пороги не изменены"
allowed_paths: [ops/gates/calc_gates.py, design/params.schema.yaml, tests/ops/test_calc_gates.py, ops/calibration/**, report.md, metrics.json, self_check.json]
allow_protected: ["ops/gates/calc_gates.py"]
forbidden: [git commit, git push, изменение ops/criteria/**, изменение design/params.*.yaml кроме schema, изменение calc/**, сеть]
gates: [G-PFACE, G-DOSE, G-CYCLE]
gate_inputs: {params: design/params.m1.yaml}
timebox_min: 120
stop_and_ask_if:
  - "калибровка перекрытия не укладывается в 0,15 с без подгоночных коэффициентов — покажи таблицу по фазам и причину"
  - "обратная совместимость невозможна без изменения смысла существующих полей"
