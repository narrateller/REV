id: T-1.6
stage: S1-hyd
role: HYD
backend: voh            # резерв: alm, bos (запуск строго по одному — песочница Windows)
effort: high
web_search: true        # каталоги охладителей, блоков клапанов, картриджей (поиск на стороне модели; shell без сети)
objective: >
  Восстановить запасы перед D1 на схеме T-1.5 (D-GK-02, D-OP-08, D-OP-09), не ухудшая цикл (C-PERF-01) и давления (C-HYD-01):
  масса машины ≤ 4750 кг (резерв 5 % к пределу 5000); масло-воздушное охлаждение ≥ 25 кВт при +40 °C / масле ≤ 55 °C с запасом
  на загрязнение при установленной ≤ 34,2 кВт; RMS на валу ≤ 29 кВт; закрыть замечания M из ops/reports/T-1.5/GK_review.md.
inputs:
  - DECISIONS.md                           # D-GK-01, D-GK-02, D-OP-07, D-OP-08, D-OP-09
  - ops/criteria/design_criteria.yaml      # v3
  - ops/reports/T-1.5/GK_review.md         # запасы, резервы массы, замечания M/L — главный вход
  - ops/reports/T-1.5/report.md
  - design/hydraulics/T-1.5_circuit.yaml, design/hydraulics/T-1.5_interlocks.yaml   # только читать
  - calc/T-1.5/                            # check_circuit, draw_circuit, mass_budget, safety_checks, sources (только читать; копия в calc/T-1.6/)
  - calc/T-1.4b/, calc/T-1.3/, design/cylinders.t13.yaml, design/params.t14b.yaml   # только читать
methods:
  - "Скопировать calc/T-1.5 в calc/T-1.6 и схему в design/hydraulics/T-1.6_circuit.yaml / T-1.6_interlocks.yaml (ревизия, T-1.5 не трогать). Каждое изменение против T-1.5 — строкой в report.md: элемент | было | стало | Δмасса | Δтепло | Δцикл | источник."
  - "Тепло (сначала источник, потом охладитель): разложить 21,48 кВт по источникам (холостые потери насоса и регулятора, пилот и его сброс, дросселирование декомпрессии, сбросы, перепады в тракте, утечки) и снизить без ухудшения цикла: пилот от отдельного малого насоса/накопителя с отсечкой вместо дросселирования от главного, разгрузка при паузах, перепады тракта; цель тепла ≤ 19 кВт. Горячий баланс пилота при 55 °C — без опоры на резерв XCH."
  - "Охладитель (D-OP-09): масло-воздушный по каталогу (url + место чтения) с точкой ≥ 25 кВт при 40/55 °C (или ≥ 1,25 × тепла, что больше) и запасом на загрязнение ≥ 15 % (обосновать: фильтрующий мат/доступ для очистки); варианты — большая матрица с тем же вентилятором, термостатический/частотный вентилятор, отдельный насос охлаждения; установленная мощность с разбивкой ≤ 34,2 кВт. Водомасляная опция: типоразмер, присоединения, место — без включения в базовую массу и мощность."
  - "RMS ≤ 29 кВт на эталоне (копия модели T-1.4b/T-1.5): за счёт снижения холостых потерь и пилота; цикл номинальный не хуже 5,75 по гейту, неблагоприятный профиль 6,158 с — показать и, если возможно, ≤ 6,0 с."
  - "Масса ≤ 4750 кг: резервы из GK_review T-1.5 (2WRCE в блок, DB → картриджи, лёгкий НД DN65 вместо Goetze 455, профилирование плит, бак как элемент основания, встройка крышки ГЦ) + снижение массы от охлаждения/пилота; каждая мера — с расчётом или каталогом, не процентом. Таблица «узел | T-1.5 | T-1.6 | источник», сумма."
  - "Замечания M: (1) check_circuit — механические блокировки: eject только при подтверждённом открытом шибере, gate_close только при ram ≤ 195 мм, feed только при открытых засовах; мутационный тест каждой (удаление блокировки → FAIL). (2) ZUP — отдельный слив на T0, противодавление ≤ 2 бар, расчёт. (3) Главный цилиндр: порты только в крышках (компоновка крышек, Ду, скорость ≤ 6 м/с во всасе наполнения по T-1.4b) или усталостный расчёт гильзы с поперечным портом (Kt, размах, C-FAT-01 10⁷); при изменении стенки/крышек — design/cylinders.t16.yaml с C-STR-01 ≥ 1,5 при 315 бар. Замечания L — список в report.md, что закрыто."
  - "Если меняются площади/объёмы, влияющие на цикл, — прогнать эталон и гейты; иначе указать, что params.t14b в силе."
deliverables:
  - design/hydraulics/T-1.6_circuit.yaml
  - design/hydraulics/T-1.6_circuit.svg      # генерируется
  - design/hydraulics/T-1.6_interlocks.yaml
  - design/cylinders.t16.yaml                # только если меняется главный цилиндр
  - calc/T-1.6/check_circuit.py
  - calc/T-1.6/draw_circuit.py
  - calc/T-1.6/mass_budget.py
  - calc/T-1.6/heat_balance.py               # разложение тепла, охладитель, установленная мощность
  - calc/T-1.6/sources.yaml
  - calc/T-1.6/results.json
  - report.md                                # таблица изменений, тепло по источникам, охладитель, масса, RMS, замечания M/L, что на стенд
  - metrics.json
  - self_check.json
  - gates.t16.json
acceptance:
  - "масса машины ≤ 4750 кг по таблице с источником каждой строки"
  - "охладитель: каталожная точка ≥ max(25 кВт; 1,25 × тепла) при 40/55 °C с запасом на загрязнение ≥ 15 %; тепло по источникам ≤ 19 кВт или обоснование; установленная ≤ 34,2 кВт"
  - "RMS на валу ≤ 29 кВт, средняя ≤ 30, пик ≤ 40 по эталону; горячий баланс пилота при 55 °C без резерва XCH"
  - "check_circuit.py на T-1.6: 0 дефектов; три механические блокировки есть и ловятся мутациями; мутационный набор T-1.5 не ослаблен"
  - "главный цилиндр: порты в крышках или C-FAT-01 гильзы с портом подтверждён; C-STR-01 ≥ 1,5 при 315 бар"
  - "гейты G-PFACE, G-DOSE, G-CYCLE PASS (REV_PYTHON ops/gates/calc_gates.py --params design/params.t14b.yaml --criteria ops/criteria/design_criteria.yaml --out <worktree>/gates.t16.json)"
  - "каталожные величины — из sources.yaml с url и местом чтения; self_check: двойной прогон даёт побайтно одинаковые results.json и circuit.svg"
allowed_paths: [design/hydraulics/T-1.6_*, design/cylinders.t16.yaml, calc/T-1.6/**, report.md, metrics.json, self_check.json, gates.t16.json]
forbidden: [git commit, git push, изменение ops/**, изменение design/params.*.yaml, изменение design/cylinders.t13.yaml, изменение design/hydraulics/T-1.5_*, изменение docs/**, изменение calc/** кроме calc/T-1.6/**, сеть из shell, выдуманные каталожные данные, CAD]
gates: [G-PFACE, G-DOSE, G-CYCLE]
gate_inputs: {params: design/params.t14b.yaml}
timebox_min: 150
stop_and_ask_if:
  - "масса > 4750 кг после всех мер — покажи остаток и что потребовалось бы (рама, архитектура)"
  - "охлаждение ≥ 25 кВт воздухом невозможно в пределах 34,2 кВт установленной"
  - "любая мера ухудшает номинальный цикл больше чем на 0,1 с"
