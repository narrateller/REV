id: T-2.2h
stage: S2-str
role: TECH
backend: bos            # alm/voh — по наличию лимита; запуск строго по одному
effort: high
web_search: true        # FKM (угол рамы, Kt галтели), осевой упор кольца, аналоги RUF/WEIMA
objective: >
  Второй заход квалификации силовой части схемы A по D-GK-14 / D-OP-17: неподвижная закрытая крыша X = 90 мм (205…295),
  башмак только подпрессовывает (162,8 / 171,0 кН при 300 / 315 бар), перенос дозы 35,25 кН. Переработать кольцо крыши и окно башмака так,
  чтобы C-STR-01 ≥ 1,5 (315 бар) и C-FAT-01 ≥ 1,0 (0 → 300 бар, 10⁷) по сошедшейся FEA, Δh ≤ 0,6 мм при 300 бар под крышей и под башмаком,
  при требуемом облегчении гидростанции ≤ 230 кг (H2 по максимуму 18 кг), то есть масса машины до облегчения станции ≤ 5230 кг.
  Цель — минимальная масса узла; бюджет 230 кг не цель, а потолок.
inputs:
  - DECISIONS.md                           # D-GK-11…D-GK-14, D-OP-10, D-OP-14…D-OP-17
  - ops/criteria/design_criteria.yaml      # v4
  - ops/reports/T-2.2g/ (GK_review.md, report.md, metrics.json), calc/T-2.2g/, design/chamber_roof.t22g.yaml   # первый заход и разбор (только читать; копия нужного в calc/T-2.2h/)
  - ops/reports/T-2.6/GK_review.md, calc/T-2.6/params/params.t26a.yaml, calc/T-2.6/results.json   # ход 396 / рабочий 371, гидравлика +76,2 кг (только читать)
  - ops/reports/T-2.2e/GK_review.md, ops/reports/T-2.2f/GK_review.md   # уроки FEA и ручного расчёта
  - design/frame.t17d.yaml, design/slide_gate.t17d.yaml, design/cylinders.t17d.yaml, design/main_cylinder_rear.t22.yaml, design/prepress_lock.t22d.yaml
defects_from_T-2.2g:   # обязательны (разбор ГК + проверка Opus)
  - "(а) Ручной расчёт кольца — замкнутая рама с жёсткими узлами и угловым моментом, Kt галтели по источнику; шарнирные пояса без момента недопустимы. Ручная FKM 1,126 / 1,142 из T-2.2g недействительна."
  - "(б) Реальный осевой упор кольца: трение по стенкам (до 718 кН при K 0,6 / μ 0,2) приложено на уровне расточки — снять его упором на том же уровне или учесть пару (≈ 15 кН·м на половину) явно. Сравнение ручного и FEA — по равнодействующей и моменту в 2–3 сечениях (±15 %), а не по мембране в сечении."
  - "(в) Вкладыш (гнездо 12 мм) на всю ширину 150 мм либо обоснование полосовой посадки; эксцентриситет 27,72 мм (> b/6 = 25 мм) обосновать источником или исправить."
  - "(г) Управляющие точки FKM и сходимости — вне торцевой зоны 25 мм; торец — отдельная локальная модель (субмодель) с собственной сходимостью < 5 %."
  - "(д) Окно под башмаком — три сетки, сходимость < 5 % для Δh и FKM щеки (кромка обрезки X ≈ 205)."
  - "(е) Масса — по проходному исполнению, построчно с источниками (база 4942,65 − 180,22 + узел + колонны + ГЦ + быстрые цилиндры + гидравлика 76,23 + H2 5…18)."
methods:
  - "Нагрузка — как T-2.2g (Janssen, огибающая K 0,35–0,60 × μ 0,20–0,30, длина ≤ 89,4 мм, блокировка дозы 0,853 кг; перекос), без ослабления огибающей."
  - "Отбор исполнений вручную до FEA (рама по (а)): кованое кольцо 34CrNiMo6+QT (jG 1,0) и литьё (jG 1,25) с разной толщиной, галтели R ≥ 15, осевой упор по (б), вкладыш по (в); при необходимости — стяжки с затяжкой (усталость стяжек и отверстий — отдельно). Отобрать 1–2 исполнения с ручной FKM ≥ 1,15 и статикой ≥ 1,7."
  - "FEA (gmsh + ccx из E:\\Tools\\FreeCAD-1.1\\bin): C3D10, ступени 0 → 100 → 200 → 300 → 315 бар, давление по Janssen, реальные присоединения и упоры (не только пружины; если пружины — жёсткость с источником и чувствительность ×0,5 / ×2), галтели; сходимость < 5 % на трёх сетках по (г), (д); толщина ≥ 2 элементов; баланс ≤ 0,1 %."
  - "Сопряжение: шибер (X 295, крылья с разгрузкой), передняя щека (в T-2.2g крыша 358 мм пересекала щёку — разрешить размерами), колонны, замок башмака T-2.2g; габариты размерами."
  - "Итог: design/chamber_roof.t22h.yaml (полный, самодостаточный), таблица «деталь | статика | FKM | контакт | Δh | Δмасса | источник», требуемое облегчение станции, проект D-GK в report.md (ГК вносит сам)."
deliverables:
  - calc/T-2.2h/                           # loads.py, hand.py, fea/ (без сеток > 1 МБ), mass.py, sources.yaml, results.json; ≤ 5 МБ
  - design/chamber_roof.t22h.yaml
  - report.md
  - metrics.json
  - self_check.json
  - gates.t22h.json
acceptance:
  - "C-STR-01 ≥ 1,5 и C-FAT-01 ≥ 1,0 по FEA (кольцо, торец-субмодель, окно) со сходимостью < 5 %; контакт ≤ экрана с источником"
  - "Δh ≤ 0,6 мм при 300 бар под крышей и под башмаком (FEA, три сетки); габарит шибера, щеки и замка совместим (размерами)"
  - "ручной расчёт рамы против FEA по равнодействующей и моменту ±15 % в 2–3 сечениях"
  - "масса машины построчно с источниками; требуемое облегчение станции ≤ 230 кг (H2 18 кг)"
  - "гейты G-PFACE, G-DOSE PASS (REV_PYTHON ops/gates/calc_gates.py --params calc/T-2.6/params/params.t26a.yaml --criteria ops/criteria/design_criteria.yaml --out <worktree>/gates.t22h.json); G-CYCLE — справочно (D-GK-13 / D-OP-16)"
  - "свойства и коэффициенты — sources.yaml с url; self_check: двойной прогон даёт одинаковые results.json и design/chamber_roof.t22h.yaml (FEA — допуск 1e-6); report.md пишется из Python в UTF-8 и проверяется чтением на отсутствие «?»; временные каталоги удалить"
allowed_paths: [calc/T-2.2h/**, design/chamber_roof.t22h.yaml, report.md, metrics.json, self_check.json, gates.t22h.json]
forbidden: [git commit, git push, изменение ops/**, изменение существующих design/*.yaml и design/hydraulics/**, изменение docs/**, изменение calc/** кроме calc/T-2.2h/**, сеть из shell, выдуманные свойства и коэффициенты, CAD-модель изделия, запись в DECISIONS.md, изменение критериев, ослабление огибающей K/μ, сечения камеры 150 × 60, окна 150 × 200, Ø главного цилиндра, хода 396 мм и длины крыши 90 мм, гидравлики T-2.6]
gates: [G-PFACE, G-DOSE]
gate_inputs: {params: calc/T-2.6/params/params.t26a.yaml}
timebox_min: 180
stop_and_ask_if:
  - "ручной расчёт рамы: нет исполнения с FKM ≥ 1,15 и статикой ≥ 1,7 при облегчении станции ≤ 230 кг"
  - "FEA: FKM < 1,0, статика < 1,5 или Δh > 0,6 мм, которые нельзя исправить в пределах облегчения станции ≤ 230 кг"
  - "габарит шибера, щеки или замка несовместим с крышей 90 мм без изменения хода"
