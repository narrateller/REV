id: T-2.3
stage: S2-cad
role: CAD
backend: bos            # alm/voh — по наличию лимита; запуск строго по одному (песочница Windows, 1909)
effort: high
web_search: false
objective: >
  Мастер-компоновка (скелет) машины схемы A в FreeCAD — одна компоновка, без параллельных альтернатив (CLAUDE.md §5,
  design_criteria.architecture.forbidden). Скелет задаёт для T-2.4 и КД: глобальную систему координат и базы, оси,
  интерфейсы узлов (посадочные плоскости, оси крепежа, присоединительные размеры, передаваемые нагрузки), трассы
  гидролиний под давлением, габарит машины с бункером и ограждениями (C-ENV-01), ведомость массы тел скелета,
  сведённую с действующей ведомостью D-GK-24 / D-OP-23. Силовая часть A — как заморожена до испытания сырья (D-OP-19):
  размеры по T-2.2i без переквалификации прочности; огибающая — исполнение «с бандажом торца» (наибольшая масса и
  габарит). Гидравлика — схема T-2.9b без изменения функции. Требование D-GK-24 / D-OP-23: объём масла под давлением
  вне цилиндра ≤ 2,5 л (цель) / ≤ 6,8 л (предел); G-CYCLE на params с фактическим мёртвым объёмом и податливостью.
inputs:
  - DECISIONS.md                           # D-GK-12…D-GK-24, D-OP-14…D-OP-23 (только читать)
  - ops/criteria/design_criteria.yaml      # v4: C-ENV-01 2100 × 1900 × 2200, C-MASS-01 4900 / 5000, C-T-01 1220 ± 100, C-CLR-01 0,3, C-COLL-01, C-FEEDPATH-01
  - ops/gates/geom_gates.py                # 1.2.0: роли machine/moving/punch/chamber_liner/feed_path/hopper, свойства RevRole/RevMaterial/RevDensity_kg_m3/RevPair/RevStrokeAxis, файлы roles и poses (только читать)
  - ops/reports/T-0.1a/GK_review.md        # открытые замечания G-CLEAR: пазы вкладыша, фаска пуансона (D-GK-22)
  - design/chamber_roof.t22i.yaml, ops/reports/T-2.2i/GK_review.md, ops/reports/T-2.2i/report.md, calc/T-2.2i/   # силовая часть A: камера, крыша X 205…295, окно, нос X 205…245, шибер, колонны, кольцо, бандаж
  - design/frame.t17d.yaml, design/cylinders.t17d.yaml, design/slide_gate.t17d.yaml, design/params.t17d.yaml   # рама, цилиндры, шибер (база до A)
  - design/main_cylinder_rear.t22.yaml     # задняя крышка ГЦ 144 мм, крепление ZSF NG100, каналы MA
  - design/prepress_lock.t22d.yaml, design/prepress_lock.t22e.yaml   # башмак подпрессовки (для A — только габариты привода и хода; замок заменён носом T-2.2i)
  - design/hydraulics/T-2.9b_circuit.yaml, design/hydraulics/T-2.9b_interlocks.yaml   # действующая гидросхема (D-GK-24)
  - design/hydraulics/station.t29b.yaml    # действующая ведомость станции 1680,80 кг и машины A (mass_reconciliation_t29b; base_reconciliation; air_option.reserve_*_XYZ_mm)
  - calc/T-2.9b/ (oil_modulus.py — перечень объёмов вне цилиндра 7,90 л; params/params.t29b.yaml; mass.py; sources.yaml)   # только читать
  - ops/reports/T-2.9b/GK_review.md        # риск объёма вне цилиндра, требование T-2.3
  - calc/T-2.6/ (sources.yaml cap_dead_volume_L 0,8; cycle/drive.py decompression_compliance_multiplier)   # происхождение cap_dead_L 0,8 л (только читать)
  - calc/T-1.6/sources.yaml                # mechanical_baseline_allowances_kg: feeder_hopper 180, guards 90, electrical 75
  - ops/reports/T-1.2/GK_review.md         # подача: весовой накопитель ≈ 13 л с быстрым днищем + шнек ≈ 950 кг/ч
tools:
  freecadcmd_sandbox: E:/Tools/FreeCAD-1.1/bin/freecadcmd.exe     # REV_FREECADCMD внутри песочницы
  freecadcmd_gk: "C:/Users/user/AppData/Local/Programs/FreeCAD 1.1/bin/freecadcmd.exe"   # прогон ГК вне песочницы (та же 1.1.4)
  python: E:/Tools/Python313/python.exe     # REV_PYTHON
methods:
  - "Системы координат. Глобальная СК машины: Z = 0 — пол (опорная плоскость рамы), X — ось прессования к шиберу, Y — поперёк (правая тройка); габарит машины — в положительном октанте. Локальная СК камеры по T-2.2i (X к шиберу, Y поперёк 150, Z вверх от центра сечения, крыша X 205…295) — одно смещение относительно глобальной, записать. Все узлы — в App::Part с размещением из мастер-файла."
  - "Мастер-размеры. design/layout.t23.yaml — единственный источник размеров скелета: оси, базы, плоскости интерфейсов, ходы и крайние позиции приводов, габариты узлов, трассы. Каждое число — с источником (файл + ключ) или пометкой «назначено T-2.3» и причиной. Неизменяемые входы (не трогать, только ссылаться): сечение 150 × 60 и зазор 0,2 на сторону; ход ГЦ 396 / рабочий 371; ГЦ Ø280/200, корпус 737; крыша X 205…295 (90 мм); окно X 5…205, 200 × 150; нос башмака X 205…245 (T-2.2i nose_x225); шибер: торец X 295, толщина 54, ход 100; колонны шаг 540, Ø70; кольцо крыши 406 × 530; бандаж торца (gate_end_collar_trial, огибающая); задняя крышка 144 мм; гидросхема T-2.9b (элементы и их функция)."
  - "Скелет FreeCAD. cad/T-2.3/build_skeleton.py (запуск freecadcmd) строит cad/T-2.3/skeleton_A.FCStd только из design/layout.t23.yaml. Тела — упрощённые объёмы деталей и узлов с реальными посадочными плоскостями интерфейсов (не детализация T-2.4): рама/колонны/плиты, ГЦ с задней крышкой и ZSF NG100, траверса и пуансон (moving), камера-окно (отливка), кольцо крыши с бандажом, вкладыш (chamber_liner), башмак подпрессовки с цилиндром и носом с двумя цилиндрами AZ16, шибер с цилиндром, выход брикета, бункер (hopper) с весовым накопителем и шнеком, путь подачи (feed_path), гидростанция (бак 190 л, мотор ABB, A4VSO180, Bowman GL180, PC KF180 + 1,5 кВт, ГА Parker EHV, блоки), место воздушной опции, ограждения с дверями (закрыты), основание. Каждому телу — RevRole, RevMaterial, RevDensity_kg_m3; паре пуансон–вкладыш — RevPair и RevStrokeAxis. Роли и позы — cad/T-2.3/roles.yaml и cad/T-2.3/poses.yaml (формат geom_gates 1.2.0)."
  - "Позы (poses.yaml). nominal — пуансон в конце прессования под крышей (перекрытие пуансон–вкладыш в зоне X 205…295), башмак внизу, нос заведён, шибер закрыт. Крайние и промежуточные: ГЦ отведён (−396 от конца хода по установке) и середина хода; башмак вверху; нос выведен; шибер открыт (+100); сервисные позы приводов, если есть. Двери ограждений — закрыты во всех позах (зоны обслуживания — таблицей в report.md, не позой). Позы задаются смещениями групп из layout.t23.yaml."
  - "G-CLEAR (D-GK-22). Пара пуансон–вкладыш — по реальному зазору: пуансон 149,6 × 59,6 с радиусом угла = R отверстия − 0,2; фаска/конус торца пуансона — вне зоны перекрытия в позе nominal. Пазов, канавок и гнёзд в стенке прохода пуансона в скелете нет. Если паз в зоне прохода пуансона конструктивно необходим (например гнездо носа) — тело вкладыша не дробить ради гейта и роли не менять: оставить честный FAIL G-CLEAR и записать в report.md обоснованное исключение (где паз, его зазор, почему нужен, как проверить реальный зазор в T-2.4). Гейт и критерий не трогать."
  - "G-FEED. Путь подачи (одно тело, роль feed_path) — от загрузочного проёма бункера через накопитель/шнек к окну камеры 200 × 150; контакт с бункером и вкладышем/окном — по площади (совпадающие грани), не по ребру; в report.md — площадь окна. Высота загрузочного проёма бункера от пола — C-T-01 (1220 ± 100), значение в metrics."
  - "Гидротрассы и объём под давлением вне цилиндра (D-GK-24, D-OP-23). Трассы P0/HP, MH, MA (каналы в задней крышке), карман ZSF, MF, MC, PF (наполнение TF→A), TF→порт A ZSF — в layout.t23.yaml полилиниями с внутренним диаметром из T-2.9b (сталь, без рукавов на главном сжимаемом тракте). calc/T-2.3/pressurized_volume.py: V_out — объём масла под давлением прессования вне цилиндра (каналы MA в крышке, карман ZSF, P0/HP, MH, прочие соединённые с полостью A при прессовании) двумя методами: (1) аналитически по полилиниям и сверлениям; (2) объём тел «масляных стержней» в отдельной модели cad/T-2.3/oil_cores_A.FCStd (в гейтовую модель не входит); расхождение ≤ 2 %. Таблица по элементам против перечня oil_modulus.py T-2.9b (7,90 л). Трасса TF→порт A ZSF ≤ 0,5 м (длина по оси). Компоновка — задача минимизации V_out: ZSF и блоки на задней крышке ГЦ без длинных линий, диаметры MA и кармана ZSF — по скоростям из T-2.9b, не меньше."
  - "Податливость. V_comp — эквивалентный объём податливости силового контура по оси ГЦ (удлинение колонн, прогиб задней крышки ГЦ и плиты рамы, раздача гильзы, если не учтена в K_eff T-2.9b) при давлении прессования: V_comp = K_eff · A_пов · δ(p) / p, K_eff 1,434 ГПа (D-GK-24), δ — по жёсткостям из T-2.2i / T-1.7d / main_cylinder_rear.t22 (с источником) или ручным расчётом по сечениям скелета. Проверить по calc/T-2.6, что уже входит в cap_dead_L 0,8 л; не доказанное — добавлять полностью."
  - "G-CYCLE. calc/T-2.3/params/params.t23.yaml — копия calc/T-2.9b/params/params.t29b.yaml, изменяется только oil.cap_dead_L = 0,8 + V_out + V_comp (за вычетом доказанно учтённого в 0,8 л), с комментарием и ссылкой на расчёт; любое иное отличие от params.t29b запрещено. Справочно — скан cap_dead_L (0,8; 3,3; V_факт; 7,6) штатным гейтом: таблица cap_dead_L | цикл | RMS."
  - "Масса. calc/T-2.3/mass_ledger.py: построчная сверка тел скелета с действующей ведомостью: машина A вне станции — исполнение with_end_collar (outside_station_kg 3516,07, T-2.2i/T-2.5c), станция — station.t29b.yaml 1680,80 кг; итог по ведомости 5196,86 кг (D-GK-24, D-OP-23). Каждая строка ведомости → тело или агрегатное тело скелета; масса тела = плотность × объём тела. Реальная плотность материала — для тел с реальным объёмом детали; для упрощённых объёмов COTS и агрегатов (масло, крепёж, трубы, кабели, накопитель) — эквивалентная плотность = масса строки / объём тела, RevMaterial «equiv:<строка ведомости>». Облегчения D-OP-23 (лёгкий двигатель PC 6p Al с паспортом; укорочение трассы PF −11,7 кг при подтверждении длины скелетом) — отдельными строками с расчётом и источником; без источника не зачитываются. Требование: |M_скелета − M_ведомости| ≤ 1 % (M_ведомости = 5196,86 − зачтённые облегчения) и M_скелета ≤ 1,01 · M_ведомости."
  - "G-MASS — ожидаемый FAIL по C-MASS-01 (машина A 5153–5197 кг > 5000, принято оператором с закрытием по испытанию сырья, D-OP-21, D-OP-23). Это не дефект исполнителя: не подгонять плотности, не исключать тела из роли machine, не выносить массу в тела без Solids, не делить машину на модели. FAIL G-MASS с M_скелета в пределах сверки — нормальный исход; решение о приёмке принимает ГК/оператор."
  - "Интерфейсы. design/layout.t23.yaml раздел interfaces: для каждой пары узлов — id, узлы, базовая поверхность (плоскость/ось в глобальной СК), присоединительные размеры, крепёж (из входов), передаваемая нагрузка (сила/момент при 315 бар из входов), зазоры. Минимум: рама/колонны ↔ ГЦ и задняя крышка; рама ↔ камера-окно и кольцо крыши; кольцо ↔ шибер и его упор; башмак и нос ↔ окно/кольцо (гнездо X 205…245); шибер ↔ привод; бункер/накопитель/шнек ↔ окно; станция ↔ основание и трассы к ГЦ; ограждения ↔ рама (блокировки дверей C-SAFE-01 — места датчиков); воздушная опция ↔ станция (место и присоединения CP/CF). Зазоры подвижных узлов к соседям во всех позах — таблица (минимум, поза)."
  - "self_check: двойной прогон build_skeleton.py, pressurized_volume.py, mass_ledger.py даёт побайтно одинаковые layout-производные JSON (список тел: имя, роль, объём, bbox, масса — cad/T-2.3/bodies.json), results.json и params.t23.yaml. report.md пишется из Python в UTF-8; проект строки D-GK — в конце (ГК вносит сам). FCStd ≤ 10 МБ каждый; временные каталоги удалить."
deliverables:
  - design/layout.t23.yaml                    # мастер-размеры, СК, интерфейсы, трассы, позы
  - cad/T-2.3/build_skeleton.py
  - cad/T-2.3/skeleton_A.FCStd                # генерируется
  - cad/T-2.3/oil_cores_A.FCStd               # генерируется, вне гейтов
  - cad/T-2.3/roles.yaml
  - cad/T-2.3/poses.yaml
  - cad/T-2.3/bodies.json                     # генерируется
  - calc/T-2.3/                               # pressurized_volume.py, compliance.py, mass_ledger.py, results.json, sources.yaml, params/params.t23.yaml; ≤ 5 МБ
  - report.md
  - metrics.json                              # envelope_mm, envelope_per_pose_mm, mass_skeleton_kg, mass_ledger_kg, mass_delta_pct, credited_reductions_kg, bodies_count, coll_max_mm3, feed_window_mm2, clear_max_mm, hopper_opening_height_mm, V_out_L, V_out_L_method2, V_out_by_element_L, V_comp_L, cap_dead_L, TF_to_ZSF_A_m, cycle_gate_s, rms_kW, cap_dead_scan, interfaces_count, min_moving_clearance_mm
  - self_check.json
  - gates.t23.json
acceptance:
  - "G-ENV PASS (C-ENV-01 2100 × 1900 × 2200 с бункером и ограждениями, все позы) — обязательно"
  - "G-COLL PASS во всех позах; G-FEED PASS; G-CLEAR PASS или честный FAIL с обоснованным исключением по методу G-CLEAR (без дробления тел и смены ролей)"
  - "G-MASS выполнен; M_скелета сведена с ведомостью D-GK-24 построчно, |Δ| ≤ 1 %, M_скелета ≤ 1,01 · M_ведомости; FAIL по C-MASS-01 — ожидаемый (D-OP-23), без подгонки"
  - "V_out ≤ 6,8 л (предел), цель ≤ 2,5 л; два метода расходятся ≤ 2 %; трасса TF→порт A ZSF ≤ 0,5 м"
  - "G-PFACE, G-DOSE, G-CYCLE PASS на calc/T-2.3/params/params.t23.yaml (REV_PYTHON ops/gates/calc_gates.py --params calc/T-2.3/params/params.t23.yaml --criteria ops/criteria/design_criteria.yaml --out <worktree>/gates.t23.json), method reference_model, цикл ≤ 6,0 с (цель ≤ 5,95 с), RMS ≤ 30,0 кВт; отличие params.t23 от params.t29b — только cap_dead_L"
  - "геометрические гейты исполнитель прогоняет сам: REV_GATE_ARGS {model: cad/T-2.3/skeleton_A.FCStd, roles: cad/T-2.3/roles.yaml, poses: cad/T-2.3/poses.yaml, criteria: ops/criteria/design_criteria.yaml, out: <файл>} + freecadcmd ops/gates/geom_gates.py; результаты — в report.md"
  - "интерфейсы и мастер-размеры с источниками; высота загрузочного проёма C-T-01 в metrics; report.md без «?» (проверено чтением)"
allowed_paths: [design/layout.t23.yaml, cad/T-2.3/**, calc/T-2.3/**, report.md, metrics.json, self_check.json, gates.t23.json]
forbidden: [git commit, git push, изменение ops/** (в т. ч. гейтов, критериев, ролей гейтов и границ квалификации), изменение существующих design/** (кроме нового design/layout.t23.yaml), изменение calc/** кроме calc/T-2.3/**, изменение docs/**, сеть из shell, выдуманные размеры и массы (только из входов или «назначено T-2.3» с причиной), параллельные альтернативные компоновки (одна компоновка), подгонка плотностей и ролей ради G-MASS/G-CLEAR, изменение params кроме oil.cap_dead_L и уменьшение cap_dead_L ниже 0,8 + V_out, переквалификация прочности и изменение размеров силовой части A (D-OP-19), изменение сечения 150 × 60, хода ГЦ 396 / 371, крыши X 205…295, гидросхемы T-2.9b и её элементов, рукава на главном сжимаемом тракте]
gates: [G-ENV, G-MASS, G-COLL, G-FEED, G-CLEAR, G-PFACE, G-DOSE, G-CYCLE]
gate_inputs: {model: cad/T-2.3/skeleton_A.FCStd, roles: cad/T-2.3/roles.yaml, poses: cad/T-2.3/poses.yaml, params: calc/T-2.3/params/params.t23.yaml}
timebox_min: 240
stop_and_ask_if:
  - "габарит с бункером и ограждениями не входит в 2100 × 1900 × 2200 ни при какой расстановке узлов без изменения неизменяемых входов — дать лучший габарит по осям и что выступает"
  - "V_out > 6,8 л при компоновке ZSF и блоков на задней крышке без длинных линий, или G-CYCLE > 6,0 с / RMS > 30 кВт на params.t23 — дать таблицу V_out по элементам, V_comp и скан cap_dead_L"
  - "M_скелета больше ведомости D-GK-24 более чем на 1 % (с учётом зачтённых облегчений) — дать Δ по строкам"
  - "конфликт интерфейсов (коллизия, отсутствие места под узел или трассу), который требует изменения хода 396, крыши 90 мм, сечения 150 × 60, размеров силовой части A или гидросхемы T-2.9b — дать место, позу и величину конфликта"
