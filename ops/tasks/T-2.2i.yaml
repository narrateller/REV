id: T-2.2i
stage: S2-str
role: TECH
backend: bos            # alm/voh — по наличию лимита; запуск строго по одному
effort: high
web_search: true        # опоры башмака/матрицы RUF/WEIMA, посадка/навивка колец, FKM средних напряжений
objective: >
  Третий заход схемы A по D-GK-15 / D-OP-18 — переработка силового пути, а не наращивание массы.
  (1) Передняя опора башмака подпрессовки без рычага: в T-2.2h равнодействующая башмака на X ≈ 192, передний засов на X 148, пятка на X 55,
  отсюда рычаг 1,47·F (засовы 241 / −79 кН), Δh окна 0,856 мм, FKM щеки 0,694. Опору перенести в линию нагрузки — например нос башмака на вход кольца крыши
  (X 205…230, где FKM 1,12–1,34) или засов в линии равнодействующей; рассмотреть 2–3 исполнения ручным отбором.
  (2) Торец кольца крыши со стороны шибера (FKM 0,852, σ в галтели ≈ 3,05·p — наращивание малоэффективно): средние напряжения снять предварительным
  напряжением (горячая посадка бандажа, навивка или стяжки с затяжкой) либо изменить форму торца; учесть дополнительную реакцию башмака на входе кольца.
  Цель: C-STR-01 ≥ 1,5 (315 бар), C-FAT-01 ≥ 1,0 (0 → 300 бар, 10⁷) по сошедшейся FEA для кольца, торца, окна/опоры башмака, засовов и бандажа/стяжек;
  Δh ≤ 0,6 мм при 300 бар под крышей и под башмаком; облегчение гидростанции ≤ 230 кг при H2 18 кг (масса машины до облегчения ≤ 5230 кг).
inputs:
  - DECISIONS.md                           # D-GK-11…D-GK-15, D-OP-14…D-OP-18
  - ops/criteria/design_criteria.yaml      # v4
  - ops/reports/T-2.2h/ (GK_review.md, report.md, metrics.json), calc/T-2.2h/, design/chamber_roof.t22h.yaml   # исходное исполнение (только читать; копия нужного в calc/T-2.2i/)
  - ops/reports/T-2.2g/GK_review.md, ops/reports/T-2.2e/GK_review.md, ops/reports/T-2.2f/GK_review.md   # уроки
  - ops/reports/T-2.6/GK_review.md, calc/T-2.6/params/params.t26a.yaml   # ход 396 / рабочий 371, гидравлика +76,2 кг (только читать)
  - design/frame.t17d.yaml, design/slide_gate.t17d.yaml, design/cylinders.t17d.yaml, design/main_cylinder_rear.t22.yaml, design/prepress_lock.t22d.yaml
defects_from_T-2.2h:   # обязательны (проверка Opus)
  - "Сетка — не менее 3 элементов по толщине самой тонкой несущей детали (ножка замка 21 мм в T-2.2h имела < 2); сходимость < 5 % по Δh и FKM на трёх сетках для каждой определяющей детали."
  - "Засовы, опоры башмака и посадки — контактом (ccx, контактные пары), а не приведёнными пружинами; если пружины где-то остаются — жёсткость с источником и чувствительность ×0,5 / ×2. Знак реакций во всех случаях перекоса — проверять."
  - "Эксцентриситет тракции 27,72 мм (> b/6 = 25 мм) для постели 150 мм — обосновать источником или исправить постель."
  - "Ручной расчёт против FEA: момент сравнивать в абсолютных величинах относительно определяющего (не относительной ошибкой в сечениях с малым моментом), ±15 %."
  - "Площадь осевых опор кольца: контакт ≤ экрана 80 МПа (в T-2.2h 92 МПа)."
  - "Ручная рама оптимистичнее FEA на ≈ 23 % (3D и трение) — ручной отбор вести с этой поправкой."
methods:
  - "Нагрузка — как T-2.2h (Janssen, огибающая K 0,35–0,60 × μ 0,20–0,30, длина ≤ 89,4 мм, блокировка дозы 0,853 кг, перекос), без ослабления. Случаи: окончательное сжатие (крыша + башмак держит фронт брикета), подпрессовка 171 кН, перенос дозы 35,25 кН."
  - "Ручной отбор опоры башмака: схема сил, плечи, реакции засовов/носа; кинематика замка (ход, усилие штока ≤ модели T-2.6, остаток ≤ 2 кН) и совместимость с шибером и крыльями; отобрать одно исполнение."
  - "Торец кольца: предварительное напряжение (бандаж с натягом — Ламе, потеря натяга от температуры и проскальзывания; навивка; стяжки — усталость стяжек и отверстий) — FKM со средними напряжениями по FKM, коэффициент M с источником."
  - "FEA (gmsh + ccx из E:\\Tools\\FreeCAD-1.1\\bin): C3D10, ступени 0 → 100 → 200 → 300 → 315 бар, давление по Janssen, контакты по дефектам выше, натяг как начальный шаг; сходимость < 5 %, баланс ≤ 0,1 %."
  - "Масса построчно (как T-2.2h) по проходному исполнению; требуемое облегчение станции."
  - "Итог: design/chamber_roof.t22i.yaml (полный, самодостаточный), таблица «деталь | статика | FKM | контакт | Δh | Δмасса | источник», проект D-GK в report.md (ГК вносит сам)."
deliverables:
  - calc/T-2.2i/                           # loads.py, hand.py, fea/ (без сеток > 1 МБ), mass.py, sources.yaml, results.json; ≤ 5 МБ
  - design/chamber_roof.t22i.yaml
  - report.md
  - metrics.json
  - self_check.json
  - gates.t22i.json
acceptance:
  - "C-STR-01 ≥ 1,5 и C-FAT-01 ≥ 1,0 по FEA со сходимостью < 5 % для кольца, торца, опоры башмака, засовов, бандажа/стяжек; контакт ≤ экрана с источником"
  - "Δh ≤ 0,6 мм при 300 бар под крышей и под башмаком (FEA, три сетки, контакт); габариты шибера, щеки, замка и колонн совместимы (размерами)"
  - "ручной расчёт против FEA по равнодействующей и абсолютному моменту ±15 % в 2–3 сечениях"
  - "масса машины построчно с источниками; требуемое облегчение станции ≤ 230 кг (H2 18 кг)"
  - "гейты G-PFACE, G-DOSE PASS (REV_PYTHON ops/gates/calc_gates.py --params calc/T-2.6/params/params.t26a.yaml --criteria ops/criteria/design_criteria.yaml --out <worktree>/gates.t22i.json); G-CYCLE — справочно (D-GK-13 / D-OP-16); кинематика замка не удлиняет цикл эталона T-2.6"
  - "свойства и коэффициенты — sources.yaml с url; self_check: двойной прогон даёт одинаковые results.json и design/chamber_roof.t22i.yaml (FEA — допуск 1e-6); report.md пишется из Python в UTF-8 и проверяется чтением на отсутствие «?»; временные каталоги удалить"
allowed_paths: [calc/T-2.2i/**, design/chamber_roof.t22i.yaml, report.md, metrics.json, self_check.json, gates.t22i.json]
forbidden: [git commit, git push, изменение ops/**, изменение существующих design/*.yaml и design/hydraulics/**, изменение docs/**, изменение calc/** кроме calc/T-2.2i/**, сеть из shell, выдуманные свойства и коэффициенты, CAD-модель изделия, запись в DECISIONS.md, изменение критериев, ослабление огибающей K/μ, сечения камеры 150 × 60, окна 150 × 200, Ø главного цилиндра, хода 396 мм и длины крыши 90 мм, гидравлики T-2.6]
gates: [G-PFACE, G-DOSE]
gate_inputs: {params: calc/T-2.6/params/params.t26a.yaml}
timebox_min: 180
stop_and_ask_if:
  - "ручной отбор: ни одно исполнение опоры башмака не даёт Δh ≤ 0,6 мм и FKM ≥ 1,15 (с поправкой ≈ 23 % на 3D) при облегчении станции ≤ 230 кг"
  - "FEA: FKM < 1,0, статика < 1,5 или Δh > 0,6 мм, которые нельзя исправить в пределах облегчения станции ≤ 230 кг"
  - "опора башмака или бандаж несовместимы с шибером, крыльями или колоннами без изменения хода или длины крыши"
