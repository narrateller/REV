id: T-2.2
stage: S2-str
role: TECH
backend: alm            # voh — лимит до 01.12; резерв bos (запуск строго по одному — песочница Windows)
effort: high
web_search: true        # VDI 2230, каталоги ZSF RE 20478, FKM, свойства сталей (поиск на стороне модели; shell без сети)
objective: >
  Закрыть остатки G-FEA шага 1 по действующей геометрии (D1, D-GK-05, D-GK-06) до первой силовой CAD-модели:
  (A) крепление наполнительного клапана ZSF NG100 к задней крышке главного цилиндра (8 × M27 10.9: экран VDI 2230 при худшей
  затяжке 955 > 846 МПа); (B) задняя крышка ГЦ (статика с преднатягом 1,39 < 1,5, усталость 1,17); (C) поперечный силовой путь
  камеры: засовы, башмак подпрессовки, боковины/корпус камеры под боковым давлением брикета (до 0,90 МН high при 1,52 МН,
  1,22 МН на верхней дозе при 1,70 МН) — статика по C-STR-01 и ресурс по C-FAT-01 (до сих пор только скрининг T-1.2b).
  Для каждого — исполнение, проходящее C-STR-01 ≥ 1,5 и C-FAT-01 ≥ 1,0 при 10⁷, с минимальным изменением массы и без
  изменения интерфейсов, принятых в D-GK-01/03/05.
inputs:
  - DECISIONS.md                           # D-OP-06, D-GK-01, D-GK-03, D-GK-05, D-GK-06, D1
  - ops/criteria/design_criteria.yaml      # v4: C-STR-01, C-FAT-01 (FKM, IIW, EN 1993-1-9, VDI 2230)
  - ops/reports/T-1.7b/GK_review.md, ops/reports/T-1.7b/report.md, calc/T-1.7b/ (retained_cap.py, cap_pressure.py, sources.yaml)   # ZSF и крышка — исходные экраны (только читать)
  - design/cylinders.t17d.yaml, design/cylinders.t16.yaml, calc/T-1.6/      # главный цилиндр, крышки, порты, ZSF (только читать)
  - ops/reports/T-1.2b/report.md, calc/T-1.2b/ (shoe_load.py, results.json)  # засовы, башмак, нагрузки (только читать)
  - design/frame.t17d.yaml, ops/reports/T-1.7/GK_review.md, calc/T-1.7/      # рама, модуль камеры, методика FEA и FKM (только читать)
  - calc/T-1.1/curve.yaml                   # p(ρ), боковое давление
methods:
  - "Нагрузки: статика — при 315 бар (1,94 МН на главном, соответствующее боковое давление по T-1.2b с множителем 315/300); усталость — пульсация 0 → 1,70 МН (300 бар) и соответствующее боковое, 10⁷ циклов; для ZSF и крышки — давление в поршневой полости 0 → 300 бар и 315 статически, плюс реакция наполнения/сброса (импульс при открытии ZSF — оценить или обосновать отсутствие)."
  - "(A) ZSF NG100: проверка по VDI 2230-1:2015 с фактическими данными RE 20478 (размер, глубина ввинчивания, рекомендуемый момент — из каталога с url) и материалом крышки (42CrMo4+QT); разброс затяжки α_A по способу затяжки; рабочая нагрузка от давления на площади уплотнения клапана; коэффициент нагрузки Φ по податливостям; усталость резьбы (σ_ASV/σ_ASG) ; смятие под головкой; при FAIL — меры по порядку: способ затяжки (угол/гидронатяг), шпильки с утонённым стержнем, M30/12.9 при совместимости с фланцем ZSF, переходной фланец — с массой и влиянием на длину."
  - "(B) Задняя крышка ГЦ: объёмная FEA (gmsh + ccx из E:\\Tools\\FreeCAD-1.1\\bin, копия методики T-1.7/T-1.7b) с портами MA/ZSF, болтами/шпильками крепления к гильзе с преднатягом и опорой на траверсу; C-STR-01 ≥ 1,5 без зависимости от преднатяга и с ним; C-FAT-01 по FKM (k_D, n_σ из градиента, M_σ, j как в T-1.7; поковка j_G 1,0); сходимость < 5 % на трёх сетках в управляющих точках; при FAIL — толщина/галтели/расположение портов с Δмассы."
  - "(C) Поперечный путь: засов (контакт, изгиб, срез), заплечики башмака, направляющие засовов и боковины корпуса камеры — FEA подмодели (одна четверть/половина по симметрии, контакт μ 0,15) с распределением 60/40 по T-1.2b и эксцентриситетом; C-STR-01 ≥ 1,5, C-FAT-01 ≥ 1,0, контакт против экрана смятия с источником; прогиб башмака (влияние на допуск брикета C-PROD-01 150 × 60 ± 1); сопряжение с модулем камеры T-1.7 (базы направляющих — не менять). При FAIL — сечения/материал/перекрытие засова с Δмассы и влиянием на ход кулачка (12 мм) и цикл (только если меняется ход штока подпрессовки — тогда цикл копией calc/T-2.1/cycle)."
  - "Итог: design/main_cylinder_rear.t22.yaml (крышка + ZSF крепёж), design/chamber_lateral.t22.yaml (засовы, башмак, боковины), таблица «узел | было | стало | запас статика/ресурс | Δмасса | источник»; масса машины от 4942 кг (T-2.1)."
deliverables:
  - calc/T-2.2/                            # vdi2230.py, cap_fea/, lateral_fea/ (входы, .geo, сводки .json; без сеток > 1 МБ), mass.py, sources.yaml, results.json; ≤ 5 МБ
  - design/main_cylinder_rear.t22.yaml
  - design/chamber_lateral.t22.yaml
  - report.md
  - metrics.json
  - self_check.json
  - gates.t22.json
acceptance:
  - "(A) VDI 2230: все проверки (сборочное напряжение, рабочее, усталость резьбы, смятие, нераскрытие стыка) с запасом ≥ требований стандарта и C-STR-01 ≥ 1,5 при 315 бар при худшей затяжке; каталожные данные ZSF — sources.yaml с url"
  - "(B), (C): C-STR-01 ≥ 1,5 и C-FAT-01 ≥ 1,0 по FEA со сходимостью < 5 % в управляющих точках на трёх сетках; реакции и баланс сил ≤ 0,1 %"
  - "интерфейсы D-GK-01/03/05 не изменены, либо изменение показано с влиянием на цикл и массу и вынесено как проект решения"
  - "гейты G-PFACE, G-DOSE, G-CYCLE PASS (REV_PYTHON ops/gates/calc_gates.py --params design/params.t21.yaml --criteria ops/criteria/design_criteria.yaml --out <worktree>/gates.t22.json)"
  - "self_check: двойной прогон даёт одинаковые results.json и design/*.t22.yaml (FEA — допуск 1e-6); все файлы читаются обычным пользователем; временные каталоги расчёта удалить"
allowed_paths: [calc/T-2.2/**, design/main_cylinder_rear.t22.yaml, design/chamber_lateral.t22.yaml, report.md, metrics.json, self_check.json, gates.t22.json]
forbidden: [git commit, git push, изменение ops/**, изменение существующих design/*.yaml и design/hydraulics/**, изменение docs/**, изменение calc/** кроме calc/T-2.2/**, сеть из shell, выдуманные каталожные данные и свойства, CAD-модель изделия, запись в DECISIONS.md, изменение Ø и ходов цилиндров]
gates: [G-PFACE, G-DOSE, G-CYCLE]
gate_inputs: {params: design/params.t21.yaml}
timebox_min: 180
stop_and_ask_if:
  - "крепление ZSF не проходит VDI 2230 без изменения фланца клапана (нужен нестандартный клапан или переходник с изменением длины ГЦ > 20 мм)"
  - "поперечный путь не проходит без изменения хода кулачка/штока подпрессовки или сечения камеры"
  - "масса машины > 5000 кг по номиналу"
