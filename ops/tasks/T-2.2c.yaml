id: T-2.2c
stage: S2-str
role: TECH
backend: alm            # voh — лимит до 01.12; резерв bos (разрешение оператора 26.11); запуск строго по одному
effort: high
web_search: true        # аналоги (брикетировочные прессы с вертикальной подпрессовкой), клиновые замки, контакт закалённых пар, FKM
objective: >
  Замок башмака подпрессовки по D-OP-13. Башмак закрывает окно 150 × 200 (x 5–205 мм) и воспринимает вверх 1,224 МН
  при 300 бар и 1,285 МН при 315 бар (профиль T-1.2b, центр x 141,3 мм). Два засова с выходом 36 мм (D-GK-01) отклонены:
  T-2.2 (открытый крюк), T-2.2b (карманы 0,90/0,25; ярма со стяжками — контакт 1304/360 МПа, Δh 1,19 мм, ресурс стяжек ≤ 0,91,
  +53 кг). Одно сравнительное исследование топологии, итог — одно исполнение, которое проходит C-STR-01 ≥ 1,5, C-FAT-01 ≥ 1,0
  (10⁷), контакт ≤ экрана с источником, вклад в размер брикета ≤ 0,5 мм по высоте при 300 бар, с Δмассы узла ≤ +40 кг против
  строки камеры 180,22 кг и циклом ≤ 6,0 с, — и проект D-GK вместо пункта D1 «два засова с кулачком».
inputs:
  - DECISIONS.md                           # D0, D-GK-01, D-GK-05, D-GK-07, D-OP-10, D-OP-13, D1
  - ops/criteria/design_criteria.yaml      # v4
  - ops/reports/T-2.2b/ (GK_review.md, report.md), calc/T-2.2b/   # нагрузки, ручные модели, контактная FEA (только читать; копии в calc/T-2.2c/)
  - ops/reports/T-2.2/GK_review.md, ops/reports/T-1.2b/report.md, calc/T-1.2b/   # профиль бокового давления, кулачок, башмак
  - design/frame.t17d.yaml, design/cylinders.t17d.yaml, design/slide_gate.t17d.yaml, ops/reports/T-1.7/GK_review.md   # рама, модуль камеры, шибер
  - calc/T-2.1/cycle/, design/params.t21.yaml   # действующий эталон цикла и эквивалент гейта (только читать)
  - calc/T-1.1/curve.yaml                   # p(ρ), боковое давление
methods:
  - "Кандидаты (не больше четырёх, каждый — одной строкой с причиной включения): (1) клиновой/блочный замок через всю ширину башмака с прямым силовым путём в замкнутую вертикальную раму модуля камеры (без изгиба крепежа, стяжки — если есть — соосно нагрузке), закалённые сменные вкладыши контакта; (2) башмак опирается на основную раму пресса (траверсы/колонны T-1.7) — оценить, допускает ли рама поперечную нагрузку и кинематика подпрессовки; (3) вынос зоны окончательного сжатия за окно (дополнительная закрытая длина камеры) — снижение давления на башмак против роста хода, массы рамы и цикла; (4) иное по аналогам с источником — если найдётся. Гидравлическое удержание башмака цилиндром подпрессовки — только как опорная строка (податливость масляного столба) или обоснованный отказ."
  - "Для каждого — ручной расчёт (балки, рамы, клин: угол самоторможения при μ 0,10–0,15, сила привода клина/блока; Hertz/смятие закалённых пар с источником допустимых давлений): статика 315 бар, ресурс 0 → 300 бар, контакт, податливость (вклад в размер брикета), Δмасса, кинематика (ход, время запирания/отпирания, привод — от штока подпрессовки или отдельный), влияние на цикл (оценка), изготовление и сборка. Таблица «кандидат | статика | ресурс | контакт | Δh брикета | Δмасса | цикл | риск». Выбор по ручному расчёту; FEA только для выбранного."
  - "FEA выбранного (gmsh + ccx из E:\\Tools\\FreeCAD-1.1\\bin): методика T-2.2b круг 2 (ступени нагрузки, TIE только для стыков, которые по замыслу не раскрываются, — с ручной проверкой нераскрытия; фрикционный контакт μ 0,15 только по рабочим парам; кромки R ≥ 5, бочкообразность); пики вне сингулярных кромок; сходимость < 5 % на трёх сетках в управляющих точках; баланс сил ≤ 0,1 %; согласие с ручным расчётом в 2–3 сечениях ±15 % или объяснение. Если контактная модель не сходится — подмодель контакта с перемещениями из линейной модели узла."
  - "FKM как в T-1.7 (k_D 15, n_σ по градиенту, M_σ, j 1,5; j_G 1,0 поковка/прокат, 1,25 литьё). Крепёж — VDI 2230 полностью, включая эксцентричное нагружение."
  - "Цикл: если меняются ходы/время подпрессовки или главный ход — копия calc/T-2.1/cycle → calc/T-2.2c/cycle, design/params.t22c.yaml генератором копии (как params.t21); эталон и G-CYCLE ≤ 5,95 с. Иначе — обоснование, почему цикл не меняется, и gate_inputs params.t21."
  - "Масса машины от 4942,65 кг (T-2.2) − 180,22 (строка камеры) + новый узел; отдельно строка H2 T-2.2 (+5…18 кг). Перевес над 5000 кг закрывается облегчением гидростанции по D-OP-10 — отдельной задачей; показать требуемое облегчение."
  - "Итог: design/prepress_lock.t22c.yaml (полный, самодостаточный: камера, башмак, замок, привод, интерфейсы с рамой T-1.7 и подачей), таблица кандидатов, проект D-GK (замена пункта D1 / D-GK-01 в части замка) в report.md — ГК вносит сам."
deliverables:
  - calc/T-2.2c/                           # hand.py, fea/ (входы, .geo, сводки .json; без сеток > 1 МБ), cycle/ (если нужно), mass.py, sources.yaml, results.json; ≤ 5 МБ
  - design/prepress_lock.t22c.yaml
  - design/params.t22c.yaml                # только если меняются ходы/фазы
  - report.md
  - metrics.json
  - self_check.json
  - gates.t22c.json
acceptance:
  - "выбранное исполнение: C-STR-01 ≥ 1,5 и C-FAT-01 ≥ 1,0 по FEA со сходимостью < 5 % на трёх сетках; контакт ≤ экрана с источником; крепёж — VDI 2230 все проверки PASS; вклад в размер брикета ≤ 0,5 мм по высоте при 300 бар"
  - "выбор обоснован таблицей ручного расчёта всех кандидатов; аналоги — с источником (url)"
  - "Δмасса узла ≤ +40 кг против 180,22 кг или превышение показано с требуемым облегчением гидростанции; цикл ≤ 6,0 с (эталон) и G-CYCLE ≤ 5,95 с"
  - "сечение 150 × 60, окно 150 × 200, давление на торце, главный цилиндр Ø280/200 — без изменений; базы направляющих T-1.7 — без изменений или изменение показано"
  - "гейты G-PFACE, G-DOSE, G-CYCLE PASS (REV_PYTHON ops/gates/calc_gates.py --params design/params.t22c.yaml (или t21, если ходы и фазы не менялись) --criteria ops/criteria/design_criteria.yaml --out <worktree>/gates.t22c.json)"
  - "свойства, допускаемые давления, коэффициенты — sources.yaml с url и местом чтения; self_check: двойной прогон даёт одинаковые results.json и design/*.t22c.yaml (FEA — допуск 1e-6); временные каталоги удалить; все файлы читаются обычным пользователем"
allowed_paths: [calc/T-2.2c/**, design/prepress_lock.t22c.yaml, design/params.t22c.yaml, report.md, metrics.json, self_check.json, gates.t22c.json]
forbidden: [git commit, git push, изменение ops/**, изменение существующих design/*.yaml и design/hydraulics/**, изменение docs/**, изменение calc/** кроме calc/T-2.2c/**, сеть из shell, выдуманные свойства и коэффициенты, CAD-модель изделия, запись в DECISIONS.md, изменение сечения камеры, окна, Ø главного цилиндра, параллельная проработка двух исполнений после выбора]
gates: [G-PFACE, G-DOSE, G-CYCLE]
gate_inputs: {params: design/params.t21.yaml}
timebox_min: 180
stop_and_ask_if:
  - "ни один кандидат не проходит статику, ресурс и контакт по ручному расчёту"
  - "лучший кандидат требует Δмассы узла > +80 кг или цикла > 6,0 с"
  - "лучший кандидат требует изменения рамы T-1.7 (траверсы, колонны) или главного хода"
