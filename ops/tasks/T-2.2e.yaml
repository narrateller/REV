id: T-2.2e
stage: S2-str
role: TECH
backend: bos            # все аккаунты допустимы (CLAUDE.md §3); запуск строго по одному
effort: high
web_search: true        # контакт закалённых пар, FKM, синхронные поворотные механизмы
objective: >
  Квалификация байонетного замка башмака подпрессовки по D-GK-10 на нагрузке 1,034 / 1,086 МН (300 / 315 бар, крыша 15 мм):
  C-STR-01 ≥ 1,5, C-FAT-01 ≥ 1,0 (0 → 300 бар, 10⁷) по FEA со сходимостью < 5 %; контакт зубьев и пят ≤ экрана с источником
  и проверкой ресурса пары; Δh ≤ 0,6 мм при 300 бар; поворот муфт совмещён с другими движениями цикла (G-CYCLE ≤ 5,95 с);
  Δ узла минимальна (ориентир ≤ +60 кг против 180,22 кг строки камеры).
inputs:
  - DECISIONS.md                           # D-GK-09, D-GK-10, D-OP-10, D-OP-13
  - ops/criteria/design_criteria.yaml      # v4
  - ops/reports/T-2.2d/ (GK_review.md, report.md), calc/T-2.2d/, design/prepress_lock.t22d.yaml   # нагрузка, крыша, байонет (ручной отсев), цикл (только читать; копия в calc/T-2.2e/)
  - design/params.t22d.yaml                # действующий эквивалент гейта
  - ops/reports/T-2.2b/, calc/T-2.2b/fea/  # методика контактной FEA до 315 бар
  - design/frame.t17d.yaml, design/slide_gate.t17d.yaml, ops/reports/T-1.7/GK_review.md   # рама, шибер (сдвиг +15 мм по D-GK-10), методика FKM
methods:
  - "Исходное исполнение — вариант T-2.2d с наименьшим Δh при FKM ≥ 1,10; разрешено перераспределить массу между днищем, поперечиной, стойками и муфтами для Δh ≤ 0,6 мм при FKM ≥ 1,10 по ручному расчёту; таблица чувствительности (5–10 строк)."
  - "Равномерность нагрузки зубьев: допуски посадки муфт, податливость стоек; требование к сборке (подгонка, шлифование пар) — в КД-требования; худшая доля зуба в расчёт."
  - "FEA (gmsh + ccx из E:\\Tools\\FreeCAD-1.1\\bin) по методике T-2.2b круг 2: ступени 0 → 100 → 200 → 300 → 315 бар; фрикционный контакт μ 0,15 по зубьям и пятам (R ≥ 5, бочкообразность); TIE только для нераскрывающихся стыков с ручной проверкой; симметрия где возможно; сходимость < 5 % на трёх сетках в управляющих точках вне сингулярных кромок; баланс ≤ 0,1 %; ручной расчёт против FEA в 2–3 сечениях ±15 %. Если контакт не сходится — подмодель муфты с перемещениями из линейной модели узла."
  - "FKM как в T-1.7 (литьё jG 1,25, поковка 1,0). Контакт закалённых пар 52–57 HRC: экран с источником и отдельная оценка ресурса пульсирующего контакта (источник; при отсутствии — консервативная граница и требование стендовой проверки)."
  - "Привод муфт: синхронизация, контроль положений, сила/момент разгруженного поворота, отпирание только после разгрузки; диаграмма цикла с совмещением поворота (копия calc/T-2.2d/cycle) — G-CYCLE и эталон; если поворот не совмещается — design/params.t22e.yaml генератором копии и гейт на нём."
  - "Масса машины: 4942,65 − 180,22 + узел + 15,05 (крыша, D-GK-10); строка H2 T-2.2 (+5…18 кг) отдельно; требуемое облегчение станции."
  - "Итог: design/prepress_lock.t22e.yaml (полный, самодостаточный), таблица «деталь | статика | ресурс | контакт | Δh | Δмасса | источник», проект уточнения D-GK-10 в report.md."
deliverables:
  - calc/T-2.2e/                           # hand.py, fea/ (без сеток > 1 МБ), cycle/, mass.py, sources.yaml, results.json; ≤ 5 МБ
  - design/prepress_lock.t22e.yaml
  - design/params.t22e.yaml                # только если меняются фазы цикла
  - report.md
  - metrics.json
  - self_check.json
  - gates.t22e.json
acceptance:
  - "C-STR-01 ≥ 1,5 и C-FAT-01 ≥ 1,0 по FEA со сходимостью < 5 % на трёх сетках; контакт ≤ экрана с источником; ресурс контакта оценён"
  - "Δh ≤ 0,6 мм при 300 бар (FEA); передняя опора вне огибающей шибера (сдвиг +15 мм)"
  - "цикл: G-CYCLE ≤ 5,95 с с поворотом муфт; эталон ≤ 5,90 с"
  - "масса машины с источниками строк; требуемое облегчение станции"
  - "гейты G-PFACE, G-DOSE, G-CYCLE PASS (REV_PYTHON ops/gates/calc_gates.py --params design/params.t22e.yaml (или t22d, если фазы не менялись) --criteria ops/criteria/design_criteria.yaml --out <worktree>/gates.t22e.json)"
  - "свойства и коэффициенты — sources.yaml с url; self_check: двойной прогон даёт одинаковые results.json и design/*.t22e.yaml (FEA — допуск 1e-6); временные каталоги удалить; все файлы читаются обычным пользователем"
allowed_paths: [calc/T-2.2e/**, design/prepress_lock.t22e.yaml, design/params.t22e.yaml, report.md, metrics.json, self_check.json, gates.t22e.json]
forbidden: [git commit, git push, изменение ops/**, изменение существующих design/*.yaml и design/hydraulics/**, изменение docs/**, изменение calc/** кроме calc/T-2.2e/**, сеть из shell, выдуманные свойства и коэффициенты, CAD-модель изделия, запись в DECISIONS.md, изменение критериев, нагрузки D-GK-10, крыши 15 мм, сечения камеры, окна, Ø главного цилиндра, другие концепции замка]
gates: [G-PFACE, G-DOSE, G-CYCLE]
gate_inputs: {params: design/params.t22d.yaml}
timebox_min: 180
stop_and_ask_if:
  - "ручной расчёт: нет исполнения с Δh ≤ 0,6 мм и FKM ≥ 1,10 при Δ узла ≤ +70 кг"
  - "поворот муфт не совмещается и G-CYCLE > 5,95 с"
  - "FEA: FKM < 1,0 в узле, который нельзя усилить без выхода за +70 кг"
