id: T-1.2
stage: S1-tech
role: TECH
backend: voh            # резерв: alm, bos (запуск строго по одному — песочница Windows)
effort: high
objective: >
  Технологическая геометрия камер и дозирования для схемы D0 при новой кривой уплотнения T-1.1 и решении D-OP-06:
  камера подпрессовки (окно, высота засыпки, ход, сила), главная камера (длина, рабочий участок, положение окна относительно
  пуансона, длина брикета в камере и после выхода), ход главного цилиндра (подвод + засыпка + перебег выталкивания),
  дозирование 0,83 кг при насыпной 90–160 кг/м³ с подачей дозы в окно за ≤ 0,64 с (≥ 14,5 л/с рыхлого материала).
  Итог — кандидат design/params.t12.yaml, который проходит гейты G-PFACE, G-DOSE, G-CYCLE.
inputs:
  - DECISIONS.md                           # D0 (схема), D-OP-06 (C-PROD-03: ≤ 1 ч после выхода; номинал 1,52 МН; расчёт на 300 бар / 1,70 МН)
  - ops/criteria/design_criteria.yaml      # v2: C-PROD-01..03, C-PERF-01, C-RAW-01, C-PFACE-01, C-ENV-01, C-T-01
  - design/params.m1.yaml                  # база M-1 (только читать)
  - design/params.schema.yaml              # схема полей параметров
  - docs/M-1_master_calc.md                # §3 доза/подпрессовка/ходы, §7 риски 3–4, §8 поправки X-1 (ход подпрессовки 257, подача ≥ 14,5 л/с, привязка длины камеры)
  - calc/T-1.1/curve.yaml                  # p(ρ) под нагрузкой {low, base, high}, K, μ, springback
  - calc/T-1.1/results.json                # плотность при 166,7 МПа: под нагрузкой ≈1339, после выхода ≈1057 (base)
  - ops/reports/T-1.1/GK_review.md         # что принято и с какими оговорками
  - calc/X-1/x1_calc.py                    # модель цикла (только читать; для прогона — копия в calc/T-1.2/)
methods:
  - "Плотности и давления брать только из calc/T-1.1/curve.yaml (base, вилка low/high). Новых предположений о материале не вводить; если нужно — пометить допущением с обоснованием."
  - "Главная камера: длина брикета в камере под нагрузкой и после выхода при 166,7 МПа для base/low/high и насыпной 90/160; проверка C-PROD-02 (40–110) и C-PROD-03 (≥ 1000 кг/м³ после выхода, ≤ 1 ч). Как регулируется длина брикета (массой дозы) — диапазон доз для 40 и 110 мм."
  - "Привязка по оси (поправка X-1 №6): эскиз-схема в report.md (ASCII или таблица координат) — торец пуансона в исходном положении, окно подпрессовки 150 мм вдоль оси, канал под окном, рабочий участок до шибера, шибер. Из неё — длина корпуса камеры, ход главного цилиндра = подвод + засыпка + перебег выталкивания (ejection_overtravel_mm), стоп-резерв хода цилиндра. Сравнить с M-1 (230 мм) и X-1 (210 / 310)."
  - "Камера подпрессовки: окно 150 × 200 мм (или обоснованно иное), высота рыхлой засыпки при 90 и 160 кг/м³, ход (без двойного счёта нижней части засыпки — поправка X-1 №1), сила по T-1.1 с вилкой и Janssen-поправкой для канала подпрессовки; Ø цилиндра подпрессовки при ≤ 300 бар с запасом ≥ ×2 по силе (T-1.1: ≈34 кН, закладывать ≥ 70 кН). Проверить, нужна ли ещё Ø100/56."
  - "Дозирование: сравнительное исследование не более 3 вариантов в одной таблице (например: объёмный карман-шибер с весовой коррекцией; накопитель-дозатор над окном с весовыми ячейками и шнековым дозированием в накопитель; дозирование по положению/силе подпрессовки). Критерии: точность массы дозы (цель ±5 %), время сброса дозы ≤ 0,64 с (≥ 14,5 л/с при 90 кг/м³), зависимость от насыпной плотности 90–160, габарит по высоте против C-T-01 (проём 1220 ± 100) и C-ENV-01, сложность. Дать одну рекомендацию; решение записывает ГК. CAD не делать."
  - "Объём накопителя-дозатора и шнека подачи в накопитель: средняя подача 498 кг/ч = 0,138 кг/с → объёмный расход при 90 и 160 кг/м³; производительность шнека с запасом; время на набор дозы в накопитель (весь цикл кроме сброса)."
  - "Кандидат design/params.t12.yaml: копия design/params.m1.yaml с обновлёнными значениями (chamber, precompaction, main_cylinder.stroke_mm, approach_stroke_mm, ejection_overtravel_mm, cycle). Главный цилиндр Ø280/200, p_work и номинал не менять (это T-1.3); 300 бар — проверочный режим резерва, в cycle не закладывать. Циклограмму фаз прессования перестроить по base-кривой T-1.1 так же, как calc/M-1/make_params.py (полосы давления), — генератор положить в calc/T-1.2/make_params_t12.py. Фазы перекрытия и аккумулятор 5 л — как в X-1 (требование к T-1.4), в params описать только то, что позволяет схема."
  - "Прогон цикла копией calc/X-1/x1_calc.py (в calc/T-1.2/) с новыми ходами: перекрытие + аккумулятор 5 л, Q 360 л/мин; base и high кривая; сброс дозы 0,5 и 0,64 с."
deliverables:
  - calc/T-1.2/geometry.py           # расчёт геометрии и ходов, запуск без сети, детерминированно
  - calc/T-1.2/make_params_t12.py    # генератор design/params.t12.yaml
  - calc/T-1.2/x1_calc.py            # копия модели цикла с правками входов (исходник X-1 не менять)
  - calc/T-1.2/results.json
  - design/params.t12.yaml
  - report.md                        # таблица «величина | M-1 | X-1 | T-1.2 base | low | high», ось-схема, таблица вариантов дозирования с рекомендацией, риски
  - metrics.json
  - self_check.json
acceptance:
  - "гейты на design/params.t12.yaml: G-PFACE, G-DOSE, G-CYCLE — PASS (запуск: REV_PYTHON ops/gates/calc_gates.py --params design/params.t12.yaml --criteria ops/criteria/design_criteria.yaml --out <worktree>/gates.t12.json). Если FAIL — не подгонять, объяснить в report.md"
  - "каждое число в report.md прослеживается до curve.yaml/results.json T-1.1, критерия или помечено как допущение"
  - "C-PROD-02 и C-PROD-03 проверены для base/low/high и насыпной 90/160"
  - "ход главного цилиндра и длина камеры выведены из ось-схемы, а не взяты из M-1"
  - "self_check: двойной прогон geometry.py и make_params_t12.py даёт побайтно одинаковые results.json и params.t12.yaml"
allowed_paths: [calc/T-1.2/**, design/params.t12.yaml, report.md, metrics.json, self_check.json, gates.t12.json]
forbidden: [git commit, git push, изменение ops/**, изменение design/params.m1.yaml, design/params.schema.yaml, изменение docs/**, изменение calc/M-1/**, calc/X-1/**, calc/T-1.1/**, сеть, CAD]
gates: [G-PFACE, G-DOSE, G-CYCLE]
gate_inputs: {params: design/params.t12.yaml}
timebox_min: 120
stop_and_ask_if:
  - "длина брикета после выхода при номинале выходит из 40–110 мм при дозе 0,83 кг (base) или ρ после выхода < 1000 кг/м³ (base, насыпная 90–160)"
  - "ход главного цилиндра по ось-схеме > 320 мм или цикл (перекрытие + аккумулятор 5 л, Q 360) > 6,0 с на base-кривой"
  - "ни один вариант дозирования не даёт сброс дозы ≤ 0,64 с при насыпной 90 кг/м³"
  - "нужно поле, которого нет в design/params.schema.yaml — перечисли, схему не меняй"
