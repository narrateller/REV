id: T-1.4
stage: S1-hyd
role: HYD
backend: voh            # резерв: alm, bos (запуск строго по одному — песочница Windows)
effort: high
web_search: true        # каталожные характеристики насосов/аккумуляторов/клапанов (поиск на стороне модели; shell без сети)
objective: >
  Гидропривод и циклограмма, дающие цикл ≤ 6,0 с (C-PERF-01) на номинальной дозе 0,83 кг при главном приводе ≤ 30 кВт
  (C-PWR-01) и давлении ≤ 300 бар (C-HYD-01), для геометрии D-GK-01 (засовы башмака, перебег 59 мм, главный ход 264/289).
  Сейчас: 6,77 / 6,91 с (подача дозы 0,50 / 0,64 с) при 360 л/мин и аккумуляторе 5 л. Насос, аккумулятор, логика перекрытий,
  бак и охладитель; итоговый design/params.t14.yaml с перекрытием фаз (G-CYCLE с группами, T-0.3b).
inputs:
  - DECISIONS.md                           # D0, D-OP-06 (номинал 1,52 МН; цилиндр/рама на 300 бар = резерв 1,70 МН), D-GK-01
  - ops/criteria/design_criteria.yaml      # v2: C-PERF-01, C-PWR-01, C-HYD-01, C-PFACE-01
  - design/params.t12b.yaml                # база геометрии и фаз (только читать)
  - calc/T-1.2b/x1_calc.py, calc/T-1.2b/results.json, calc/T-1.2b/make_params_t12b.py   # эталонная модель цикла и правила полос давления
  - ops/reports/T-1.2b/GK_review.md        # бюджет фаз, рычаги
  - ops/reports/T-1.2/GK_review.md
  - ops/calibration/t12b_overlap.params.yaml, ops/calibration/t12b_overlap_feed064.params.yaml   # пример описания цикла с группами
  - ops/reports/T-0.3b/report.md           # раздел «Как описывать циклограмму для T-1.4»
  - ops/reports/T-0.3b/GK_review.md        # ПРАВИЛА ПРИМЕНЕНИЯ гейта и точность ±0,15 с — обязательны
  - calc/T-1.1/curve.yaml                  # p(ρ) base/high
methods:
  - "Рычаги — сначала дешёвые, по одному, с вкладом каждого (таблица «рычаг | Δt, с | цена/риск»): (1) парковка подпрессовки по дозе (257 мм для 0,83 кг при 90 кг/м³; ход цилиндра 380 оставить); (2) раннее отпирание засовов и подъём подпрессовки по положению хвоста брикета (x = 205 мм), а не после конца выталкивания; (3) мёртвые времена клапанов: обосновать по типу клапанов (пропорциональные/картриджные 2/2 с пилотом; 0,1 → 0,05 с только с каталожным временем срабатывания); (4) выдержка 0,30 и сброс 0,25 с — обосновать или сократить (декомпрессия объёма Ø280 при 270 бар через дроссель, сжимаемость масла); (5) аккумулятор: объём, предзаряд, окно давлений, что питает (pre_up, возврат, шибер, регенерация); (6) скорость шибера; (7) только потом — насос больше 360 л/мин."
  - "Насос и привод: схема регулирования (регулятор мощности / hi-lo двухпоточный / два насоса) с характеристикой Q(p) реального типоразмера из каталога (url + страница/таблица; читать только прочитанное), КПД объёмный и механический по каталогу при рабочих давлениях, холостые потери. Мотор 30 кВт, 1480 об/мин. Номинал 270 бар и резервный режим 300 бар (D-OP-06) должны быть достижимы."
  - "Эталон цикла: копия calc/T-1.2b/x1_calc.py в calc/T-1.4/ (исходник не менять), правки — только входы и логика перекрытий, каждая правка описана. Шаг ≤ 2,5 мс с проверкой сходимости. Случаи: base и high, насыпная 90 и 160, подача дозы 0,50 и 0,64 с, доза 0,83 и 1,068 кг (110 мм: только производительность ≥ 498 кг/ч, не 6 с). Режим резерва 300 бар: цикл и мощность."
  - "Кандидат design/params.t14.yaml с группами (генератор calc/T-1.4/make_params_t14.py, полосы давления по правилам make_params_t12b.py). Соблюдать правила ops/reports/T-0.3b/GK_review.md: фаза press, выдержка/сброс после прессования и подача дозы — НЕ в общей группе с движением другого привода; порядок фаз в группе = приоритет гидросхемы; start_delay_s пересчитан для принятых подачи и скоростей."
  - "Энергия и тепло: работа на валу за цикл и средняя мощность; потери в тепло (дросселирование, сброс, КПД) → тепловая мощность; бак (≥ 3–5 × подача в минуту или обоснованно меньше с охладителем), охладитель масло-воздух: мощность при +40 °C окружающей и масле ≤ 55 °C. Установленная мощность ≤ 34,2 кВт (C-PWR-01) с разбивкой."
  - "Итог: одна рекомендованная конфигурация привода + требования к гидросхеме T-1.5 (какие клапаны, логика блокировок фаз по датчикам, приоритеты потоков)."
deliverables:
  - calc/T-1.4/x1_calc.py
  - calc/T-1.4/make_params_t14.py
  - calc/T-1.4/drive.py             # насос, аккумулятор, тепло, бак
  - calc/T-1.4/sources.yaml         # каталожные данные: изготовитель, серия, типоразмер, url, где прочитано, значения
  - calc/T-1.4/results.json
  - design/params.t14.yaml
  - report.md                       # таблица рычагов, конфигурация привода, циклограмма (таблица времён по фазам: эталон | гейт), тепло, требования к T-1.5
  - metrics.json
  - self_check.json
  - gates.t14.json
acceptance:
  - "эталон (calc/T-1.4/x1_calc.py): цикл base ≤ 6,0 с при подаче дозы 0,64 с, 90 и 160 кг/м³; если запас < 0,3 с — указать это явно; high — показать"
  - "гейты на design/params.t14.yaml: G-PFACE, G-DOSE, G-CYCLE — PASS (запуск: REV_PYTHON ops/gates/calc_gates.py --params design/params.t14.yaml --criteria ops/criteria/design_criteria.yaml --out <worktree>/gates.t14.json); |G-CYCLE − эталон| ≤ 0,15 с, иначе объяснить по фазам"
  - "каждая каталожная величина прослеживается до sources.yaml (url, где прочитано); не из памяти"
  - "пик мощности на валу ≤ 30 кВт по характеристике реального насоса, не по идеальной гиперболе"
  - "self_check: двойной прогон даёт побайтно одинаковые results.json и params.t14.yaml"
allowed_paths: [calc/T-1.4/**, design/params.t14.yaml, report.md, metrics.json, self_check.json, gates.t14.json]
forbidden: [git commit, git push, изменение ops/**, изменение design/params.m1.yaml/t12.yaml/t12b.yaml/schema, изменение docs/**, изменение calc/M-1/**, calc/X-1/**, calc/T-1.1/**, calc/T-1.2/**, calc/T-1.2b/**, сеть из shell, выдуманные каталожные данные]
gates: [G-PFACE, G-DOSE, G-CYCLE]
gate_inputs: {params: design/params.t14.yaml}
timebox_min: 150
stop_and_ask_if:
  - "ни одна конфигурация при 30 кВт не даёт эталонный цикл base ≤ 6,0 с при подаче дозы 0,64 с — покажи лучшую, остаток и что потребовалось бы (мощность, геометрия)"
  - "реальный насос нужного типа не найден в каталогах с читаемой характеристикой"
  - "нужно поле, которого нет в design/params.schema.yaml — перечисли, схему не меняй"
