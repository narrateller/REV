id: T-2.2g
stage: S2-str
role: TECH
backend: bos            # alm — лимит до 27.11 15:12, voh — до 01.12; запуск строго по одному
effort: high
web_search: true        # аналоги RUF/WEIMA (матрица с неподвижной крышей), FKM, контакт кассет
objective: >
  Квалификация силовой части схемы A по D-GK-12 / D-OP-16: окончательное сжатие под неподвижной закрытой крышей X = 90 мм,
  башмак подпрессовки только подпрессовывает (162,8 / 171,0 кН при 300 / 315 бар), перенос дозы 35,25 кН.
  Камера с крышей (боковины, крыша, днище, торцевая кассета, сопряжение с шибером и траверсой) и облегчённый замок башмака:
  C-STR-01 ≥ 1,5 (315 бар), C-FAT-01 ≥ 1,0 (0 → 300 бар, 10⁷) по FEA со сходимостью < 5 %; контакт ≤ экрана с источником;
  Δh (раскрытие камеры по высоте брикета под крышей и под башмаком) ≤ 0,6 мм при 300 бар; Δ узла против строки камеры 180,22 кг — минимальна
  (ориентир ≤ +30 кг; гидравлика T-2.6 +76,2 кг считается отдельно).
inputs:
  - DECISIONS.md                           # D-GK-11, D-GK-12, D-GK-13, D-OP-10, D-OP-14, D-OP-15, D-OP-16
  - ops/criteria/design_criteria.yaml      # v4
  - ops/reports/T-2.2f/ (GK_review.md, report.md), calc/T-2.2f/   # схема A: ручной расчёт, нагрузки, перенос дозы, проверка Opus (стенка 64 мм или кованый блок) (только читать; копия в calc/T-2.2g/)
  - ops/reports/T-2.6/GK_review.md, calc/T-2.6/params/params.t26a.yaml, calc/T-2.6/results.json   # ход 396 / рабочий 371, перебег, цикл, гидравлика (только читать)
  - ops/reports/T-2.2e/GK_review.md, calc/T-2.2e/fea/   # методика C3D10 и уроки (shear lag, присоединения, перекос) (только читать)
  - design/frame.t17d.yaml, design/slide_gate.t17d.yaml, design/cylinders.t17d.yaml, design/main_cylinder_rear.t22.yaml, design/prepress_lock.t22d.yaml
methods:
  - "Нагрузка: Janssen как T-2.2d (огибающая K 0,35–0,60 × μ 0,20–0,30, длина ≤ 89,4 мм, блокировка дозы 0,853 кг) — распределение бокового давления по крыше, боковинам и днищу под крышей; доля на башмак (≤ 163 кН при 300 бар) и перенос дозы; перекос по x."
  - "Конструкция: материал крыши/боковин — сравнить литьё (jG 1,25) со стенкой ≥ 64 мм и кованый блок крыши 34CrNiMo6+QT (jG 1,0); галтели R ≥ 15, стыки без сварки в силовом пути; сопряжение с шибером (сдвиг плоскости +90 мм), траверсой и колоннами; ширина корпуса и габарит шибера; облегчённый замок башмака под 171 кН (засов/кулачок D-GK-01 или иное — ручной отбор)."
  - "Ручной расчёт до FEA: номинальный размах в поясах и мембранное растяжение боковин против допускаемого FKM, нижняя граница Δh замкнутой формулой и с присоединениями (уроки D-GK-11)."
  - "FEA (gmsh + ccx из E:\\Tools\\FreeCAD-1.1\\bin) выбранного исполнения: C3D10, ступени 0 → 100 → 200 → 300 → 315 бар, давление по Janssen на стенки, реальные присоединения к траверсе/колоннам, галтели; сходимость < 5 % на трёх сетках в управляющих точках вне сингулярных кромок; толщина стенки ≥ 2 элементов; баланс ≤ 0,1 %; ручной против FEA в 2–3 сечениях ±15 %. Контакт кассеты/замка — экран и средние по полосам; локальная контактная FEA только если ручной контакт > 0,8 экрана."
  - "Масса машины: 4942,65 − 180,22 + узел + Δрама/колонны/цилиндры от хода 396 (из T-2.2f/T-2.6) + гидравлика T-2.6 +76,2 кг + H2 (+5…18 кг) — построчно с источниками; требуемое облегчение станции (≤ ≈ 145 кг по D-OP-16)."
  - "Итог: design/chamber_roof.t22g.yaml (полный, самодостаточный: нагрузки, геометрия, материалы, интерфейсы, замок башмака), таблица «деталь | статика | FKM | контакт | Δh | Δмасса | источник», проект D-GK в report.md (ГК вносит сам)."
deliverables:
  - calc/T-2.2g/                           # loads.py, hand.py, fea/ (без сеток > 1 МБ), mass.py, sources.yaml, results.json; ≤ 5 МБ
  - design/chamber_roof.t22g.yaml
  - report.md
  - metrics.json
  - self_check.json
  - gates.t22g.json
acceptance:
  - "C-STR-01 ≥ 1,5 и C-FAT-01 ≥ 1,0 по FEA со сходимостью < 5 %; контакт ≤ экрана с источником"
  - "Δh ≤ 0,6 мм при 300 бар с перекосом (FEA); габарит шибера и замка совместим (размерами)"
  - "масса машины построчно с источниками; требуемое облегчение станции"
  - "гейты G-PFACE, G-DOSE PASS (REV_PYTHON ops/gates/calc_gates.py --params calc/T-2.6/params/params.t26a.yaml --criteria ops/criteria/design_criteria.yaml --out <worktree>/gates.t22g.json); G-CYCLE в этом файле — справочно (по D-GK-13/D-OP-16 цикл схемы A оценивается эталонной моделью T-2.6, номинал 5,904 с; методика эквивалента — отдельная задача)"
  - "свойства и коэффициенты — sources.yaml с url; self_check: двойной прогон даёт одинаковые results.json и design/chamber_roof.t22g.yaml (FEA — допуск 1e-6); report.md пишется из Python в UTF-8 (не через конвейер PowerShell) и проверяется чтением на отсутствие «?»; временные каталоги удалить"
allowed_paths: [calc/T-2.2g/**, design/chamber_roof.t22g.yaml, report.md, metrics.json, self_check.json, gates.t22g.json]
forbidden: [git commit, git push, изменение ops/**, изменение существующих design/*.yaml и design/hydraulics/**, изменение docs/**, изменение calc/** кроме calc/T-2.2g/**, сеть из shell, выдуманные свойства и коэффициенты, CAD-модель изделия, запись в DECISIONS.md, изменение критериев, сечения камеры 150 × 60, окна 150 × 200, Ø главного цилиндра, хода 396 мм и длины крыши 90 мм, гидравлики T-2.6]
gates: [G-PFACE, G-DOSE]
gate_inputs: {params: calc/T-2.6/params/params.t26a.yaml}
timebox_min: 180
stop_and_ask_if:
  - "ручной расчёт: нет исполнения с FKM ≥ 1,10 и Δh ≤ 0,6 мм при Δ узла ≤ +60 кг"
  - "FEA: FKM < 1,0 или Δh > 0,6 мм, которые нельзя исправить в пределах +60 кг"
  - "габарит шибера или замка несовместим с крышей 90 мм без изменения хода"
