id: T-2.2b
stage: S2-str
role: TECH
backend: alm            # voh — лимит до 01.12 (запуск строго по одному — песочница Windows)
effort: high
web_search: true        # контактная прочность, FKM, крепёж стяжек, свойства сталей (поиск на стороне модели; shell без сети)
objective: >
  Поперечный силовой путь камеры по D-GK-07: башмак подпрессовки держат два засова против бокового давления брикета
  (1,224 МН при 300 бар на верхней дозе, 1,285 МН при 315; 771 кН на нагруженный засов статически). Открытый «крюк» стенки
  корпуса за отведённым засовом не проходит (T-2.2 круг 1, проверка Opus). Одно сравнительное исследование замкнутого контура:
  (а) закрытые карманы засовов в замкнутых стенках корпуса; (б) стяжки/ярмо по торцам x вне окна загрузки 5–205 мм.
  Выбрать одно исполнение с C-STR-01 ≥ 1,5 (315 бар), C-FAT-01 ≥ 1,0 (0 → 300 бар, 10⁷), контактом ≤ экрана смятия,
  прогибом башмака в допуске брикета, при массе машины ≤ 5000 кг (D-OP-10) и без изменения хода кулачка 12 мм, хода засова 36 мм,
  штока подпрессовки Ø125/56, сечения 150 × 60 и баз направляющих модуля камеры T-1.7.
inputs:
  - DECISIONS.md                           # D-GK-01, D-GK-05, D-GK-07, D-OP-10, D1
  - ops/criteria/design_criteria.yaml      # v4: C-STR-01, C-FAT-01, C-PROD-01, C-MASS-01
  - ops/reports/T-2.2/                     # круг 1 (C): нагрузки, профиль, модель контакта, причины отказа; GK_review.md (только читать)
  - calc/T-2.2/lateral_fea/, calc/T-2.2/results.json, design/chamber_lateral.t22.yaml   # исходная модель (только читать; копия в calc/T-2.2b/)
  - ops/reports/T-1.2b/report.md, calc/T-1.2b/   # засовы, башмак, кулачок
  - design/frame.t17d.yaml, ops/reports/T-1.7/GK_review.md, calc/T-1.7/   # модуль камеры, методика FEA/FKM
  - calc/T-1.1/curve.yaml                   # p(ρ), боковое давление
methods:
  - "Нагрузки — как в T-2.2 круг 1 (профиль T-1.2b, центр x 141,3 мм, распределение 60/40 и худший случай 64/36 из подмодели), без пересмотра; масштаб 315/300 для статики."
  - "Варианты (а) и (б) — каждый одной строкой «геометрия | статика | ресурс | контакт | прогиб башмака | Δмасса | ход засова/кулачка | риск изготовления и сборки». Для (б): усилие стяжек из равновесия (ориентир ГК ≈ 365 кН на сторону при плече 150 мм — проверить), преднатяг и раскрытие стыка по VDI 2230, усталость резьбы; для (а): перемычки над/под карманом, галтели, обработка кармана."
  - "Ручной расчёт (балки/рамы/Roark) до FEA для обоих вариантов — выбор по ручному расчёту, FEA только для выбранного."
  - "FEA выбранного (gmsh + ccx из E:\\Tools\\FreeCAD-1.1\\bin, методика T-1.7/T-2.2): засов, башмак, корпус, стяжки (если есть), контакт μ 0,15; кромки контакта R ≥ 5 мм и бочкообразность 0,1–0,2 мм, галтель полка–стенка R ≥ 15 мм; только кинематически допустимая геометрия (засов отводится на 36 мм с зазором ≥ 1 мм); пики оценивать вне сингулярных кромок; сходимость < 5 % на трёх последовательных сетках в управляющих точках; реакции и баланс сил ≤ 0,1 %."
  - "FKM как в T-1.7 (k_D 15, n_σ по градиенту, M_σ, j 1,5; j_G 1,0 поковка/прокат, 1,25 литьё). Смятие — экран с источником."
  - "Прогиб башмака и раскрытие корпуса при 300 бар против допуска брикета C-PROD-01 150 × 60 ± 1 (вклад в размер, а не только перемещение)."
  - "Масса: от базы T-2.2 (итог круга 2) с явным резервом; если резерва не хватает — показать, сколько, и остановиться (облегчение станции — отдельная задача по D-OP-10)."
  - "Итог: design/chamber_lateral.t22b.yaml (полный, самодостаточный; статус выбранного), таблица вариантов, проект уточнения D-GK-07 (выбранный вариант) в report.md — ГК вносит сам."
deliverables:
  - calc/T-2.2b/                           # hand.py, fea/ (входы, .geo, сводки .json; без сеток > 1 МБ), mass.py, sources.yaml, results.json; ≤ 5 МБ
  - design/chamber_lateral.t22b.yaml
  - report.md
  - metrics.json
  - self_check.json
  - gates.t22b.json
acceptance:
  - "выбранное исполнение: C-STR-01 ≥ 1,5 и C-FAT-01 ≥ 1,0 по FEA со сходимостью < 5 % на трёх сетках; контакт ≤ экрана смятия; стяжки (если есть) — VDI 2230 полностью"
  - "ручной расчёт и FEA выбранного согласуются по номинальным напряжениям в 2–3 сечениях в пределах 15 % или расхождение объяснено"
  - "ход засова 36 мм, кулачка 12 мм, шток подпрессовки, сечение 150 × 60, базы направляющих — без изменений; влияние на размер брикета показано"
  - "масса машины ≤ 5000 кг номинал с источниками строк"
  - "гейты G-PFACE, G-DOSE, G-CYCLE PASS (REV_PYTHON ops/gates/calc_gates.py --params design/params.t21.yaml --criteria ops/criteria/design_criteria.yaml --out <worktree>/gates.t22b.json)"
  - "свойства, пределы смятия, коэффициенты — sources.yaml с url и местом чтения; self_check: двойной прогон даёт одинаковые results.json и design/chamber_lateral.t22b.yaml (FEA — допуск 1e-6); временные каталоги удалить; все файлы читаются обычным пользователем"
allowed_paths: [calc/T-2.2b/**, design/chamber_lateral.t22b.yaml, report.md, metrics.json, self_check.json, gates.t22b.json]
forbidden: [git commit, git push, изменение ops/**, изменение существующих design/*.yaml и design/hydraulics/**, изменение docs/**, изменение calc/** кроме calc/T-2.2b/**, сеть из shell, выдуманные свойства и коэффициенты, CAD-модель изделия, запись в DECISIONS.md, изменение Ø и ходов цилиндров, хода засова и кулачка, сечения камеры, параллельная проработка двух исполнений после выбора]
gates: [G-PFACE, G-DOSE, G-CYCLE]
gate_inputs: {params: design/params.t21.yaml}
timebox_min: 180
stop_and_ask_if:
  - "ни (а), ни (б) не проходят C-FAT-01 ≥ 1,0 без изменения хода засова/кулачка или сечения камеры"
  - "масса машины > 5000 кг номинал при выбранном исполнении"
  - "выбранное исполнение меняет габарит модуля камеры так, что задевает раму T-1.7 (колонны, траверсы) или подачу"
