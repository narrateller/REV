id: T-2.6
stage: S2-hyd
role: HYD
backend: alm            # bos/voh — резерв (CLAUDE.md §3); запуск строго по одному
effort: high
web_search: true        # ГА быстрого возврата, клапаны наполнения (prefill), регенерация, A4VSO DFE1
objective: >
  По D-OP-15 и D-GK-12: (1) уточнить гидравлический эквивалент G-CYCLE (design/params.*.yaml) так, чтобы он оставался консервативным,
  но не завышал цикл артефактами v1 (ГА снимается со всей фазы при смешанном давлении; добавочный ход на насосных скоростях);
  (2) найти для схемы A (окончательное сжатие под неподвижной крышей X ≈ 90 мм) цикл ≤ 5,95 с по G-CYCLE и ≤ 5,90 с по эталону
  при C-PWR-01 (мотор 30 кВт, RMS ≤ 30, пик ≤ 40, установленная ≤ 34,2 кВт) мерами гидравлики: ГА быстрого возврата / подвода,
  клапан наполнения, регенерация, перераспределение фаз.
inputs:
  - DECISIONS.md                           # D-OP-07, D-OP-10, D-GK-10, D-GK-12, D-OP-14, D-OP-15
  - ops/criteria/design_criteria.yaml      # v4: C-PERF-01, C-PWR-01, C-HYD-01
  - ops/gates/calc_gates.py                # только читать: как G-CYCLE считает фазы
  - design/params.t22d.yaml, calc/T-2.2d/cycle/, calc/T-2.1/cycle/   # действующий эквивалент и эталонная модель A4VSO (копии в calc/T-2.6/)
  - ops/reports/T-2.2f/ (GK_review.md, report.md), calc/T-2.2f/cycle/   # схема A, цикл, проверка Opus (только читать)
  - design/hydraulics/                     # только читать
methods:
  - "Эквивалент. Разбить фазы params по диапазонам давления, чтобы подача ГА учитывалась только там, где она есть в эталонной модели; добавочный ход — на фактических скоростях эталона (быстрый ход ограничен скоростью, а не насосом). Генератор params — копией calc/T-2.2d/run.py в calc/T-2.6/. Требование консервативности: для T-2.2d время каждой фазы эквивалента ≥ времени той же фазы эталона, итог G-CYCLE − эталон в пределах 0…0,10 с (сейчас +0,305 с). Таблица фаз «эталон | v1 | новый эквивалент». Пересчитанный T-2.2d — design/params.t26_base.yaml."
  - "Схема A. Ход и перебег +75 мм против T-2.2d (X 90 вместо 15), сила переноса дозы под крышей и трение — из calc/T-2.2f; нагрузка башмака ≤ 163 кН. Меры: (а) ГА быстрого возврата/подвода главного цилиндра среднего давления с клапаном наполнения (объём, уставки, подзаряд в простоях — с балансом энергии и временем подзаряда НД-ГА); (б) регенерация; (в) совмещение начала подачи с хвостом возврата — только как информационная строка, в итог не включать. Для каждой меры: эталонный цикл, G-CYCLE на новом эквиваленте, RMS/пик/энергия цикла, ∫P²dt, давление и расход клапанов с источником, масса добавленной гидравлики."
  - "Итог: лучшая комбинация — design/params.t26a.yaml; список изменений гидросхемы (клапаны, ГА, датчики, блокировки) — для отдельной задачи, файлы гидросхемы не менять; масса гидравлики в ведомость."
deliverables:
  - calc/T-2.6/                            # run.py, cycle/, energy.py, sources.yaml, results.json; ≤ 5 МБ
  - design/params.t26_base.yaml
  - design/params.t26a.yaml
  - report.md
  - metrics.json
  - self_check.json
  - gates.t26.json
acceptance:
  - "новый эквивалент консервативен: для T-2.2d каждая фаза ≥ эталона, G-CYCLE − эталон ∈ [0; 0,10] с; объяснение каждого изменения против v1"
  - "схема A: G-CYCLE ≤ 5,95 с на params.t26a.yaml и эталон ≤ 5,90 с; RMS ≤ 30 кВт, пик ≤ 40 кВт с запасом указанным явно"
  - "гейты G-PFACE, G-DOSE, G-CYCLE на params.t26_base.yaml и params.t26a.yaml (REV_PYTHON ops/gates/calc_gates.py --params <файл> --criteria ops/criteria/design_criteria.yaml --out <worktree>/gates.t26.json, второй — gates.t26a.json внутри calc/T-2.6/)"
  - "свойства и коэффициенты — sources.yaml с url; self_check: двойной прогон даёт одинаковые results.json и design/params.t26*.yaml; report.md в UTF-8, проверен чтением; временные каталоги удалить"
allowed_paths: [calc/T-2.6/**, design/params.t26_base.yaml, design/params.t26a.yaml, report.md, metrics.json, self_check.json, gates.t26.json]
forbidden: [git commit, git push, изменение ops/** (в т. ч. гейтов и критериев), изменение существующих design/*.yaml и design/hydraulics/**, изменение docs/**, изменение calc/** кроме calc/T-2.6/**, сеть из shell, выдуманные свойства и коэффициенты, мотор > 30 кВт, установленная > 34,2 кВт, насос другого типоразмера, изменение Ø главного цилиндра, сечения камеры, окна]
gates: [G-PFACE, G-DOSE, G-CYCLE]
gate_inputs: {params: design/params.t26a.yaml}
timebox_min: 180
stop_and_ask_if:
  - "консервативный эквивалент невозможен без изменения ops/gates/calc_gates.py (описать, что именно мешает)"
  - "схема A: ни одна комбинация мер не даёт G-CYCLE ≤ 5,95 с и эталон ≤ 5,90 с при RMS ≤ 30 кВт — дать лучший достижимый цикл и производительность, кг/ч"
