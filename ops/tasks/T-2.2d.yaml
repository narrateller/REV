id: T-2.2d
stage: S2-str
role: TECH
backend: alm            # voh — лимит до 01.12; резерв bos (разрешение оператора 26.11); запуск строго по одному
effort: high
web_search: true        # боковое давление древесного сырья, контакт закалённых пар, FKM, VDI 2230
objective: >
  По D-GK-09: (1) переопределить проектную нагрузку башмака подпрессовки при дозе, ограниченной длиной брикета;
  (2) выбрать длину короткой закрытой крыши X 10–25 мм перед шибером (ход и перебег +X) по G-CYCLE ≤ 5,95 с;
  (3) квалифицировать облегчённый байонет (4 стойки или иное число — по расчёту) с передней опорой вне огибающей шибера:
  C-STR-01 ≥ 1,5 (315 бар), C-FAT-01 ≥ 1,0 (0 → 300 бар, 10⁷; цель ≥ 1,1), контакт ≤ экрана с источником,
  вклад в высоту брикета ≤ 0,5 мм при 300 бар, Δ узла ≤ +40 кг против строки камеры 180,22 кг (ориентир), машина ≤ 5000 кг.
inputs:
  - DECISIONS.md                           # D-GK-01, D-GK-05, D-GK-06, D-GK-09, D-OP-10, D-OP-13, D1
  - ops/criteria/design_criteria.yaml      # v4: C-STR-01, C-FAT-01, C-PROD-01/02, C-MASS-01
  - ops/reports/T-2.2c/ (GK_review.md, report.md, metrics.json), calc/T-2.2c/   # байонет, кандидаты, оценки цикла (только читать; копия в calc/T-2.2d/)
  - ops/reports/T-2.2b/, calc/T-2.2b/fea/  # методика контактной FEA до 315 бар (только читать)
  - ops/reports/T-1.2b/report.md, calc/T-1.2b/, calc/T-1.1/   # Janssen, K, μ, доза, упругое восстановление (только читать)
  - calc/T-2.1/cycle/, design/params.t21.yaml   # эталон цикла A4VSO и эквивалент гейта (копия в calc/T-2.2d/cycle)
  - design/frame.t17d.yaml, design/slide_gate.t17d.yaml, design/cylinders.t17d.yaml, ops/reports/T-2.2/GK_review.md   # рама, шибер, ГЦ (крышка 144 мм по D-GK-08)
methods:
  - "Нагрузка: Janssen как T-1.2b, сила на торце 1,70 МН (300 бар) и 1,785 (315); доза — максимальная, при которой длина брикета после выхода ≤ 110 мм (C-PROD-02) с упругим восстановлением T-1.2b, для каждой пары K × μ сетки {0,35; 0,45; 0,60} × {0,20; 0,25; 0,30}; сила на башмак — интеграл по участку брикета под окном (с учётом крыши X). Огибающая по сетке = проектная. Отдельно: номинал 1,52 МН (для информации, критерии не менять). Проверка вторым методом (глобальный баланс сил, как в проверке Opus)."
  - "Блокировка дозы: требование к управлению (как ограничивается масса дозы, допуск дозирования) — строкой в report.md; файлы гидросхемы не менять."
  - "X: для X = 10, 15, 20, 25 мм — сила на башмак (огибающая), прибавка хода/перебега, цикл по копии calc/T-2.1/cycle (реальная характеристика A4VSO DFE1Z, не оценка), G-CYCLE; выбрать наибольший X с G-CYCLE ≤ 5,95 с и эталоном ≤ 5,90 с. Сдвиг шибера +X: длина рамы/колонн, масса, сила проталкивания и срез у кромки окна (вариант B T-1.2b). design/params.t22d.yaml генератором копии (как params.t21)."
  - "Байонет: ручной расчёт облегчённого исполнения при выбранной нагрузке (стойки, пяты, днище, зубчатые муфты: равномерность нагрузки зубьев, контакт закалённых пар с источником, синхронизация поворота, сила отпирания); передняя опора — вне огибающей шибера (размерами); чувствительность массы. Если ручной расчёт даёт FKM < 1,1 или Δh > 0,5 мм — остановиться."
  - "FEA выбранного байонета (gmsh + ccx из E:\\Tools\\FreeCAD-1.1\\bin) по методике T-2.2b круг 2: ступени 0 → 100 → 200 → 300 → 315 бар, TIE только для нераскрывающихся по замыслу стыков (ручная проверка нераскрытия), фрикционный контакт μ 0,15 по рабочим парам, R ≥ 5, бочкообразность; сходимость < 5 % на трёх сетках в управляющих точках вне сингулярных кромок; баланс ≤ 0,1 %; ручной расчёт против FEA в 2–3 сечениях ±15 %. Если контакт не сходится — подмодель зубьев с перемещениями линейной модели узла. Крепёж (если есть) — VDI 2230 полностью, с эксцентриситетом."
  - "FKM как в T-1.7. Масса машины: 4942,65 − 180,22 + байонет + Δрама/шибер от X; строка H2 T-2.2 (+5…18 кг) отдельно; требуемое облегчение гидростанции (D-OP-10), если > 5000."
  - "Итог: design/prepress_lock.t22d.yaml (полный, самодостаточный: нагрузка, X, байонет, привод, интерфейсы), design/params.t22d.yaml, таблица «деталь | статика | ресурс | контакт | Δh | Δмасса | источник», проект D-GK (замок башмака, X, нагрузка) в report.md — ГК вносит сам."
deliverables:
  - calc/T-2.2d/                           # load.py, cycle/, hand.py, fea/ (без сеток > 1 МБ), mass.py, sources.yaml, results.json; ≤ 5 МБ
  - design/prepress_lock.t22d.yaml
  - design/params.t22d.yaml
  - report.md
  - metrics.json
  - self_check.json
  - gates.t22d.json
acceptance:
  - "нагрузка: огибающая K × μ при ограниченной длине, проверена вторым методом; доза и блокировка описаны"
  - "X выбран; эталон цикла ≤ 5,90 с, G-CYCLE ≤ 5,95 с"
  - "байонет: C-STR-01 ≥ 1,5 и C-FAT-01 ≥ 1,0 по FEA со сходимостью < 5 % на трёх сетках; контакт ≤ экрана; Δh ≤ 0,5 мм; передняя опора вне огибающей шибера"
  - "масса машины с источниками строк; требуемое облегчение станции указано"
  - "гейты G-PFACE, G-DOSE, G-CYCLE PASS (REV_PYTHON ops/gates/calc_gates.py --params design/params.t22d.yaml --criteria ops/criteria/design_criteria.yaml --out <worktree>/gates.t22d.json)"
  - "свойства и коэффициенты — sources.yaml с url; self_check: двойной прогон даёт одинаковые results.json и design/*.t22d.yaml (FEA — допуск 1e-6); временные каталоги удалить; все файлы читаются обычным пользователем; не перезаписывать файлы, которые песочница не даёт изменить, — сообщить в self_check"
allowed_paths: [calc/T-2.2d/**, design/prepress_lock.t22d.yaml, design/params.t22d.yaml, report.md, metrics.json, self_check.json, gates.t22d.json]
forbidden: [git commit, git push, изменение ops/**, изменение существующих design/*.yaml и design/hydraulics/**, изменение docs/**, изменение calc/** кроме calc/T-2.2d/**, сеть из shell, выдуманные свойства и коэффициенты, CAD-модель изделия, запись в DECISIONS.md, изменение критериев, сечения камеры, окна 150 × 200, Ø главного цилиндра, другие концепции замка кроме байонета]
gates: [G-PFACE, G-DOSE, G-CYCLE]
gate_inputs: {params: design/params.t21.yaml}
timebox_min: 180
stop_and_ask_if:
  - "огибающая нагрузки при ограниченной длине > 1,15 МН при 300 бар без крыши (т. е. вывод проверки не подтверждается)"
  - "ни один X ≤ 25 мм не даёт G-CYCLE ≤ 5,95 с"
  - "ручной расчёт байонета: FKM < 1,1 или Δh > 0,5 мм при Δ узла ≤ +60 кг"
