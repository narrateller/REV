id: T-2.5c
stage: S2-hyd
role: HYD
backend: bos            # alm/voh — по наличию лимита; запуск строго по одному
effort: high
web_search: true        # паспорта/листы данных: моторы 30 кВт S1 IE3+ в алюминиевом корпусе IM B5; предохранительные клапаны (Goetze, LESER, Herose и др.); картриджи DB с внешним дренажем (Sun, Rexroth, Parker, HydraForce); полости/блоки; нормы на тонкостенные баки
objective: >
  Квалификация по паспортам условных мер облегчения гидростанции T-2.5 (D-OP-21) и пересчёт массы машины схемы A.
  Функция гидравлики T-2.6 и охлаждение T-2.5b (Bowman GL180-1428-3, D-GK-20) не меняются.
  База: станция T-2.5b — 1686,19 кг (design/hydraulics/station.t25b.yaml, mass_kg = 1686.1873123970388); машина схемы A
  5158,90 / 5167,80 / 5202,25 кг (ops/reports/T-2.5b/metrics.json, machine_A_variants; приёмка по верхней границе).
  Условные меры (потенциал по T-2.5b, measures): мотор Al B5 −70…−71, TF −19,06, шесть DB30 → картриджи −11,88, стенки бака 3 мм −8,92,
  бак как основание −7,96; сумма −118,82 → ориентир 5040,1…5083,4 кг. Предел 5000 кг не меняется (D-OP-21); итог > 5000 — ожидаемый исход,
  остаток закрывается испытанием сырья (D-OP-19). Каждая мера зачитывается только с источником (паспорт/лист данных/каталог с url) точного
  исполнения; без источника — 0 кг с причиной. Итог — ведомость станции T-2.5c построчно, перечень мер «зачтено / не зачтено» с источниками
  и Δм, масса машины схемы A по трём вариантам, недостающие килограммы до 5000.
inputs:
  - DECISIONS.md                           # D-OP-11, D-OP-19, D-OP-20, D-OP-21, D-GK-02, D-GK-18, D-GK-19, D-GK-20
  - ops/criteria/design_criteria.yaml      # v4: C-MASS-01, C-PWR-01, C-PERF-01, C-HYD-01, C-ENV-01
  - design/hydraulics/station.t25b.yaml, calc/T-2.5b/ (results.json, mass.py, measures.py, sources.yaml), ops/reports/T-2.5b/GK_review.md, ops/reports/T-2.5b/metrics.json, ops/reports/T-2.5b/gates.GK.weg1475.json   # база (только читать)
  - calc/T-2.5/ (measures.py, sources.yaml, results.json measures/tank), ops/reports/T-2.5/GK_review.md   # исходные условные меры (только читать)
  - calc/T-2.6/params/params.t26a.yaml (раздел cycle_model.pump), ops/gates/cycle_model/ (qualification.py — границы, только читать), ops/reports/T-0.4/GK_review.md   # G-CYCLE на эталонной модели: A 5,905 с, RMS 29,987 кВт
  - design/hydraulics/T-1.6_circuit.yaml, design/hydraulics/T-1.6_interlocks.yaml, calc/T-2.6/inventory.csv   # схема: TF и его предохранитель, DB (RGA/RGB/RRA/RRB/RV0/RVM, дренаж DR), PC/CB (только читать)
methods:
  - "Мотор (строка T25-M1, OMEC OMT3-IE3-200L-4 B5, 278 кг): 30 кВт S1, IE3 или выше, 400 В 50 Гц, 4 полюса, алюминиевый корпус, исполнение именно IM B5 (или B35 только если масса паспорта дана для этого исполнения и лапы учтены), фланец FF350 (Ø400/350/300) и вал 55 × 110 под колокол A4VSO180 из ведомости; масса из листа данных точного артикула. Сравнить ≥ 3 производителей (WEG, Siemens, ABB, Brook Crompton, Hoyer, Cantoni и др.); у каждого: артикул, масса, n ном, момент ном и опрокидывания (≥ OMEC по паспорту OMEC), η, ток, url. Если колокол/муфта меняются — их масса в Δм."
  - "Мотор и цикл: rated_motor_rpm в G-CYCLE ограничен сверху 1480 (ops/gates/cycle_model/qualification.py MAXIMUMS). n_ном ≥ 1480 об/мин → params не меняются, G-CYCLE на params.t26a.yaml (5,905 с, RMS 29,987) — мотор зачитывается при паспортной массе. n_ном < 1480 → копия calc/T-2.5c/params/params.t25c.yaml (отличается от params.t26a.yaml только cycle_model.pump.motor_rpm = rated_motor_rpm = n_ном с источником) и G-CYCLE на ней: цикл ≤ 5,910 с и RMS ≤ 30,0 кВт, иначе мотор не зачитывается (WEG 12840024 1475 об/мин — FAIL 30,075, не повторять). Цикл и RMS — только по гейту, не оценкой."
  - "TF (строки T16-15 48,5 кг, T16-18 5 кг): предохранительное устройство резервуара TF с подпором 0,60 ± 0,05 бар (T-2.6) при действующей уставке сброса (T-1.6, 1,9 бар) — уставку и расчётное давление TF не менять. Пропускная способность при допустимом превышении над уставкой (норма с источником, например EN ISO 4126-1/-7) с поправкой на вязкость HLP46 при наихудшей температуре и противодавлении слива ≥ наибольшего притока 1588,64 л/мин (модель T-2.6, T-2.5b measures). Варианты: 1–3 клапана Goetze (455/642/851 и др.), LESER, Herose или иной; масса комплекта с фланцами и опорами по каталогу. Зачёт = 53,5 − масса нового комплекта. 2 × Goetze 642 DN65 (1541 л/мин) не годится."
  - "DB → картриджи (строка T16-08, 128 кг проектного резерва, из них шесть DB30): картридж с внешним дренажем пилота (Y→DR) или показать по схеме T-1.6, что противодавление TR/TRF/TEM на уставку допустимо (уставки 298–300 бар, пики ≤ 315 бар, расходы RGA 181, RGB 125, RRA 270, RRB 186, RV0 265, RVM 265 л/мин). Паспорт: номинальное давление ≥ 350 бар, характеристика P(Q) на требуемом расходе, полость (cavity) с url. Масса: картриджи по каталогу + корпуса/доля блока по чертежу полости и геометрии (сталь 7850 кг/м³) — против массы DB30 по каталогу Rexroth. Динамика сброса — открытый пункт для образца (D-OP-11), на зачёт не влияет."
  - "Бак T0 (строки T16-02 94,756 кг, T16-06 42,35 кг): объём масла 190 л и габарит не уменьшаются (D-GK-18). Стенки 3 мм с рёбрами: расчёт пластин и швов (гидростатика, заливка при транспорте, подъём, вибрация от мотора 1480 об/мин — частота пластин вне 24,7 и 49,3 Гц), метод и формула с источником (норма или справочник с изданием и номером формулы), крепления и проушины. Бак как основание: путь нагрузки мотор + насос + колокол на бак, подъём, транспорт (ускорения как в T-2.5b), прогиб плиты под колоколом против допуска соосности муфты по каталогу муфты. Без полного расчёта — не зачитывать."
  - "Остаточные пункты КД из D-GK-20 (по возможности, на массу не влияют): Δp масла ветви PC при 42–45 °C (1,33–1,36 бар > 1,25) — уставка CB ≈ 1,5 бар или иное решение без замены PC 0,55 кВт, с расчётом мощности на валу PC ≤ 0,55 кВт; подтверждение Bowman (площадь, точка 150 л/мин, Δp масла при 42–45 °C, химия воды, NH₃/сульфиды) — запрос поставщику в report.md, данные только из открытых источников. Установленная мощность с воздушной опцией ≤ 34,2 кВт."
  - "Масса станции: ведомость T-2.5b копируется, меняются только строки мер; каждая строка снимается не более одного раза; база сверена с T-2.5b до 0,01 кг. Масса машины: machine_A_variants T-2.5b минус зачтённое облегчение станции, три варианта, недостающие кг до 5000 и до 5080 по каждому; отдельно — масса при всех мерах, включая незачтённые (верхняя граница того, что дают паспорта)."
  - "Итог: design/hydraulics/station.t25c.yaml (полный, самодостаточный: ведомость построчно с источниками, мотор, TF, DB, бак, охлаждение по T-2.5b, цикл), проект строки D-GK в report.md (ГК вносит сам)."
deliverables:
  - calc/T-2.5c/                           # motor.py, relief.py, cartridges.py, tank.py, mass.py, report.py, sources.yaml, results.json, params/params.t25c.yaml (только если n_ном < 1480); ≤ 5 МБ
  - design/hydraulics/station.t25c.yaml
  - report.md
  - metrics.json                           # station_t25b_kg, station_t25c_kg, credited_measures_kg, credited_measures, not_credited_measures, machine_A_kg_range, missing_to_5000_kg, machine_A_all_measures_kg_range, motor_model, motor_kg, motor_rated_rpm, cycle_gate_s, rms_kW, tf_capacity_L_min, tf_required_L_min, installed_kW, installed_with_air_option_kW, pc_branch_dp_bar
  - self_check.json
  - gates.t25c.json
acceptance:
  - "масса станции и машины схемы A построчно с источниками, без двойного счёта; база сверена с T-2.5b (1686,19 / 5158,90…5202,25 кг); итог по трём вариантам T-2.2i и недостающие кг до 5000"
  - "каждая зачтённая мера — с паспортом/листом данных точного исполнения (url) и расчётом, где он требуется; незачтённые — в перечне с причиной и потенциальной Δм"
  - "мотор: зачтён только при G-CYCLE PASS с RMS ≤ 30,0 кВт (params.t26a.yaml при n ≥ 1480 или params.t25c.yaml при n < 1480, цикл ≤ 5,910 с), моменте опрокидывания ≥ базового и посадке на колокол"
  - "TF: пропускная способность с вязкостью HLP46 и противодавлением ≥ 1588,64 л/мин при допустимом превышении по норме; уставка и подпор 0,60 ± 0,05 бар не изменены"
  - "функция гидравлики T-2.6 не изменена; гейты G-PFACE, G-DOSE, G-CYCLE PASS на calc/T-2.6/params/params.t26a.yaml (REV_PYTHON ops/gates/calc_gates.py --params ... --criteria ops/criteria/design_criteria.yaml --out <worktree>/gates.t25c.json), method reference_model; при n < 1480 — то же на params.t25c.yaml"
  - "установленная мощность без / с воздушной опцией ≤ 34,2 кВт (C-PWR-01)"
  - "свойства и каталожные данные — sources.yaml с url; self_check: двойной прогон даёт одинаковые results.json и station.t25c.yaml; report.md пишется из Python в UTF-8 и проверяется чтением на отсутствие «?»; временные каталоги удалить"
allowed_paths: [calc/T-2.5c/**, design/hydraulics/station.t25c.yaml, report.md, metrics.json, self_check.json, gates.t25c.json]
forbidden: [git commit, git push, изменение ops/**, изменение существующих design/*.yaml и design/hydraulics/* (station.t25b.yaml — только читать), изменение docs/**, изменение calc/** кроме calc/T-2.5c/**, сеть из shell, выдуманные свойства, массы и коэффициенты, зачёт меры без источника, мотор ≠ 30 кВт S1 или не IM B5 без паспортной массы исполнения, rated_motor_rpm > 1480 в params, насос другого типоразмера или регулятора, изменение уставки TF и подпора 0,60 ± 0,05 бар, изменение функции схемы T-2.6, замена охладителя Bowman и PC 0,55 кВт, установленная > 34,2 кВт, изменение силовой части машины (камера, рама, главный цилиндр, задняя крышка — D-OP-19), уменьшение бака 190 л (D-GK-18), изменение критериев и порогов]
gates: [G-PFACE, G-DOSE, G-CYCLE]
gate_inputs: {params: calc/T-2.6/params/params.t26a.yaml}
timebox_min: 150
stop_and_ask_if:
  - "после всех зачтённых мер машина схемы A по верхней границе > 5000 кг — это ожидаемый исход (D-OP-21), остановиться и дать цифры: таблица мер (зачтено / не зачтено, Δм, источник), масса машины по трём вариантам, недостающие кг до 5000 и до 5080, масса при всех мерах включая незачтённые"
  - "ни один мотор 30 кВт Al B5 с паспортной массой не даёт G-CYCLE PASS с RMS ≤ 30 кВт — мотор не зачитывать, доложить лучший вариант (n, RMS, масса)"
  - "мера требует изменения уставки TF, подпора, схемы дренажей T-1.6 или функции T-2.6 — не зачитывать, доложить"
  - "мера не подтверждается паспортом/листом данных точного исполнения с массой — не зачитывать, доложить причину"
