id: T-1.7
stage: S1-str
role: FEA
backend: voh            # резерв: alm, bos (запуск строго по одному — песочница Windows)
effort: high
web_search: true        # материалы литья/проката, классы IIW/FKM, гайки и шпильки (поиск на стороне модели; shell без сети)
objective: >
  Силовая рама пресса (колонная, 4 колонны с преднатягом, две торцевые траверсы) на силу 1,94 МН (315 бар на Ø280, C-STR-01)
  и 10⁷ циклов (C-FAT-01) минимальной массы. Одно сравнительное исследование трёх исполнений торцевой траверсы — сплошная
  профилированная плита, литая (кольцо + лучи), сварной короб — с объёмной FEA, выбор одного и обоснование. Цель рамы
  ≤ 1400 кг; итог — масса машины против C-MASS-01 и вклад рамы в габарит C-ENV-01.
inputs:
  - DECISIONS.md                           # D-OP-06 (рама на 300 бар), D-OP-08, D-GK-01, D-GK-02
  - ops/criteria/design_criteria.yaml      # v3: C-STR-01, C-FAT-01, C-CLR-01, C-ENV-01, C-MASS-01
  - ops/reports/T-1.6/GK_review.md         # почему отклонена литая рама T-1.6 (H1, M1–M3, L1) — главный вход
  - ops/reports/T-1.5/GK_review.md, ops/reports/T-1.6/report.md
  - calc/T-1.5/mass_budget.py, calc/T-1.6/frame_screen.py, calc/T-1.6/mass_budget.py, calc/T-1.6/results.json   # только читать
  - design/cylinders.t16.yaml              # главный ГЦ: крышки, шпильки M36 на PCD 450, посадочные диаметры (только читать)
methods:
  - "Нагрузки: статика 1,94 МН (C-STR-01, запас ≥ 1,5 к Rp0,2 по эквивалентным напряжениям, локальная пластичность в галтелях — только с обоснованием по методу); усталость — размах 0 → 1,70 МН (резерв 300 бар по D-OP-06) на 10⁷ циклов, запас ≥ 1,0 после всех коэффициентов; эксцентриситет силы 10 мм по каждой оси. Опирание крышки ГЦ и камеры/вкладыша на траверсы — по фактическим диаметрам из cylinders.t16 и T-1.2b, а не точкой."
  - "Аналитический скрининг каждого исполнения: правильная модель кольца/плиты (равновесие по разрезу посередине между колоннами, момент от корней лучей учесть — дефект H1 T-1.6), колонны по VDI 2230 с пересчитанной долей нагрузки φ для фактического пакета зажима (M3), резьба и гайки M100 или иные (размер под ключ, по углам, посадка в бобышку/на торец — M1), шпильки ГЦ M36 на PCD 450 должны попадать в материал траверсы."
  - "Объёмная FEA: параметрическая геометрия и сетка — gmsh (python API или .geo, OCC), решатель CalculiX ccx (E:/Tools/FreeCAD-1.1/bin/ccx.exe, gmsh.exe рядом), линейно-упругая, C3D10; симметрия 1/4 при обосновании (эксцентриситет — отдельным полным или наложением). Колонны — стержнями или телами с преднатягом; контакт крышка/траверса — допускается связанный с оговоркой. Сходимость: 3 сетки, максимум эквивалентных и главных напряжений в галтелях меняется < 5 % на последних двух; на сетке — h у галтели ≤ R/4. Верификация модели: плита (вариант 1) — сравнение FEA с аналитикой пластины/балки в пределах 10 %."
  - "Усталость из FEA: литьё — FKM (локальные напряжения, коэффициенты поверхности, качества литья с классом MT/UT по EN 1559/EN 12680 — указать класс; Rm/Rp0,2 для толщины стенки по стандарту материала, url); сварка — IIW hot-spot или эффективное напряжение (FAT-класс детали, поправка на толщину); плита — FKM номинал/локально. Kt не задавать — он из FEA."
  - "Жёсткость: прогиб траверс и раскрытие зазора под нагрузкой → боковое смещение оси пуансона ≤ 0,15 мм (C-CLR-01 deflection_share 0,5 от 0,3 мм) и перекос направляющих."
  - "Масса и габарит: масса каждого исполнения (тела из gmsh — объём, + колонны, гайки, опоры, направляющие траверсы — строками, L1); длина рамы вдоль оси, вылет траверс, длина колонн; сравнение с T-1.5 (плиты 1674,4 кг). Таблица «исполнение | масса | статика | усталость | прогиб | технологичность/цена (качественно) | риск»; выбрать одно, пояснить. Обновлённый бюджет массы машины: строки T-1.6 + рама T-1.7."
deliverables:
  - calc/T-1.7/frame_analytic.py
  - calc/T-1.7/frame_fea.py                  # геометрия gmsh, сетки, запуск ccx, извлечение результатов
  - calc/T-1.7/fea/                          # входные .inp и выжимки результатов (не полные .frd > 5 МБ — их не класть)
  - calc/T-1.7/mass_budget.py
  - calc/T-1.7/sources.yaml
  - calc/T-1.7/results.json
  - design/frame.t17.yaml                    # выбранное исполнение: размеры, материал, колонны, гайки, преднатяг, масса
  - report.md                                # таблица сравнения, сходимость, верификация, запасы, прогибы, масса машины, места для детальной G-FEA
  - metrics.json
  - self_check.json
  - gates.t17.json
acceptance:
  - "выбранное исполнение: C-STR-01 ≥ 1,5 при 1,94 МН; C-FAT-01 запас ≥ 1,0 при 0 → 1,70 МН, 10⁷ — по FEA, с объяснимой сходимостью; колонны/резьба VDI 2230 с остаточным обжатием > 0 при ±5 % затяжки"
  - "FEA плиты согласуется с аналитикой в пределах 10 %; аналитический скрининг выбранного исполнения не расходится с FEA более чем на 25 % (иначе — объяснение)"
  - "боковое смещение оси ≤ 0,15 мм; шпильки ГЦ и гайки колонн геометрически размещены"
  - "масса рамы и машины с источником каждой строки; цель рамы ≤ 1400 кг, машины ≤ 4750 кг — показать, PASS/FAIL"
  - "гейты G-PFACE, G-DOSE, G-CYCLE PASS (REV_PYTHON ops/gates/calc_gates.py --params design/params.t14b.yaml --criteria ops/criteria/design_criteria.yaml --out <worktree>/gates.t17.json) — инвариант, рама цикл не меняет"
  - "self_check: двойной прогон даёт побайтно одинаковые results.json и frame.t17.yaml (FEA — с фиксированной сеткой/зерном; допускается сравнение с допуском 1e-6 по числам, указать)"
allowed_paths: [calc/T-1.7/**, design/frame.t17.yaml, report.md, metrics.json, self_check.json, gates.t17.json]
forbidden: [git commit, git push, изменение ops/**, изменение design/params.*.yaml, design/cylinders.*.yaml, design/hydraulics/**, изменение docs/**, изменение calc/** кроме calc/T-1.7/**, сеть из shell, выдуманные свойства материалов и каталожные данные, CAD-модель изделия (FreeCAD-документы КД), параллельные исполнения после выбора]
gates: [G-PFACE, G-DOSE, G-CYCLE]
gate_inputs: {params: design/params.t14b.yaml}
timebox_min: 180
stop_and_ask_if:
  - "ни одно исполнение не даёт C-FAT-01 ≥ 1,0 при массе рамы ≤ 1600 кг — покажи лучший и что потребовалось бы"
  - "ccx или gmsh не запускаются в песочнице — сообщи команду и ошибку, аналитикой FEA не подменяй"
  - "выбранное исполнение требует изменить главный цилиндр, камеру или длину хода"
