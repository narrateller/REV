id: T-2.9
stage: S2-hyd
role: HYD
backend: bos            # alm/voh — по наличию лимита; запуск строго по одному
effort: high
web_search: true        # RE 20478 (ZSF), RE 29406 (2WRCE), каталоги рукавов (объёмное расширение ISO 18752/EN 856), Goetze 455, Bowman GL, PC/CB, методы гидроудара
objective: >
  Принципиальная гидросхема схемы A по ISO 1219-1/-2 (ревизия T-1.6 → T-2.9) с функцией эталона T-2.6 (A4VSO180 DFE1Z,
  MF 2WRCE NG50 двухканальный, регенерация, ГА НД быстрого возврата, вариант A_combined_NG50_33p25_kW_50ms_AX), охлаждением
  T-2.5b (Bowman GL180-1428-3, D-GK-20) и станцией T-2.5c (мотор ABB M3AA 200MLA 4, D-GK-21), блокировками фаз схемы A
  (неподвижная крыша X 90 мм, башмак подпрессовки с носом на входе кольца, ≤ 163 кН рабочая / 171 кН при 315 бар, перенос дозы
  под крышей 35,3 кН). Закрыть открытые гидравлические вопросы до мастер-компоновки T-2.3: (1) ZSF NG100 — кавитация на
  быстром ходе и всплеск давления на порте A при остановке потока наполнения (T-2.2 M5: 18,37 бар мгновенный останов при
  1293 л/мин против 16 бар каталога; при потоке T-2.6 1552 л/мин мгновенный останов ≈ 24 бар); подпор TF с эластичным
  разделителем 0,60 ± 0,05 бар, сброс 1,9 бар, пик выхлопа в TF 1,778 бар; (2) ветвь PC/CB: Δp 1,33–1,36 бар > 1,25 при
  42–45 °C, CB 1,5 бар даёт 0,625 кВт > 0,55 кВт на валу PC; (3) место присоединения воздушной опции; (4) влияние рукавов
  на сжимаемость (эталон — K масла 1,4 ГПа без рукавов, D-GK-19) на цикл и RMS; (5) усилие отпирания носа башмака
  16,5–20,0 кН против 15,59 кН привода T-2.6 (T-2.2i). Цикл G-CYCLE ≤ 5,95 с и RMS ≤ 30,0 кВт (сейчас 5,905 с / 29,987 кВт,
  запас RMS 0,013) — без ухудшения сверх этих пределов; масса станции 1654,19 кг не растёт без построчной записи.
inputs:
  - DECISIONS.md                           # D-GK-02, D-GK-06, D-GK-08, D-GK-12, D-GK-13, D-GK-16, D-OP-16, D-OP-19, D-OP-20, D-GK-19, D-GK-20, D-OP-21, D-GK-21
  - ops/criteria/design_criteria.yaml      # v4: C-HYD-01, C-PWR-01, C-PERF-01, C-SAFE-01, C-MASS-01
  - design/hydraulics/T-1.6_circuit.yaml, design/hydraulics/T-1.6_interlocks.yaml, design/hydraulics/T-1.6_circuit.svg   # действующая схема до A (только читать; копия в T-2.9)
  - calc/T-1.6/ (check_circuit.py, safety_checks.py, draw_circuit.py, sources.yaml)   # инструменты схемы и мутационный набор (33 мутации) — только читать, копия в calc/T-2.9/
  - calc/T-2.6/ (results.json → variants.A_combined_NG50_33p25_kW_50ms_AX: prefill, valves, accumulators, phase_table, configuration; scheme_A; inventory.csv; sources.yaml; cycle/)   # функция эталона, клапаны, расходы (только читать)
  - calc/T-2.6/params/params.t26a.yaml     # params эталона с cycle_model: G-CYCLE 5,905 с, RMS 29,987 кВт (только читать)
  - ops/gates/cycle_model/ (qualification.py: oil.bulk_modulus_Pa ≤ 1,4e9, границы входов)   # только читать
  - calc/T-2.2/results.json → zsf.transient (18,368 бар, a 1268,5 м/с, ID 130, 1,62 м/с, port_A_rating_bar 16), ops/reports/T-2.2/GK_review.md (M5)   # только читать
  - ops/reports/T-2.6/GK_review.md, ops/reports/T-2.6/metrics.json   # report.md T-2.6 с потерей кириллицы — числа брать из results.json
  - ops/reports/T-2.2i/GK_review.md, ops/reports/T-2.2i/metrics.json, calc/T-2.2i/   # нос башмака на входе кольца, отпирание 16,5–20,0 кН (только читать)
  - design/hydraulics/station.t25c.yaml    # действующая ведомость станции 1654,19 кг; cooling, air_option, reservoirs.TF, open_items (только читать)
  - ops/reports/T-2.5b/GK_review.md, ops/reports/T-2.5c/GK_review.md, calc/T-2.5b/, calc/T-2.5c/   # PC/CB, Bowman, TF Goetze 455 (только читать)
  - docs/site/cooling_water_requirements.md   # только читать
methods:
  - "Схема. Скопировать T-1.6_circuit.yaml / T-1.6_interlocks.yaml в design/hydraulics/T-2.9_circuit.yaml / T-2.9_interlocks.yaml и calc/T-1.6/{check_circuit,safety_checks,draw_circuit}.py и sources.yaml в calc/T-2.9/ (T-1.6 не трогать). Привести схему к функции T-2.6 (inventory.csv, configuration варианта): MF 2WRCE NG50 двухканальный (Double-B), MBT, MC LC80/LFA80, регенерация, VR 4WRLE25, ГА НД SB330 20 л с LCH/LR/LRC и SAL, AX SB330 10 л, DFE1Z с внешним Z от AX; охлаждение T-2.5b: T0 → PC → CP → GL180 → CF → FT → CT → CD → T0, CB, водяной клапан, TT; мотор ABB 400 В. Каждое изменение против T-1.6 — строкой report.md: элемент | было | стало | Δм, кг | источник (url) | причина. interlocks.reference = calc/T-2.9/params/params.t29.yaml. Символы ISO 1219-1, обозначения элементов сохранить, новые — по той же системе."
  - "Блокировки схемы A. Фазы — из cycle params.t29 (= эталон T-2.6 A): подпрессовка (башмак 171 кН при 315 бар, рабочая ≤ 163 кН), перенос дозы под крышей (35,3 кН), прессование под неподвижной крышей X 90 мм, выдержка, декомпрессия, выталкивание, возврат, шибер. Засовы D-GK-01 в схеме A заменены носом башмака на входе кольца (D-GK-16) — блокировки bolt*_locked заменить на подтверждение посадки носа (датчик с источником, два канала для разрешения прессования) или обосновать иное по T-2.2i. Механические разрешения: прессование только при посаженном носе, закрытом шибере, закрытом ZSF и запертых MF/MBT; выталкивание только при открытом шибере; закрытие шибера только при x главного пуансона ≤ уставки по геометрии A; подпрессовка/отпирание носа только при давлении в полости ГЦ ≤ 3 бар (после декомпрессии); открытие MF/MBT — по entry_conditions T-1.6 с PTF. Мутационный тест: каждая блокировка и разрешение схемы A удаляется/ослабляется по одной → check_circuit FAIL; набор T-1.6 (33 мутации) не ослаблять, новые — добавить, итог N ≥ 33 + число новых блокировок, все отвергнуты."
  - "check_circuit.py в calc/T-2.9/ — с аргументами --circuit, --interlocks, --out (файл результата; по умолчанию calc/T-2.9/results.json), код выхода 0 только при 0 дефектов и всех отвергнутых мутациях; ожидаемое число мутаций — из файла, а не константой 33. Отдельный calc/T-2.9/test_interlocks.py (pytest и запуск как скрипт): по одному тесту на каждую новую блокировку схемы A — мутация → FAIL, исходник → PASS."
  - "ZSF, гидроудар. Исходник M5 (T-2.2 zsf.transient) — мгновенный останов, Жуковский ρ·a·Δv. Для T-2.6: поток 1552 л/мин наполнения (ID125, 2,107 м/с) и 1588,6 л/мин выхлопа в TF. Рассчитать переходный процесс методом характеристик (MOC) или сосредоточенными параметрами с обоснованием (L < a·t_закр/2): длина и сечение трассы TF→ZSF (из компоновки T-1.6/T-2.6, при неопределённости — диапазон 0,5…2,0 м), скорость волны с упругостью трубы/рукава, податливость TF (мембранный сосуд, газ 0,55…0,65 бар), профиль торможения потока: (а) штатный переход подвод → прессование по модели цикла (замедление пуансона, закрытие ZSF по RE 20478), (б) аварийный останов (закрытие VR/MF/ME по каталожному времени срабатывания с источником, наихудшее), (в) мгновенный останов как верхняя граница. Сравнить пик на порте A ZSF с допустимым по RE 20478 (16 бар — проверить по каталогу, какой порт и какое давление допустимо, с цитатой места). Если > допустимого — мера без смены ZSF: рампы клапанов (без изменения времён цикла сверх гейта), демпфер/ГА на линии TF, геометрия трассы; показать пик после меры. То же для выхлопа ГЦ в TF через MF: пик в TF против сброса RTF/Goetze 455 1,9 бар и предела бака 3 бар (пиковое 1,778 бар — запас 0,12)."
  - "ZSF, кавитация. Минимальное абсолютное давление в полости ГЦ и на порте A при наибольшем ускорении быстрого хода (эталон: 1,040 бар абс. при TF 0,55 бар, запас насыщения +0,027 бар; без подпора 0,49 бар абс.): холодное масло (по температуре пуска с источником) и 55 °C, нижний уровень TF, ускорительный напор 0,218 бар, Δp ZSF по RE 20478 при 1552 л/мин (запас до 1600 — 48 л/мин). Критерий — давление выделения воздуха для масла, насыщенного при атмосферном давлении в T0 (коэффициент Бунзена HLP46 с источником), и давление насыщенного пара; запас ≥ 0 во всех сочетаниях. Если отрицательный — мера: уставка подпора TF в пределах, где пик выхлопа + переходный всплеск < 1,9 бар сброса (иначе — не менять), рампа ускорения быстрого хода, сечение трассы; каждую меру — через G-CYCLE."
  - "PC/CB (D-GK-20, D-GK-21). Δp ветви PC при 20, 42, 45, 55 °C и при загрязнённом GL180 (Bowman/расчёт T-2.5b с вязкостью HLP46), мощность на валу PC с КПД по источнику. Требование: PC 0,55 кВт не перегружается ни в одном режиме (≤ 0,55 кВт на валу или по паспорту двигателя с допустимой перегрузкой, с источником), CB закрыт при 42–55 °C на чистом и загрязнённом аппарате (иначе масло обходит охладитель — Q_dirty ≥ 25,01 кВт при воде 30 °C и масле 55 °C сохраняется), холодный пуск через CB. Варианты: уставка CB, аппарат GL180 с меньшим Δp масла (иное число ходов, тот же типоразмер), трассы, расход PC; замена PC на 0,75 кВт не годится (34,303 > 34,2 кВт с воздушной опцией). Установленная без / с воздушной опцией ≤ 34,2 кВт."
  - "Воздушная опция (D-OP-20): точки присоединения CP/CF на схеме ISO 1219 (отводы, запорная арматура, заглушки, переключение вода ↔ воздух на остановленной машине, сохранение FT1/FT2, CB, TT, сигналов потока), место в станции — по station.t25c.yaml air_option; масса присоединений уже в ведомости (T25B-AO) — новых кг не добавлять без строки."
  - "Bowman: только перечень того, что поставщик должен подтвердить (площадь 2,1 м², точка 150 л/мин воды, Q и Δp масла при 42/45/55 °C на HLP46, холодный пуск, химия воды CuNi 90/10, NH₃, сульфиды, скорость в трубках, EV220B 40 вместо 25) — в report.md и в open_items схемы. Поставщику не писать, ничего не запрашивать."
  - "Рукава. Перечень гибких участков, которые в схеме нужны (станция ↔ машина, подвижные цилиндры, виброизоляция), с DN, длиной (диапазон по компоновке), классом (ISO 18752 / EN 856 4SH/R13, R15) и объёмным расширением по каталогу производителя (url). Эффективный K для объёмов, сжимаемых в фазах прессования и декомпрессии (полость ГЦ + мёртвый объём + трасса P/A до ГЦ): K_eff = V / (V/K_oil + ΣΔV_рукав/Δp). Если рукава в сжимаемом объёме главного контура: params.t29 с oil.bulk_modulus_Pa = K_eff (≤ 1,4e9, квалификация допускает) и/или cap_dead_L по объёму трасс, остальное — копия params.t26a; G-CYCLE на нём. Если цикл > 5,95 с или RMS > 30 — мера: жёсткая труба на главном напорном тракте (рукав только вне сжимаемого объёма) и повтор. Отдельно — K_eff 1,2 / 1,0 ГПа (чувствительность, информационно)."
  - "Отпирание носа башмака (T-2.2i: 16,5–20,0 кН против 15,59 кН привода T-2.6). Найти, откуда 15,59 кН (давление и площадь штоковой полости Ø125/56, КПД 0,92). Требование: усилие отрыва ≥ 1,25 × 20,0 = 25,0 кН при наименьшем давлении источника в момент отпирания, без изменения цилиндра подпрессовки (силовая часть заморожена D-OP-19): выбор источника/уставки на начале pre_up (ГА НД, главный насос, отдельная ступень). Изменение уставок, влияющих на цикл, — только через params.t29 и G-CYCLE."
  - "params. calc/T-2.9/params/params.t29.yaml — всегда: копия calc/T-2.6/params/params.t26a.yaml; каждое отличие — с комментарием-источником и строкой в report.md (поле | t26a | t29 | причина). Если отличий нет — файл идентичен по cycle_model, указать в report.md. Цикл и RMS — только по гейту, не оценкой."
  - "Масса. Любое изменение состава станции/машины против station.t25c.yaml — строкой mass_delta (элемент | было | стало | Δм, кг | источник); если сумма ≠ 0 — design/hydraulics/station.t29.yaml (копия station.t25c.yaml с изменёнными строками и пересчётом машины A по трём вариантам T-2.2i: сейчас 5126,90 / 5135,80 / 5170,25 кг). Предел машины 5000 кг (сейчас превышен, D-OP-21) — в плюс не идти без строки и причины."
  - "SVG: calc/T-2.9/draw_circuit.py → design/hydraulics/T-2.9_circuit.svg (ISO 1219, листы по секциям допускаются); self_check: двойной прогон даёт побайтно одинаковые results.json, T-2.9_circuit.svg, params.t29.yaml."
deliverables:
  - design/hydraulics/T-2.9_circuit.yaml
  - design/hydraulics/T-2.9_circuit.svg      # генерируется
  - design/hydraulics/T-2.9_interlocks.yaml
  - design/hydraulics/station.t29.yaml       # только если масса станции меняется
  - calc/T-2.9/                              # check_circuit.py, safety_checks.py, draw_circuit.py, test_interlocks.py, transient.py (ZSF/TF), cavitation.py, pc_branch.py, hoses.py, unlock.py, sources.yaml, results.json, params/params.t29.yaml; ≤ 5 МБ
  - report.md
  - metrics.json                             # circuit_defects, mutations_total, mutations_rejected, new_interlocks, zsf_port_A_peak_bar (штатный / аварийный / мгновенный), zsf_port_A_allowed_bar, tf_peak_bar, tf_relief_bar, cap_min_abs_bar, air_release_margin_bar, pc_dp_bar_42_45C, pc_shaft_kW_max, cb_setpoint_bar, installed_kW, installed_with_air_option_kW, hose_K_eff_Pa, cycle_gate_s, rms_kW, unlock_force_kN, station_mass_delta_kg, station_kg, machine_A_kg_range
  - self_check.json
  - gates.t29.json
acceptance:
  - "схема ISO 1219 T-2.9 с функцией T-2.6 и охлаждением T-2.5b/T-2.5c; таблица изменений против T-1.6 построчно с источниками"
  - "check_circuit.py (calc/T-2.9, --circuit design/hydraulics/T-2.9_circuit.yaml --interlocks design/hydraulics/T-2.9_interlocks.yaml --out <файл>): 0 дефектов, все мутации отвергнуты, N ≥ 33 + новые блокировки схемы A; test_interlocks.py PASS"
  - "ZSF: пик на порте A в штатном и аварийном останове ≤ допустимого по RE 20478 (с цитатой места каталога) без смены клапана, мгновенный — как граница с объяснением; пик в TF < 1,9 бар; кавитация — запас до выделения воздуха ≥ 0 во всех сочетаниях; метод и входы с источниками"
  - "PC: ≤ 0,55 кВт на валу во всех режимах, CB закрыт при 42–55 °C на чистом и загрязнённом аппарате, Q_dirty ≥ 25,01 кВт сохранён; установленная без / с воздушной опцией ≤ 34,2 кВт; воздушная опция на схеме"
  - "рукава: K_eff с каталожным объёмным расширением; гейты G-PFACE, G-DOSE, G-CYCLE PASS на calc/T-2.9/params/params.t29.yaml (REV_PYTHON ops/gates/calc_gates.py --params calc/T-2.9/params/params.t29.yaml --criteria ops/criteria/design_criteria.yaml --out <worktree>/gates.t29.json), method reference_model, cycle ≤ 5,95 с, RMS ≤ 30,0 кВт; каждое изменение против t26a с причиной"
  - "отпирание носа ≥ 25,0 кН при наименьшем давлении источника без изменения цилиндра"
  - "масса: Δм станции построчно; без роста — явное «0 кг»; при росте — station.t29.yaml и машина A по трём вариантам"
  - "свойства и каталожные данные — sources.yaml с url и местом чтения; report.md пишется из Python в UTF-8 и проверяется чтением на отсутствие «?»; временные каталоги удалить"
allowed_paths: [calc/T-2.9/**, design/hydraulics/T-2.9_circuit.yaml, design/hydraulics/T-2.9_circuit.svg, design/hydraulics/T-2.9_interlocks.yaml, design/hydraulics/station.t29.yaml, report.md, metrics.json, self_check.json, gates.t29.json]
forbidden: [git commit, git push, изменение ops/** (в т. ч. гейтов, критериев и границ квалификации), изменение существующих design/*.yaml и design/hydraulics/* (T-1.6_*, station.t25c.yaml — только читать), изменение docs/**, изменение calc/** кроме calc/T-2.9/**, сеть из shell, выдуманные свойства и каталожные данные, oil.bulk_modulus_Pa > 1,4e9 и любой оптимистичный сдвиг входов cycle_model против t26a, смена ZSF NG100 / A4VSO180 DFE1Z / MF 2WRCE NG50 / мотора ABB / Bowman GL180 типоразмера, PC > 0,55 кВт, установленная > 34,2 кВт, изменение сечения 150 × 60, хода ГЦ 396 мм, крыши X 90 мм, цилиндров (Ø ГЦ 280, подпрессовка Ø125/56, быстрые Ø90/50), силовой части (D-OP-19), бака 190 л, уставок C-HYD-01 (300/315 бар), рост массы станции без строки в mass_delta]
gates: [G-PFACE, G-DOSE, G-CYCLE]
gate_inputs: {params: calc/T-2.9/params/params.t29.yaml}
timebox_min: 180
stop_and_ask_if:
  - "G-CYCLE на params.t29 > 5,95 с или RMS > 30,0 кВт (в т. ч. из-за рукавов после меры «жёсткая труба») — дать цифры по каждой причине и лучший достижимый вариант"
  - "пик на порте A ZSF в штатном или аварийном останове не снижается до допустимого без смены клапана — дать пик по каждой мере и требуемый клапан/исполнение"
  - "масса станции растёт > 10 кг суммарно — дать mass_delta построчно и альтернативы"
  - "PC 0,55 кВт не выдерживается ни одним вариантом без замены аппарата другого типоразмера или PC — дать цифры"
  - "блокировка схемы A требует изменения силовой части или цилиндра (нос, крыша) — не менять, доложить"
