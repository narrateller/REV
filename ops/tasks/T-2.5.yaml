id: T-2.5
stage: S2-hyd
role: HYD
backend: bos            # alm/voh — по наличию лимита; запуск строго по одному
effort: high
web_search: true        # каталоги: моторы 30 кВт S1 в алюминиевом корпусе, масло-воздушные охладители, баки, ГА, нормы объёма бака и деаэрации
objective: >
  Облегчение гидростанции по D-OP-10 / D-OP-15 / D-OP-16 / D-OP-17 без изменения функции гидравлики T-2.6 и без ухудшения охлаждения.
  База: станция T-1.6 round 2 — 1655,3 кг (calc/T-1.6/results.json, mass.station_rows) плюс гидравлика T-2.6 +76,23 кг
  (calc/T-2.6/inventory.csv; selected.mass.added_hydraulics_kg); машина без облегчения — 4942,65 + 76,23 кг + силовая часть схемы A
  (calc/T-2.2i/results.json, fixed_machine_rows; итог 5170…5270 кг).
  Цель: снять со станции ≥ 230 кг (машина ≤ 5000 кг при схеме A до 5230 кг); минимум приёмки 170 кг (D-OP-17: машина до ≈ 5080 кг).
  Ориентиры по статьям, кг (не задание, а порядок величин): бак 94,8 + основное масло 165,3 → −60…−90 (объём по тепловому балансу,
  деаэрации и колебанию уровня); рама станции 42,4 → −20…−35 (бак как основание); охладители 2 × ASA0567 173,4 → −40…−70
  (иной масло-воздушный охладитель той же или большей холодопроизводительности); мотор, насос, муфта 368 → −30…−60
  (мотор 30 кВт S1 в алюминиевом корпусе, колокол и муфта); блоки и картриджи (2WRCE 262,9, коллекторы 128, прочие блоки) → −20…−50
  (общие блоки, кредит без двойного счёта); ГА 64 → 0…−20; трассы, фильтры, малые линии, локальный бак → −10…−25.
  Итог — ранжированный перечень мер «мера | Δм, кг | что проверено | риск | источник» и одно рекомендуемое исполнение станции.
inputs:
  - DECISIONS.md                           # D-OP-07, D-OP-09, D-OP-10, D-OP-15…D-OP-19, D-GK-02, D-GK-13…D-GK-17
  - ops/criteria/design_criteria.yaml      # v4: C-MASS-01, C-PWR-01, C-HYD-01, C-ENV-01
  - calc/T-1.6/ (results.json: mass, heat_balance; heat_balance.py, mass_budget.py, manifolds.py, sources.yaml), ops/reports/T-1.6/GK_review.md   # станция и охлаждение (только читать)
  - design/hydraulics/T-1.6_circuit.yaml, design/hydraulics/T-1.6_interlocks.yaml   # действующая схема (только читать)
  - calc/T-2.6/ (results.json: selected, selected_sensitivity; inventory.csv, cycle/, energy.py), ops/reports/T-2.6/GK_review.md, calc/T-2.6/params/params.t26a.yaml   # эталон цикла 5,904 с, RMS 29,987 кВт, +76,23 кг
  - calc/T-2.2i/results.json (variants.nose_x225.mass.*.fixed_machine_rows), ops/reports/T-2.2i/GK_review.md   # ведомость массы машины схемы A
  - calc/T-1.7c/mass_budget.py, calc/T-1.7d/mass_budget.py   # как станция входит в массу машины 4942,65 кг
methods:
  - "Ведомость: восстановить станцию построчно (T-1.6 round 2 + строки T-2.6), сверить сумму с массой машины 4942,65 + 76,23 кг; расхождение > 1 кг — объяснить. Каждая мера — построчная Δм без двойного счёта (одна строка T-1.6 снимается не более одного раза)."
  - "Тепловой баланс для эталона T-2.6 (номинал и неблагоприятное сочетание, calc/T-2.6 selected / selected_sensitivity.combined): источники тепла по методике calc/T-1.6/heat_balance.py, пересчитанные к средней мощности на валу T-2.6 (27,8…28,1 кВт); требуемая холодопроизводительность — по правилу T-1.6 (heat_factor × максимум тепла, не ниже 25 кВт D-OP-09) при воздухе +40 °C, масле на входе ≤ 55 °C, каталожном допуске и загрязнении −15 %. Новый охладитель (если меняется) — по каталожной точке и кривой с url; мощность вентиляторов в установленной ≤ 34,2 кВт."
  - "Бак: объём масла обосновать не правилом «3…5 × Q», а расчётом: (а) колебание уровня за цикл и при отключении (дифференциальные объёмы ГЦ, ГА, заполнение ZSF/бака наполнения), (б) время пребывания и деаэрация на возврате (нормы с источником: ISO 4413, руководства Rexroth/Parker/HYDAC по бакам; при малом объёме — перегородки, сетка деаэрации, диффузор), (в) минимальный уровень над всасом без вихреобразования, (г) нестационарный нагрев: время прогрева и рост температуры за 10 мин при охладителе на пределе загрязнения. Подпор бака наполнения 0,45 бар без контакта масла с газом (D-GK-02) сохраняется."
  - "Конструкция бака и рамы: толщина листа и рёбра по гидростатике, транспортировке и подъёму (нагрузки и метод с источником); вариант «бак как основание» — жёсткость под мотор-насос (соосность муфты по каталогу), опоры. Габарит станции не больше действующего; C-ENV-01 не ухудшается."
  - "Мотор: только 30 кВт S1, та же частота вращения и класс IE не ниже, IP и монтаж совместимы с колоколом A4VSO180; каталог с массой и url. Насос A4VSO180 и его регулятор не меняются."
  - "Блоки, картриджи, ГА, трассы: только замены без изменения функции, номиналов, расходов и потерь давления в модели T-2.6 (DB_to_cartridges — с пометкой о динамической квалификации 315 бар; общие блоки — по размерному эскизу, не по геометрической оценке). Если мера меняет потери давления или объёмы в линиях — перезапустить эталон T-2.6 (копия в calc/T-2.5/cycle/) и показать: номинал ≤ 5,904 с, RMS ≤ 29,987 кВт, неблагоприятное сочетание не хуже 6,193 с."
  - "Итог: design/hydraulics/station.t25.yaml (полный, самодостаточный: состав станции построчно с массой и источником, бак, масло, охладитель, мотор, рама, блоки, тепловой баланс), таблица мер, проект D-GK в report.md (ГК вносит сам)."
deliverables:
  - calc/T-2.5/                            # inventory.py, heat.py, tank.py, mass.py, cycle/ (если перезапуск), sources.yaml, results.json; ≤ 5 МБ
  - design/hydraulics/station.t25.yaml
  - report.md
  - metrics.json                           # station_base_kg, station_t25_kg, reduction_kg, machine_A_kg_range, heat_nominal_kW, heat_adverse_kW, cooling_required_kW, cooling_dirty_kW, oil_volume_L, cycle_nominal_s, rms_kW
  - self_check.json
  - gates.t25.json
acceptance:
  - "облегчение станции ≥ 170 кг (цель ≥ 230 кг) построчно с источниками, без двойного счёта; база сверена с 4942,65 + 76,23 кг"
  - "охлаждение не хуже T-1.6: холодопроизводительность с допуском и загрязнением ≥ требуемой по теплу эталона T-2.6 (не ниже 26,43 кВт и не ниже 25 кВт D-OP-09), воздух +40 °C, масло ≤ 55 °C; установленная ≤ 34,2 кВт"
  - "объём бака обоснован расчётом (уровень, деаэрация, всас, прогрев) с источниками; подпор бака наполнения сохранён"
  - "функция гидравлики T-2.6 не изменена: схема, насос, клапаны и расходы те же; эталон цикла номинал ≤ 5,904 с, RMS ≤ 29,987 кВт (перезапуск, если меры касаются потерь или объёмов)"
  - "гейты G-PFACE, G-DOSE PASS (REV_PYTHON ops/gates/calc_gates.py --params calc/T-2.6/params/params.t26a.yaml --criteria ops/criteria/design_criteria.yaml --out <worktree>/gates.t25.json); G-CYCLE — справочно (D-GK-13 / D-OP-16)"
  - "свойства и каталожные данные — sources.yaml с url; self_check: двойной прогон даёт одинаковые results.json и design/hydraulics/station.t25.yaml; report.md пишется из Python в UTF-8 и проверяется чтением на отсутствие «?»; временные каталоги удалить"
allowed_paths: [calc/T-2.5/**, design/hydraulics/station.t25.yaml, report.md, metrics.json, self_check.json, gates.t25.json]
forbidden: [git commit, git push, изменение ops/**, изменение существующих design/*.yaml и design/hydraulics/T-1.*, изменение docs/**, изменение calc/** кроме calc/T-2.5/**, сеть из shell, выдуманные свойства, массы и коэффициенты, водомасляный охладитель в базовом исполнении (D-OP-09 — только опция), мотор ≠ 30 кВт S1, насос другого типоразмера или регулятора, изменение функции схемы T-2.6, установленная > 34,2 кВт, изменение силовой части машины (камера, рама, главный цилиндр, задняя крышка — D-OP-19), изменение критериев]
gates: [G-PFACE, G-DOSE]
gate_inputs: {params: calc/T-2.6/params/params.t26a.yaml}
timebox_min: 150
stop_and_ask_if:
  - "тепло эталона T-2.6 требует холодопроизводительности больше, чем даёт исполнение T-1.6 (2 × ASA0567, 26,49 кВт) — охлаждение уже не замыкается до облегчения"
  - "без изменения функции T-2.6, мотора 30 кВт S1 и воздушного охлаждения облегчение < 170 кг — вернуть ранжированный перечень мер с Δм и перечень мер, требующих решения оператора (водяное охлаждение, иной насос, задняя крышка и т. п.), с их Δм"
  - "минимальный объём бака по уровню или деаэрации больше действующего — бак не облегчается, доложить"
  - "ключевая замена (мотор, охладитель) не подтверждается каталогом с массой и характеристикой — не принимать в итог, доложить"
