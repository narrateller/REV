id: T-1.2b
stage: S1-tech
role: TECH
backend: voh            # резерв: alm, bos (запуск строго по одному — песочница Windows)
effort: high
objective: >
  Закрыть развилку восприятия бокового давления брикета на башмак подпрессовки (T-1.2, дефект ВЫСОКИЙ): в геометрии T-1.2
  брикет допрессовывается под окном (x 136…205 мм), и на нижнюю плоскость башмака действует ≈0,66 МН (base) / 0,79 МН (high)
  при 1,52 МН, а цилиндр подпрессовки Ø125 при 300 бар держит 0,33–0,37 МН. Одно сравнительное исследование вариантов,
  одна рекомендация; решение записывает ГК (запись D). Вместе с этим — перебег выталкивания с учётом толщины шибера и
  осевого восстановления брикета.
inputs:
  - DECISIONS.md                           # D0, D-OP-06 (номинал 1,52 МН, расчёт на 300 бар / 1,70 МН)
  - ops/criteria/design_criteria.yaml      # v2: C-PROD-01..03, C-PERF-01, C-PFACE-01, C-HYD-01, C-ENV-01
  - ops/reports/T-1.2/GK_review.md         # что принято, дефекты 1–6
  - ops/reports/T-1.2/report.md            # ось-схема, координаты окна, башмака, шибера
  - calc/T-1.2/results.json                # геометрия, силы, цикл
  - calc/T-1.2/geometry.py                 # только читать
  - calc/T-1.2/x1_calc.py                  # модель цикла: только читать; для прогона — копия в calc/T-1.2b/
  - design/params.t12.yaml                 # диагностический кандидат T-1.2 (только читать)
  - calc/T-1.1/curve.yaml                  # p(ρ), K, μ, springback {low, base, high}
methods:
  - "Нагрузка на башмак: распределение бокового давления σ_x = K·p(x) вдоль брикета по Янссену (K, μ из curve.yaml, low/base/high) в положении конца прессования при 1,52 МН и при резерве 1,70 МН (300 бар). Сила и момент на башмак, точка приложения; то же в момент начала выталкивания (шибер открыт). Сверить с оценкой T-1.2/Opus (0,66 / 0,79 МН) — расхождение объяснить."
  - "Варианты (не больше 4, одна таблица): (A) механический замок башмака в нижнем положении (клин/засов/поворотные упоры) — силы в замке, контактные давления, время запирания/отпирания, износ, отказ; (B) рабочий участок за окном: пуансон выталкивает подпрессованную дозу из-под окна в закрытый участок камеры до шибера, прессование только там — новая ось-схема, длина камеры, главный ход, сопротивление проталкиванию; (C) удержание башмака гидравликой: Ø цилиндра подпрессовки/плунжер при ≤ 300 бар или гидрозамок с давлением запирания (сравнить с C-HYD-01; > 300 бар в полости — не допускается без обоснования); (D) иной вариант, если найдёшь лучше (например, окно сбоку/сверху со смещённым башмаком), с обоснованием."
  - "Для каждого варианта: главный ход и установленный, длина корпуса, ход и Ø подпрессовки, добавка к циклу по копии x1_calc.py (перекрытие + аккумулятор 5 л, Q 360; парковка подпрессовки по дозе — ход 257 мм для 0,83 кг при 90 кг/м³; base; сброс 0,50 и 0,64 с), масса и габарит узла оценочно, риски (заклинивание, износ, налипание, утечки), влияние на C-ENV-01."
  - "Перебег выталкивания: брикет должен полностью выйти из плоскости шибера до его закрытия. Перебег ≥ толщина плиты шибера (оценить по изгибу от 1,70 МН на пролёте 150 × 60 при допустимом напряжении и прогибе — дать толщину и материал) + осевое восстановление брикета после выхода (из springback curve.yaml, 0,83 и 1,068 кг) + зазор. Альтернатива — отвод брикета толкателем/лотком; сравнить по ходу и циклу."
  - "Рекомендация: один вариант по критериям — цикл (≤ 6,0 с с запасом), надёжность, простота, масса. Если ни один вариант не даёт цикл ≤ 6,0 с при Q 360 — указать остаток и что нужно от T-1.4."
  - "Кандидат design/params.t12b.yaml для рекомендованного варианта (генератор calc/T-1.2b/make_params_t12b.py на основе calc/T-1.2/make_params_t12.py). Фазы последовательные, как в T-1.2 (гейт не умеет перекрытие — известный пробел, T-0.3b)."
deliverables:
  - calc/T-1.2b/shoe_load.py
  - calc/T-1.2b/x1_calc.py           # копия с правками входов
  - calc/T-1.2b/make_params_t12b.py
  - calc/T-1.2b/results.json
  - design/params.t12b.yaml
  - report.md                        # таблица вариантов, ось-схема рекомендованного, перебег и шибер, вывод
  - metrics.json
  - self_check.json
  - gates.t12b.json
acceptance:
  - "гейты на design/params.t12b.yaml: G-PFACE PASS, G-DOSE PASS; G-CYCLE — значение показать (последовательная модель), без подгонки (запуск: REV_PYTHON ops/gates/calc_gates.py --params design/params.t12b.yaml --criteria ops/criteria/design_criteria.yaml --out <worktree>/gates.t12b.json)"
  - "сила на башмак пересчитана для low/base/high и для 1,52 / 1,70 МН; числа прослеживаются до curve.yaml или помечены допущением"
  - "в таблице вариантов для каждого — добавка к циклу, рассчитанная моделью, а не оценкой"
  - "толщина шибера получена расчётом (изгиб + прогиб), не принята"
  - "self_check: двойной прогон даёт побайтно одинаковые results.json и params.t12b.yaml"
allowed_paths: [calc/T-1.2b/**, design/params.t12b.yaml, report.md, metrics.json, self_check.json, gates.t12b.json]
forbidden: [git commit, git push, изменение ops/**, изменение design/params.m1.yaml, design/params.t12.yaml, design/params.schema.yaml, изменение docs/**, изменение calc/M-1/**, calc/X-1/**, calc/T-1.1/**, calc/T-1.2/**, сеть, CAD]
gates: [G-PFACE, G-DOSE, G-CYCLE]
gate_inputs: {params: design/params.t12b.yaml}
timebox_min: 120
stop_and_ask_if:
  - "ни один вариант не держит боковую нагрузку при 1,70 МН без давления > 300 бар или без нарушения C-ENV-01"
  - "рекомендованный вариант увеличивает цикл больше чем на 0,6 с против T-1.2 с парковкой по дозе"
  - "нужно поле, которого нет в design/params.schema.yaml — перечисли, схему не меняй"
