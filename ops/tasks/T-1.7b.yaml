id: T-1.7b
stage: S1-str
role: FEA
backend: voh            # резерв: alm, bos (запуск строго по одному — песочница Windows)
effort: high
web_search: true        # уплотнения, расточка/хонингование крупных отливок, материалы (поиск на стороне модели; shell без сети)
objective: >
  Вернуть запас по массе перед D1 (сейчас машина 4972,4 кг при пределе 5000, T-1.7) без потери прочности, ресурса и цикла.
  (A) Одно сравнительное исследование: текущая схема «литая траверса + отдельный главный цилиндр с задней крышкой» против
  «задняя крышка ГЦ = силовая траверса» (гильза опирается/центрируется прямо в литом торце). Выбор одного — проект записи D.
  (B) Узел передачи силы прессования от шибера к торцу камеры (замечание M2 T-1.7): шибер 38 мм (D-GK-01), упоры/башмак
  между ними, опорные пятна 2 × 82 × 180 мм на вставку — изгиб, смятие, жёсткость, масса. Цель машины ≤ 4850 кг (резерв 3 %),
  ориентир 4750.
inputs:
  - DECISIONS.md                           # D-OP-06, D-OP-08, D-GK-01 (шибер 38 мм), D-GK-02
  - ops/criteria/design_criteria.yaml      # v3: C-STR-01, C-FAT-01, C-CLR-01, C-MASS-01, C-ENV-01, C-HYD-01
  - ops/reports/T-1.7/GK_review.md         # M1–M4, L1–L4 — главный вход
  - ops/reports/T-1.7/report.md, design/frame.t17.yaml, calc/T-1.7/   # модель FEA (только читать; копия в calc/T-1.7b/)
  - ops/reports/T-1.6/GK_review.md, design/cylinders.t16.yaml, design/hydraulics/T-1.6_circuit.yaml   # ГЦ, порты в крышках, ZSF
  - ops/reports/T-1.2b/GK_review.md, calc/T-1.2b/results.json        # шибер, засовы, силы
  - calc/T-1.6/mass_budget.py, calc/T-1.7/mass_budget.py
methods:
  - "Скопировать модель T-1.7 (gmsh + CalculiX ccx, E:/Tools/FreeCAD-1.1/bin) в calc/T-1.7b/; изменения против неё перечислить. Методика FKM/VDI 2230/C-CLR-01 — как принята в круге 2 T-1.7 (k_D 15, n_σ, M_σ литья, j 1,5 · j_G 1,25, SRSS по одной оси), без ослаблений."
  - "(A) Исполнение «крышка = траверса»: гильза Ø352 центрируется и уплотняется в литом торце (или во вставке/стакане из кованой стали — сравнить), поршневая полость — внутри торца; порты MA, ZSF NG100 и датчики — в торце (из T-1.6: порты только в крышках, скорости всасывания ≤ по T-1.4b). Проверить: давление 315 бар в полости торца (C-STR-01, C-HYD-01), усталость перехода гильза–торец и кромок портов при пульсирующем давлении 0 → 300 бар и силе 0 → 1,70 МН, 10⁷ (FEA, управляющие точки со сходимостью); пористость литья под давлением масла (требования UT/MT/пропитка или стальной стакан); замена уплотнений поршня/штока — порядок разборки, время, оснастка (сравнить с текущей схемой); механообработка (расточка/хонингование в отливке ~400–500 кг). Масса и длина вдоль оси (C-ENV-01)."
  - "(B) Путь силы шибер → торец камеры: определить по геометрии T-1.2b/T-1.7 фактическую схему (плита шибера 38 мм на пролёте между опорами, упоры/башмак, вставка 34CrNiMo6+QT 55 мм). Изгиб и срез плиты шибера и опор при 1,94 МН (C-STR-01) и 0 → 1,70 МН (C-FAT-01), смятие пятен, прогиб (влияние на длину брикета и плотность — порядок), контакт с трением 0,15 и отрывом (CalculiX *CONTACT PAIR) хотя бы для итогового варианта. Если 38 мм недостаточно — минимальное изменение (толщина, опора по контуру окна, рёбра/упор в раме), массу шибера и его привода (Ø80/45, 0,6 м/с, рампы) пересчитать; влияние на цикл — копией модели T-1.4b, гейт на params.t14b."
  - "Масса: таблица «узел | T-1.7 | T-1.7b | источник» для всей машины (строки T-1.6 + рама T-1.7 + изменения); отдельной строкой — неопределённость (станция ±5 %, литьё припуски, оценочные статьи 345 кг)."
  - "Итог (A): таблица «исполнение | масса | статика | усталость | обслуживание | изготовление/цена (качественно) | риск», рекомендованное и текст проекта решения D-GK-03 в report.md (ГК вносит сам). Не вести обе схемы дальше: выбранное — в design/frame.t17b.yaml (+ design/cylinders.t17b.yaml, если ГЦ меняется)."
deliverables:
  - calc/T-1.7b/                            # копия модели, (A) и (B), mass_budget.py, sources.yaml, results.json; fea/ только входы без сеток, .geo, сводки .json; ≤ 5 МБ
  - design/frame.t17b.yaml
  - design/cylinders.t17b.yaml              # только если выбран вариант «крышка = траверса» или меняется ГЦ
  - design/slide_gate.t17b.yaml             # шибер, опоры, вставка: размеры, материал, массы, силы
  - report.md                               # сравнение (A), путь силы (B), масса машины, проект D-GK-03, что на G-FEA/стенд
  - metrics.json
  - self_check.json
  - gates.t17b.json
acceptance:
  - "выбранное (A) и узел (B): C-STR-01 ≥ 1,5 при 1,94 МН и 315 бар; C-FAT-01 ≥ 1,0 (0 → 1,70 МН / 0 → 300 бар, 10⁷) в управляющих точках со сходимостью < 5 % на трёх сетках; C-CLR-01 ≤ 0,15 мм с указанием баз направляющих (M1 T-1.7)"
  - "масса машины с источником каждой строки и неопределённостью; цель ≤ 4850 кг — PASS/FAIL"
  - "гейты G-PFACE, G-DOSE, G-CYCLE PASS (REV_PYTHON ops/gates/calc_gates.py --params design/params.t14b.yaml --criteria ops/criteria/design_criteria.yaml --out <worktree>/gates.t17b.json); если меняется шибер — эталон цикла копией T-1.4b, |Δцикл| ≤ 0,05 с"
  - "каталожные величины и свойства материалов — sources.yaml с url и местом чтения; self_check: двойной прогон даёт одинаковые results.json и design/*.t17b.yaml (числа FEA — допуск 1e-6, указать)"
  - "все файлы в worktree читаются обычным пользователем (без запрещающих ACL)"
allowed_paths: [calc/T-1.7b/**, design/frame.t17b.yaml, design/cylinders.t17b.yaml, design/slide_gate.t17b.yaml, report.md, metrics.json, self_check.json, gates.t17b.json]
forbidden: [git commit, git push, изменение ops/**, изменение design/params.*.yaml, изменение существующих design/*.yaml и design/hydraulics/**, изменение docs/**, изменение calc/** кроме calc/T-1.7b/**, сеть из shell, выдуманные свойства материалов и каталожные данные, CAD-модель изделия, запись в DECISIONS.md]
gates: [G-PFACE, G-DOSE, G-CYCLE]
gate_inputs: {params: design/params.t14b.yaml}
timebox_min: 180
stop_and_ask_if:
  - "масса машины > 5000 кг при выбранном исполнении с исправленным узлом шибера — покажи остаток"
  - "вариант «крышка = траверса» требует изменить Ø280/200, ход или наполнительный клапан"
  - "исправление узла шибера ухудшает цикл > 0,05 с или требует изменить окно/камеру"
