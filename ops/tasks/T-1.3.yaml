id: T-1.3
stage: S1-hyd
role: HYD
backend: voh            # резерв: alm, bos (запуск строго по одному — песочница Windows)
effort: high
web_search: true        # каталоги цилиндров, уплотнений, стандарты (поиск на стороне модели; shell без сети)
objective: >
  Физическая спецификация всех гидроцилиндров схемы D0 / D-GK-01 / D-GK-02 при рабочем давлении ≤ 300 бар и
  предохранительном 315 бар (C-HYD-01): главный Ø280/200 с наполнительным клапаном, два цилиндра быстрого хода Ø90/50,
  цилиндр подпрессовки (Ø125/56 против Ø100/56), цилиндр шибера, привод засовов (кулачок от штока подпрессовки).
  Силы, площади, давления, скорости, расходы, устойчивость штоков, прочность гильз и штоков по C-STR-01, демпфирование,
  уплотнения, массы. Итог — design/cylinders.t13.yaml (физическая геометрия) и подтверждение, что цикл и гейты не ухудшены.
inputs:
  - DECISIONS.md                           # D0, D-OP-06 (300 бар резерв, 1,70 МН), D-GK-01 (засовы, шибер 38 мм, перебег 59), D-GK-02 (V2, скорости)
  - ops/criteria/design_criteria.yaml      # v3: C-HYD-01, C-STR-01 (запас ≥ 1,5 по текучести при силе на уставке клапана), C-FAT-01 (10⁷), C-PFACE-01, C-MASS-01, C-ENV-01
  - ops/reports/T-1.2/GK_review.md, ops/reports/T-1.2b/GK_review.md, ops/reports/T-1.4b/GK_review.md
  - calc/T-1.2/results.json, calc/T-1.2b/results.json   # силы подпрессовки (33/114/148 кН; high, верхняя доза), нагрузка на башмак, засовы, шибер
  - calc/T-1.4b/                           # модель привода и цикла V2 (только читать; для прогона — копия в calc/T-1.3/)
  - design/params.t14b.yaml                # ЭКВИВАЛЕНТ для гейта, не геометрия (шток 232,6 синтетический)
methods:
  - "Для каждого цилиндра одна строка таблицы: назначение, Ø поршня/штока, ход рабочий/установленный, n, площади, сила толкания/втягивания при рабочем давлении фазы и при 300/315 бар, требуемая сила с запасом (источник), скорость и расход по D-GK-02, давление в полости при торможении."
  - "Главный цилиндр Ø280/200, ход 289 (рабочий 264): сила 1,52 МН при ≈268 бар, 1,70 МН при 300; гильза — толщина стенки по давлению 315 бар с C-STR-01 (≥ 1,5 к Rp0,2 по эквивалентному напряжению, Ламе), крышки и крепление (фланец/стяжки — принцип; детальную раму не проектировать); шток Ø200 — устойчивость при выталкивании и прессовании (Эйлер/Джонсон, схема заделки по компоновке), почему Ø200 (регенерация, площадь кольца для возврата 0,35 м/с, наполнение). Если Ø200 избыточен или мал — показать альтернативу и влияние на цикл моделью."
  - "Цилиндры быстрого хода 2 × Ø90/50: силы при подводе/выталкивании/возврате (сопротивление выталкиванию 100 кН по X-1, трение, разгон 400 кг траверсы с пуансоном), переход на главную полость при 80 кН, устойчивость штоков при полном выдвижении."
  - "Подпрессовка: Ø125/56 против Ø100/56 — сила на верхней дозе high 148–160 кН с запасом ×2 (T-1.2), нагрузка от кулачка засовов, удержание при боковом давлении (засовы несут нагрузку — цилиндр её не держит; проверить, что при отказе засова давление в полости не превышает 315 бар или полость защищена клапаном); ход 380/392; влияние Ø на цикл (модель T-1.4b копией). Выбрать один."
  - "Шибер: сила открытия после сброса с учётом остаточного трения плиты 38 мм (оценка из T-1.2b) и защемления, разгон 45 кг до 0,6 м/с, демпфирование в конце хода 75 мм; Ø по 300 бар."
  - "Засовы: усилие кулачка 15,6 кН (T-1.2b) — проверка, что цилиндр подпрессовки его даёт с запасом; датчики положения."
  - "Демпфирование: торможение в концах хода (встроенные дроссели/пропорциональное торможение по D-GK-02, рампы 5/20 м/с²), давление в демпфере ≤ 315 бар."
  - "Уплотнения и скорость: допустимые скорости и давления выбранных типов (каталог, url), ресурс; материалы гильзы и штока, покрытие (хром/HVOF) — по каталогу или стандарту."
  - "Массы цилиндров (оценка) — в бюджет C-MASS-01."
  - "Если хоть один размер меняется против D-GK-02 (площади, ходы), перегенерировать эквивалент design/params.t13.yaml копией генератора T-1.4b и прогнать эталон цикла и гейты; если не меняется — указать, что params.t14b.yaml остаётся в силе."
deliverables:
  - calc/T-1.3/cylinders.py
  - calc/T-1.3/sources.yaml
  - calc/T-1.3/results.json
  - design/cylinders.t13.yaml       # физическая геометрия цилиндров (НЕ схема params): id, назначение, bore, rod, stroke, n, крепление, давление расчётное, материал, масса
  - design/params.t13.yaml          # только если размеры изменились (см. methods)
  - report.md
  - metrics.json
  - self_check.json
  - gates.t13.json
acceptance:
  - "для каждого цилиндра: запас по C-STR-01 ≥ 1,5 при 315 бар (гильза, шток, крышка), устойчивость штока с коэффициентом ≥ 3,5 по Эйлеру (или Джонсону — обосновать)"
  - "все силы прослеживаются до расчётов T-1.2/T-1.2b/T-1.4b или помечены допущением с обоснованием"
  - "гейты: G-PFACE и G-DOSE PASS; G-CYCLE PASS на design/params.t13.yaml или (если размеры не менялись) на design/params.t14b.yaml (REV_PYTHON ops/gates/calc_gates.py --params <...> --criteria ops/criteria/design_criteria.yaml --out <worktree>/gates.t13.json)"
  - "C-FAT-01: для штока главного цилиндра и резьбы штока — оценка усталости при пульсирующей нагрузке 0 → 1,52 МН, 10⁷ циклов (метод и запас); остальные — список на G-FEA"
  - "self_check: двойной прогон даёт побайтно одинаковые results.json и cylinders.t13.yaml"
allowed_paths: [calc/T-1.3/**, design/cylinders.t13.yaml, design/params.t13.yaml, report.md, metrics.json, self_check.json, gates.t13.json]
forbidden: [git commit, git push, изменение ops/**, изменение design/params.*.yaml кроме params.t13.yaml, изменение docs/**, изменение calc/** кроме calc/T-1.3/**, сеть из shell, выдуманные каталожные данные, CAD]
gates: [G-PFACE, G-DOSE, G-CYCLE]
gate_inputs: {params: design/params.t14b.yaml}
timebox_min: 120
stop_and_ask_if:
  - "главный цилиндр Ø280 не даёт 1,52 МН при ≤ 270 бар с учётом потерь или не проходит C-STR-01 при разумной толщине стенки (≤ 70 мм)"
  - "смена любого Ø ухудшает эталонный цикл больше чем на 0,1 с"
