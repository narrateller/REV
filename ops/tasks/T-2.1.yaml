id: T-2.1
stage: S2-hyd
role: HYD
backend: alm            # voh — лимит до 01.12; резерв bos (запуск строго по одному — песочница Windows)
effort: high
web_search: true        # каталоги насосов, регуляторов, частотных приводов, охладителей (поиск на стороне модели; shell без сети)
objective: >
  Выбор главного насосного агрегата по D-OP-12 (двигатель 30 кВт S1, D-OP-07 без изменений): одно сравнительное
  исследование PV180 FDV (база D-GK-02) против агрегатов меньших холостых потерь. Цель — восстановить запасы:
  RMS на валу ≤ 29,0 кВт (сейчас 29,88), тепло в масло ≤ 19 кВт (сейчас 21,1), охладитель с запасом ≥ 15 % на
  загрязнение (D-OP-09), установленная ≤ 34,2 кВт, при цикле ≤ 6,0 с (G-CYCLE ≤ 5,95 с, пессимистичный эталон ≤ 6,0 с)
  на действующей геометрии D-GK-05. Попутно — масса гидростанции (самый тяжёлый узел, 1655 кг) и её снижение.
inputs:
  - DECISIONS.md                           # D-GK-02, D-GK-05, D-OP-07, D-OP-09, D-OP-10, D-OP-12, D1
  - ops/criteria/design_criteria.yaml      # v4
  - ops/reports/D1/D1_package.md
  - ops/reports/T-1.6/GK_review.md, ops/reports/T-1.6/report.md   # RMS, тепло, охладитель, масса станции
  - ops/reports/T-1.7d/GK_review.md, ops/reports/T-1.7d/report.md # действующий цикл, подпитка шибера от ГА
  - calc/T-1.7d/cycle/, design/params.t17d.yaml                    # действующий эталон цикла и эквивалент гейта (только читать; копия в calc/T-2.1/)
  - calc/T-1.6/ (heat_balance.py, power_review.py, mass_budget.py, sources.yaml), design/hydraulics/T-1.6_circuit.yaml   # только читать
  - ops/reports/T-0.3b/GK_review.md        # правила применения гейта
methods:
  - "Кандидаты (каждый — по каталогу с url и местом чтения; не из памяти): (1) база PV180 FDV + внешний регулятор 36 кВт; (2) аксиально-поршневой насос того же класса с меньшими потерями на нулевой подаче и низким давлением ожидания (например A4VSO/A10VSO с DFR/LR, Parker PV с другим регулятором — что найдётся с читаемой характеристикой холостых потерь); (3) регулируемый по скорости привод: двигатель 30 кВт с преобразователем частоты (или серводвигатель) + насос (переменная/постоянная подача), с остановом/снижением скорости в паузах; (4) при необходимости — разгрузка насоса на выдержке и в паузах (разгрузочный клапан, давление ожидания) для базы. Не больше четырёх; каждый — одной строкой с причиной включения."
  - "Для каждого: Q(p) и мощность на валу по каталогу при 0–300 бар, потери на нулевой подаче/ожидании, КПД объёмный и механический на рабочих точках, время перекладки/разгона (для частотного привода — динамика разгона двигателя и насоса, момент инерции, пусковой ток, нагрев двигателя S1 по RMS с учётом преобразователя), шум, масса агрегата, цена-класс (относительно, без покупок)."
  - "Цикл: копия эталона calc/T-1.7d/cycle → calc/T-2.1/cycle; изменения — только модель насоса/привода, каждое описано. Base и high, 90 и 160 кг/м³, подача дозы 0,64 с; реалистичный и пессимистичный наборы; остаток на шибере 100 и 110 кН. Шаг ≤ 2,5 мс со сходимостью."
  - "Мощность и тепло: средняя, RMS, пик на валу (D-OP-07), тепло в масло по фазам, охладитель (2 × ASA или меньше) с запасом ≥ 15 % при +40 °C / 55 °C; установленная мощность с разбивкой (двигатель, охладитель, пилот, электрика) ≤ 34,2 кВт."
  - "Станция: объём бака (обоснование как в T-1.5), масса агрегата, бака, масла, охладителей, рамы станции; что даёт выбранный кандидат против 1655 кг."
  - "Гейт: design/params.t21.yaml генератором копии (как params.t17d), drive.peak_kW / idle_kW / eta по выбранному кандидату с источником; если частотный привод не описывается схемой params — эквивалентом (idle_kW в паузах, peak_kW) с явным указанием, что упрощено и в какую сторону; поля схемы не добавлять."
  - "Итог: таблица «кандидат | RMS | пик | тепло | охладитель, запас | цикл эталон/песс./гейт | масса станции | установленная | риск»; выбрать один; проект изменения D-GK-02 в report.md (ГК вносит сам); требования к гидросхеме (что меняется против T-1.6_circuit.yaml) списком, файлы гидравлики не менять."
deliverables:
  - calc/T-2.1/                            # pumps.py, cycle/, heat.py, station_mass.py, sources.yaml, results.json
  - design/params.t21.yaml
  - report.md
  - metrics.json
  - self_check.json
  - gates.t21.json
acceptance:
  - "выбранный кандидат: RMS ≤ 29,0 кВт, пик ≤ 40 кВт на валу, средняя ≤ 30; тепло ≤ 19 кВт или охладитель с запасом ≥ 15 % — показать оба; установленная ≤ 34,2 кВт"
  - "цикл: эталон реалистичный ≤ 5,85 с, пессимистичный ≤ 6,0 с (остаток 100 кН); G-CYCLE ≤ 5,95 с; |G-CYCLE − эталон| объяснён по фазам"
  - "гейты G-PFACE, G-DOSE, G-CYCLE PASS (REV_PYTHON ops/gates/calc_gates.py --params design/params.t21.yaml --criteria ops/criteria/design_criteria.yaml --out <worktree>/gates.t21.json)"
  - "каждая каталожная величина — sources.yaml с url и местом чтения; self_check: двойной прогон даёт побайтно одинаковые results.json и params.t21.yaml"
  - "все файлы в worktree читаются обычным пользователем"
allowed_paths: [calc/T-2.1/**, design/params.t21.yaml, report.md, metrics.json, self_check.json, gates.t21.json]
forbidden: [git commit, git push, изменение ops/**, изменение существующих design/*.yaml и design/hydraulics/**, изменение docs/**, изменение calc/** кроме calc/T-2.1/**, сеть из shell, выдуманные каталожные данные, изменение двигателя > 30 кВт, изменение геометрии цилиндров и рамы, запись в DECISIONS.md, CAD]
gates: [G-PFACE, G-DOSE, G-CYCLE]
gate_inputs: {params: design/params.t17d.yaml}
timebox_min: 150
stop_and_ask_if:
  - "ни один кандидат не даёт RMS ≤ 29,0 кВт при цикле ≤ 6,0 с — покажи лучший"
  - "лучший кандидат требует установленной > 34,2 кВт или двигателя > 30 кВт"
  - "нужно поле, которого нет в design/params.schema.yaml — перечисли, схему не меняй"
