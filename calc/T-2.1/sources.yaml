engineering:
  nominal_shaft_limit_kW: 36
  # DFE1Z: port Z tied to a 20–50 bar reducer on AX. Actuator/valve flow is an
  # unqualified design allowance. Retain entire allowance as an extra packet.
  dfe1z_response_multiplier: {realistic: 1.0, pessimistic: 1.5}
  # 2.5 kW of the common 36 kW are reserved for PX at high main demand.
  dfe1z_main_shaft_limit_kW: 33.5
  dfe1z_extra_pilot_L_per_cycle: 0.10
  dfe1z_spare_pilot_sensitivity_L_per_cycle: 0.05
  dfe1z_adapter_and_regulator_allowance_kg: 7
  rexroth_curve_read_off_sensitivity: {flow_reduction_L_min: 5, shaft_increase_kW: 2}
  vfd:
    min_rpm: 750
    acceleration_and_deceleration_rad_s2: 380
    additional_rotating_inertia_kg_m2: 0.015
    current_pwm_allowance_factor: 1.05
    current_magnetizing_fraction_assumption: 0.30
    neutral_motor_cooling_ratio_floor: 0.50
    cabinet_and_braking_allowance_kg: 5
  evidence:
    - "The D1 geometry, timing and low-pressure accumulator are frozen. The T-1.6 pilot and heat calculations are replayed on T-1.7d traces."
    - "Rexroth p=100 bar time extrapolated at all operating pressures for the screen. External control flow and pump dynamics are acceptance risks."
    - "Partial stroke uses the same affine loss construction as the base. Map scatter, hot oil and interlocks are screened separately from vendor guarantees."
    - "Cooling follows D-OP-09 and T-1.6 (15% curve tolerance, 15% fouling, 25 kW minimum after fouling). The 1.25 T-1.6 sizing factor is printed separately."

