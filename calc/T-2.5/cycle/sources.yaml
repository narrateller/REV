catalogs:
  parker_pvplus:
    manufacturer: Parker Hannifin
    series: PVplus Design 47
    url: https://www.parker.com/content/dam/Parker-com/Literature/PMDE/Catalogs/Piston_Pumps/PV-/MSG30-3245_UK.pdf
    graph_copy_url: https://www.lifcohydraulics.com/SpecFiles/FileManager/50c36d01-65e0-4bb5-15d7-08d859ac4ac6/Lifco-PV-Pumps-Catalog.pdf
    dynamics_copy_url: https://www.parker.com/content/dam/Parker-com/Literature/Germany/CD_Rom-Bauteilfreigabeliste-Mechanik-Hydraulik-UK/MSG30-3245_UK.pdf
    older_pv092_graph_url: https://www.denison.com.tw/Catalog/parker/axialpiston/PVplus/200702-PVplus/Catalog/200702-PV063-HY30-3243.pdf
    where: "MSG30-3245/UK, pp. 5, 26, 32–33, 35–39, 61, 63–65. PV092 deadhead endpoints cross-checked on HY30-3243/UK p. 9."
    reference_speed_rpm: 1500
    continuous_pressure_bar: 350
    min_inlet_absolute_bar: 0.8
    speed_at_1bar_absolute_max_rpm: {PV360: 1750, PV046: 2800, PV270: 1800, PV092: 2300}
    case_drain_max_continuous_bar: 0.5
    fdv_min_pilot_bar: 15
    udm_min_pilot_bar: 25
    pv360_fdv_onstroke_at_50bar_ms: 255
    pv360_fdv_onstroke_at_350bar_ms: 154
    pv360_fdv_destroke_at_50bar_ms: 266
    pv360_fdv_destroke_at_350bar_ms: 183
    response_test: "p. 32: standby to 50/350 bar on-stroke, 50/350 bar to standby de-stroke. Values are for PV360 FDV."
    pq_control_url: https://dev.parker.com/content/dam/Parker-com/Literature/PMDE/Catalogs/Piston_Pumps/PV-/MSG30-3245_UK.pdf
    pq_control_where: "pp. 32–33, 46: FDV has no pressure compensator; PQDXXA-Z10 closes the displacement loop; UDM adds pressure/power control."
    pilot_flow_allowance_L_min: 1.2
    models:
      PV360:
        where: "p. 5 technical data and p. 39, 1500 rpm curves. Mineral ISO VG 22, 32 °C, inlet 1 bar abs. Curve read-offs are approximate."
        displacement_cm3_rev: 360
        mass_kg: 180
        full_stroke_power_at_350bar_kW: 338.7
        full_stroke_power_kW_by_bar: [[0, 5], [50, 45], [100, 95], [150, 140], [200, 185], [250, 230], [300, 275]]
        zero_stroke_power_kW_by_bar: [[0, 4.5], [25, 5.5], [50, 6], [75, 6.5], [100, 7.5], [125, 8.5], [150, 10], [175, 11.5], [200, 13], [225, 14.5], [250, 16], [275, 18], [300, 20], [325, 22.5], [350, 25]]
        volumetric_efficiency_by_bar: [[25, 1.00], [50, 0.99], [100, 0.98], [150, 0.97], [200, 0.965], [250, 0.96], [300, 0.95], [350, 0.945]]
        total_efficiency_by_bar: [[25, 0.71], [50, 0.85], [100, 0.89], [125, 0.905], [175, 0.915], [250, 0.92], [350, 0.915]]
      PV046:
        where: "pp. 5, 35. 1500 rpm, 50 °C, 30 mm²/s for plots. Full-stroke rated power from technical table. Rounded graph efficiency used for delivery."
        displacement_cm3_rev: 46
        mass_kg: 30
        full_stroke_eta_v_at_350bar: 0.94
        full_stroke_power_kW_endpoints: [2, 43.8]
        zero_stroke_power_kW_endpoints: [1, 5]
      PV270:
        where: "pp. 5, 38. 1500 rpm, 50 °C, 30 mm²/s. Use volumetric efficiency instead of the ambiguously scaled flow axis."
        displacement_cm3_rev: 270
        mass_kg: 172
        full_stroke_eta_v_at_350bar: 0.97
        full_stroke_power_kW_endpoints: [10, 259.6]
        zero_stroke_power_kW_endpoints: [5, 25]
      PV092:
        where: "pp. 5, 36 and HY30-3243/UK p. 9. 1500 rpm, 50 °C, 30 mm²/s. Rounded graph flow of 134 L/min at 350 bar."
        displacement_cm3_rev: 92
        full_stroke_eta_v_at_350bar: 0.9710144927536232
        full_stroke_power_kW_endpoints: [2, 87.5]
        zero_stroke_power_kW_endpoints: [2, 11]

      PV180:
        where: "MSG30-3245/UK pp. 5, 37; HY30-3243/UK p. 10 for approximate efficiency/deadhead endpoints. Full-stroke 350 bar endpoint from Design 47 technical table."
        graph_crosscheck_url: https://www.nexinstrument.com/assets/images/pdf/Series%20PV---%20Parker%20Datasheet.pdf
        graph_crosscheck_where: "Parker MSG30-3245/UK, PV180 graph p. 36 in the mirror (p. 37 in the main PDF). Approximate graph readings 3/15 kW for deadhead at 0/350 bar; intermediate values use linear interpolation."
        displacement_cm3_rev: 180
        mass_kg: 90
        full_stroke_eta_v_at_350bar: 0.95
        full_stroke_power_kW_endpoints: [3, 173.1]
        zero_stroke_power_kW_endpoints: [3, 15]

