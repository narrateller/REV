# doi_verified marks the GK Crossref check of 25.11; point verification is separate.
project:
  basis: TASK.md, ops/criteria/design_criteria.yaml, D0 and X-1 report
  dose_kg: 0.83
  width_mm: 150
  height_mm: 60
  feed_length_mm: 200
  target_relaxed_kg_m3: 1000
  nominal_face_MPa: 166.7
  loaded_comparison_kg_m3: 1000
  bulk_kg_m3:
    base: 90
    alternative: 160
  pump_L_min: 360
  accumulator_L: 5
  feed_s: 0.5
  pressure_threshold_bar: 120
  cycle_limit_s: 6
  pressure_limit_bar: 300
  moisture_pct_range:
  - 8
  - 12
assumptions:
  wall_K:
    low: 0.35
    base: 0.45
    high: 0.6
  wall_mu:
    low: 0.23
    base: 0.25
    high: 0.3
  wall_basis: 'Zhong Table 5.1: dry K 0.442–0.464, mu 0.230–0.258; wetter K ~0.35.
    Wilczyński section 2.2 mu 0.25. Wang Fig. 8a fine wood ratio ~0.57 relative to
    backstop, not local K. Low/high are transfer allowances across stress, steel surface
    and moisture, not direct bounds.'
  springback_axial_immediate: 0.23
  springback_area: 0.03
  cycle_axial_recovery_fractions: [0.15, 0.30]
  springback_basis: "Horabik Fig. 3 gives 1396/1144 - 1 = 22.0% axial recovery in the closed mould. The 23% early free recovery is an engineering assumption, allowing one additional percentage point at ejection. The 3% rectangular area growth is transferred from the approximately 2–5% circular area growth in Dhamodaran (Table A1) and Horabik (10.25 vs 10 mm), with constant mass. The Križan Fig. 5 pairs define a monotone piecewise-linear mapping from initial to stabilized density. Average the repeat digitized abscissa at 1140; extrapolate above the last knot with constant absolute density loss. Continued growth is assigned to length for length/cycle reporting. The 15% and 30% cases specify total axial recovery through stabilization."
  zhong_initial_fill_H_over_D: 1
  krizan_loaded_H_over_D: 1
  missing_geometry_basis: Assume D for unreported sample length as order-of-magnitude
    transfer; adjust Zhong length using conservation of reference fill mass. Use 50
    mm external length for Li, shrink it by the axial recovery fraction. For Spirchez
    use Table 1 masses and infer length from measured density.
  heckel_limit_kg_m3: 1511
  heckel_limit_basis: Upper end of Horabik et al. Table 4 solid-phase density; saturation
    is a fit assumption, not a project limit.
  bulk_transition_kg_m3: 400
  bulk_transition_basis: Below 400 kg/m³ use a smooth onset from loose fill. The first positive direct loading point in Zhong is 424 kg/m³. Above the join use a common absolute-density response, consistent with the early convergence described for Horabik Fig. 3.
  envelope_min_density_slope_kg_m3_per_MPa: 0.1
  envelope_basis: "Bounds in punch pressure versus early external density (stabilized observations are mapped using the same paired recovery relation as used in prediction). Include raw face pressures as well as Janssen-transferred pressures. Monotone one-sided interpolation of the measured extrema retains a small positive density slope (0.1 kg/m³/MPa, numerical/shape assumption). Include the base curve and continue beyond the terminal knots with its pressure increment. K and mu for the bounds use their base values. Horabik 1144 is checked at its own in-die unloaded state."
  moisture_sensitivity_basis: "Li Table 1 oak only: linear interpolation in wet early density from 8.9% to 12.7% at the same pressures for 12%. These points enter the envelope only. Moisture endpoints lack a matched species/fraction sweep at 8% and 12%."
  domain_basis: "Use the minimum measured solid-phase density in Horabik Table 4 (beech 1457); the text calls birch 1465 the minimum, but lists neither the lower beech nor oak (1460). Keep the prior pooled-fit ceiling for converted observations at 1396 + 23 kg/m³ and retain higher density observations in the envelope as far as the common calculation domain permits."
