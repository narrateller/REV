status: concept_stop
definition: REV punch-face pressure vs mean bulk density under load; wet mass. Fit
  stress is axial mean.
inputs: sources.yaml
density_domain_kg_m3:
- 90
- 1457
domain_basis: Use the minimum measured solid-phase density in Horabik Table 4 (beech
  1457); the text calls birch 1465 the minimum, but lists neither the lower beech
  nor oak (1460). Keep the prior pooled-fit ceiling for converted observations at
  1396 + 23 kg/m³ and retain higher density observations in the envelope as far as
  the common calculation domain permits.
base_model: power
