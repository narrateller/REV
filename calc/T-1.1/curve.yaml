formula:
  onset: t = clamp((rho-rho_bulk)/(rho_join-rho_bulk), 0, 1); f = t*(2-t); delta =
    max(rho-rho_ref,0)
  rho_ref_kg_m3: 90
  rho_join_kg_m3: 400
  power: p_mean_MPa = scale_MPa * (delta/1000)**exponent * f
  generalized_heckel: p_mean_MPa = scale_MPa * log(1+delta/(rho_limit-rho))**exponent
    * f
  rho_limit_kg_m3: 1511
  janssen: q=4*K*mu*L/Dh; p_mean/p_face=-expm1(-q)/q; p_gate/p_face=exp(-q)
  immediate_density: rho_loaded/((1+springback_axial)*(1+transverse_area_growth))
  stabilized_density: same recovery mapping for conversion and prediction; linear
    interpolation of knots
K:
  low: 0.35
  base: 0.45
  high: 0.6
mu:
  low: 0.23
  base: 0.25
  high: 0.3
wall_values_used_for_curves: base
springback:
  low: 0.23
  base: 0.23
  high: 0.23
transverse_area_growth: 0.03
