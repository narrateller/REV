    are mapped using the same paired recovery relation as used in prediction). Include
    raw face pressures as well as Janssen-transferred pressures. Monotone one-sided
    interpolation of the measured extrema retains a small positive density slope (0.1
    kg/m³/MPa, numerical/shape assumption). Include the base curve and continue beyond
    the terminal knots with its pressure increment. K and mu for the bounds use their
    base values. Horabik 1144 is checked at its own in-die unloaded state.
  min_density_slope_kg_m3_per_MPa: 0.1
