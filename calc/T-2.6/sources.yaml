    component_url: https://boschrexroth.africa/public/front_end/pdfs/products/f22bdb50be8e4bd3925a023acf68d873.pdf
    reference: "Sun regenerative circuits downstream of directional valve. Rexroth RE 21010, LC/LFA NG25 directional cartridges. Check pressure drop, cover variant and command sequence."
