  lp:
    url: https://catalog.hydac.com/item/bladder-accumulators/type-sb-330-bladder-accumulator--standard/3047174
    technology_url: https://www.hydac.com/download/accumulator-technology-product-catalogue-1000443492-en.pdf
    reference: "HYDAC SB330 20 L, 18.4 L effective gas volume. Use inherited settings 28/38/52 bar."
  mp:
