    url: https://store.livhaven.com/uploads/rexroth_pdfs/RE_29406_2021-06.pdf
    reference: "Rexroth RE 29406 (2021-06), pp. 7–10, 32. Linear characteristic L and closed WK with monitor E. The parenthetical flow applies to two opposite maximum-size radial B bores."
    working_max_bar: 420
    rated_drop_bar: 5
    mbt_NG40_L_min: 1800
    mf_NG50_single_B_L_min: 2700
    mf_NG50_double_B_L_min: 3900
    mf_NG63_single_B_L_min: 4500
    mf_NG50_WK_E_kg: 35
