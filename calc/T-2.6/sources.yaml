round2:
  pump_guard:
    url: ../T-2.1/sources.yaml
    hot_reserve_url: ../../DECISIONS.md#d-gk-06
    curve_shaft_uncertainty_kW: 2
    curve_delivery_uncertainty_L_min: 5
    hot_deadhead_reserve_kW: 1.5
    reference: "Worst-direction engineering read-off uncertainty in RE 92050 data in T-2.1, plus allowable hot zero-swash loss from D-GK-06. Apply the entire uncertainty to metered delivery to retain a conservative scalar envelope without using trajectory data."
  suction:
    url: https://www.excellenthydraulics.in/pdf/bosch-rexroth/val/re20478_2017-12.pdf
    gas_url: https://www.btpco.com/download/training/hydraulic%20oil/Rexroth%20Oil%20catalogs/Rexroth%20Mineral%20Oils.pdf
    circuit_url: ../../design/hydraulics/T-1.6_circuit.yaml
    reference: "RE 20478 pp. 6–7 and 15, A→B NG100. Graph edges 0.135 bar at zero and 0.40 at about 1900 L/min. The 1600/0.30 case-2 anchor is an upper design allowance. Linear interpolation on the rising convex curve is conservative in the design interval. RE 90220 §3.1.6 and §2 for dissolved air. Hydrostatic head, Darcy/local and inertial line losses are carried separately. The original 0.8 bar abs floor comes from T-1.3 and is retained as a second check."
    intake_curve_L_min_bar: [[0, 0.135], [1600, 0.30], [1900, 0.40]]
    case_2_flow_L_min: 1600
    ambient_absolute_bar: 1.01325
    regulated_tank_gauge_bar: 0.60
    tank_regulation_band_bar: 0.05
    legacy_tank_gauge_bar: 0.45
    derated_saturation_reserve_bar: 0.02
  oil:
    url: https://www.shell.com.mx/business-customers/lubricants-for-business/factory/tellus-s2-mx/_jcr_content/root/main/section_copy/simple_copy/text.multi.stream/1717497765142/188f844eff57707ae55d1bb69fe76f5984c1286d/tellus-s2-mx-46.pdf
    model_url: https://store.astm.org/d0341-20r25.html
    pump_catalogue_temperature_C: 50
    viscosity_C_mm2_s: [[40, 46], [100, 6.9]]
    hot_C: 55
    reference: "Shell Tellus S2 MX 46, p. 2, ASTM D445. 55 °C is D-OP-09. ASTM D341 viscosity interpolation. Apply first-order laminar leakage scaling to A4VSO catalogue flow deficit; retain catalogue shaft losses. Hot supplier map and combined air/temperature test required."
  adverse:
    url: ../../TASK.md
    valve_s: [0.080, 0.085]
    unload_s: 0.25
    regulator_fraction: 0.95
    rpm: [1465, 1470]
  inventory:
    tf_url: ../T-1.6/sources.yaml
    station_url: ../T-2.1/station_mass.py
    tf_base_shell_membrane_regulator_kg: 30
    tf_base_oil_L: 42
    tf_base_gross_L: 65
    tf_A_gross_L: 80
    cap_dead_volume_L: 0.8
    steel_density_kg_m3: 7850
    steel_density_url: ../T-2.2f/sources.yaml
    tf_shell_mass_method: "Proportional-to-gross-volume allowance from T-1.6; the vessel and membrane are to order."
    mf_block_envelope_mm: [190, 180, 180]
    mf_reference_block_kg: 32
    mf_reference_block_NG63_kg: 63
    mf_block_method: "Double-B casting/blank envelopes RE 29406 page 32, adds space for both Ø70 radial ports. Use gross blank mass for new housing and CB050 as previous single-B housing estimate. Parker mass of the single-port block is a proxy, with fit and CAD to verify."
    parts:
      ZSF: {model: "Rexroth ZSF NG100, without pre-decompression", unit_kg: 15, pressure_bar: 350, ref: zsf, section: existing}
      MF: {model: "Rexroth 2WRCE NG50 2K7L WK E", unit_kg: 35, pressure_bar: 420, ref: wrce, section: existing}
