catalogs:
  steel_34CrNiMo6:
    url: https://metals.ovako.com/tuotteet/erikoisterakset/lastuttavuus/teraslajien-ominaisuudet/nuorrutusterakset/
    location: "34CrNiMo6+QT, d >160–250: Re ≥600 MPa, Rm ≥800 MPa; d >40–100: Re ≥800 MPa."
    limitations: "Для цельнокованого главного узла с высадкой Ø280 требуется договорная гарантия 600/800 МПа и контроль образцов поковки."
  steel_42CrMo4:
    url: https://steelnavigator.ovako.com/steel-grades/42crmo4/
    location: "Mechanical Properties, +QT; минимумы круглого проката зависят от сечения."
    limitations: "Rp0,2 ≥500 МПа задано как требование закупки готовых гильз и крышек после ТО; каталог проката не удостоверяет большие кольцевые и плоские поковки."
  prefill:
    url: https://dc-mkt-prod.cloud.bosch.tech/us/media/products_1/product_groups/goto_products/hydraulics/check_valves/re20478.pdf
    location: "Bosch Rexroth RE 20478, 2017-12, с. 6–8, 13, 15–16, ZSF NG100."
  seal_catalog:
    url: https://www.trelleborg.com/seals/-/media/tss-media-repository/tss_website/pdf-and-other-literature/catalogs/hydraulic_complete_gb_en.pdf
    location: "Hydraulic Seals – Linear, Jan 2025, Glyd Ring T pp. 263–267; Rod Stepseal 2K, Rimseal, Excluder and Slydring product sections."
    limitations: "Максимальные p, v и T в каждом семействе указаны раздельно. Проверить сочетание по фактической щели, жидкости и нагрузочному спектру."
  chrome:
    url: https://www.iso.org/standard/72269.html
    location: "ISO 6158:2018, твёрдый инженерный хром; толщину и подготовку задаёт проект."
  local_relief_reference:
    url: https://store.livhaven.com/uploads/rexroth_pdfs/RE_25802_2021-10.pdf
    location: "Bosch Rexroth RE 25802, 2021-10, DB/DBW NG32 (pilot-operated relief), up to 650 L/min at 350 bar max; text lost to encoding in executor output, restored by GK from catalog title — rating to be re-read in T-1.5."
  rod_fatigue:
    url: https://doi.org/10.1016/j.ijfatigue.2024.108165
    location: "Baumgartner et al., FKM §§4.2.1 и 4.3; оценка по локальным упругим напряжениям."
  thread_fatigue:
    url: https://www.phd.eng.br/wp-content/uploads/2015/12/en.1993-1-9.2005-1.pdf
    location: "EN 1993-1-9:2005, §7.1 Figure 7.1 и Table 8.1 detail 14, FAT50, масштаб резьбы."
  tie_rods:
    url: https://www.iso.org/standard/60610.html
    location: "ISO 898-1, класс 10.9, метрическая резьба."

