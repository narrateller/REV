    paths: [design/slide_gate.t17d.yaml, design/frame.t17d.yaml, design/cylinders.t17d.yaml, design/main_cylinder_rear.t22.yaml, calc/T-2.2b/mass.py, calc/T-2.2d/mass.py, ops/reports/T-2.2/GK_review.md]
