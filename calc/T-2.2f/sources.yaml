    project_accepted_working_bar: 300
    proof_station_centroid_x_mm: 165.2
    skew_project_source: "calc/T-2.2e/sources.yaml, calc/T-2.2e/fea/README.md; перекос 64/36, C переносит эксцентриситет 0,14 × 444 мм на опоры ±270 мм"
