    depth_where: "ISO 18203:2026, Scope и метод определения surface hardening depth (индукция)."
    induction_study_url: https://doi.org/10.3390/met15090970
    induction_study_where: "§3, распределение микротвёрдости и микроструктура 34CrNiMo6. Лабораторный образец подтверждает необходимость профиля; параметры процесса на плоскую плиту не перенесены."
    transition_url: https://www.imorules.com/GUID-C8C59C37-1003-4AA5-8A98-41A978D892D5.html
    transition_where: "Правила Lloyd’s Register для индукционно упрочнённых коленвалов, §4.1 и §4.2.1–2. Основание контролировать зону перехода, остаточное растяжение и испытать пару. Числа для коленвала не перенесены."
    hardness_conversion_url: https://www.iso.org/standard/53810.html
    hardness_conversion_where: "ISO 18265:2013, Scope, пересчёт твёрдости даёт оценку Rm и не заменяет испытание."
    existing_static_screens_MPa: {plate_seat: 480, seat_cast: 390}
    static_bearing_method_url: https://www.dinmedia.de/de/norm/din-6892/393862443
    static_bearing_method_where: "DIN 6892:2025-10, §7, плоские грани шпоночных соединений. Метод используют как аналог для проверок местного смятия и фактического пятна, коэффициенты на шибер не перенесены."
    fretting_original_url: https://researchportal.tuni.fi/files/10868394/Juoksukangas_1472.pdf
    fretting_original_where: "§2.1–2.2, плоские контакты 34CrNiMo6+QT, испытания до 3×10^6, испытательная установка допускает номинальное давление до 300 МПа."
    flat_pair_original_url: https://www.sciencedirect.com/science/article/pii/S0301679X18304523
    flat_pair_original_where: "§2–3, сухие плоские контакты QT, давление 10–50 МПа. Изучены адгезия и выкрашивание при микроскольжении."
    fretting_wear_standard_url: https://store.astm.org/g0204-21.html
    fretting_wear_standard_where: "ASTM G204-21, §1 и §5, контролируемое фреттинг-испытание и объём потери обеих поверхностей. Условия со смазкой и загрязнением требуют адаптации."
    rolling_contact_specific_url: https://www.iso.org/standard/55353.html
    rolling_contact_specific_where: "ISO 6336-5:2016, Scope и §5.2/5.6. Пределы рассчитаны для контакта зубьев и применяются с указанными в стандарте геометрией и методикой."
    pair_fatigue_qualification_url: https://www.iso.org/standard/50242.html
    pair_fatigue_qualification_where: "ISO 12107:2012, статистическое планирование испытаний. Для пары нужны те же сбег, смазка, загрязнение, микроподвижка и цикл давления; испытать обе контактные поверхности до 10^7 с контролем остаточной вмятины, потери толщины, задира и трещин."
    static_pressure_allowance_MPa: null
    fatigue_pressure_allowance_at_1e7_MPa: null
    interpretation: "Обоснованного повышенного допуска для данного плоского контакта с микроподвижкой и древесной пылью не найдено. Сохраняются исходные инженерные экраны; ресурс пары подтверждается отдельно от FKM плиты и кассеты."
  signed_fatigue:
    url: https://doi.org/10.1016/j.ijfatigue.2024.108165
    where: "Рис. 8, формулы (23)–(24), (43)–(46). Для поковки учтено M_sigma по знаку на направлении доминирующей главной амплитуды при полностью сжимающем тензоре средних. Для смешанных знаков и литья остаётся положительная поправка T-1.7."
    implementation: calc/T-1.7d/fea/r2_strength.py
    hardening_fkm_method_url: https://saemobilus.sae.org/papers/analytical-approach-assess-strength-utilization-rate-a-case-hardened-components-based-fkm-guideline-2022-01-1036
    hardening_fkm_where: "Surface and interior assessment. Расчёт слоя и сердцевины раздельно. Коэффициент K_V поверхностного упрочнения равен 1 до квалификации."
  contact_numerics:
    url: https://www.dhondt.de/ccx_2.22.pdf
    where: "§6 Theory Contact, §7 CONTACT PAIR, CONTROLS, FRICTION, SURFACE BEHAVIOR; face-to-face и small-sliding node-to-surface проверены раздельно."
    executed_mesh_threads: "Грубые и уточнённые сетки серии прогнаны с четырьмя потоками CCX. Для воспроизведения задать REV_T17D_CCX_THREADS=4. Повтор для контроля 1e-6 выполнен в одном потоке."
    thin_ligament_boundary: "Поля предзатяжки, силы и эксцентриситетов T-1.7, срез 380 × 250 мм; эксцентриситеты +10 / −10 мм."
  fast_actuation:
    valves_url: https://www.boschrexroth.com/ics/Projects/GenericSelector/?ProductArea=4WRLE-4X&c=tr&language=en
    valves_where: "4WRLE-4X, NG25, 400 л/мин при Δp 5 бар/кромка. Оценка при полном открытии по Q²."
    LP_url: https://www.hydac.com/download/accumulator-technology-product-catalogue-1000443492-en.pdf
    LP_where: "EN 3.000.7, таблица 20 L SB330 3047174, 18,4 л газового объёма. §4.1, расход и заряд."
    LP_catalog_check_url: https://catalog.hydac.com/item/bladder-accumulators/type-sb-330-bladder-accumulator--standard/3047174
    LP_catalog_check_where: "Страница США указывает 240 gpm и 63 кг; в таблице EN дано 49 кг. В принятом бюджете T-1.7c сохранён установленный ГА, массу и исполнение сверить по поставке."
    cushioning_url: https://www.parker.com/content/dam/Parker-com/Literature/Atlas-Cylinder/PDF/HY08-AC1151_HMI.pdf
    cushioning_where: "С. 24, энергия торможения, зависимость от площади и давления подпора; для v > 0,5 м/с требуется проверка специального профиля."
    tail: "T-1.7c; номинальный маркер x ≤ 195 мм из T-1.6. Ранний вариант x ≤ 200 мм оценён как чувствительность, нужен допуск и подтверждение свободного хвоста."
    assumptions:
      axial_tolerance_budget_mm: 1.0
      axial_tolerance_breakdown_mm: {part_axial_size_chain: 0.25, position: 0.25, follow_up_and_stack: 0.50}
      cushioning_peak_factor_assumed: 2.0
      proposed_cushion_supply_max_bar: 175.0
      effective_dust_wear_pair_test: true
