    use: "Bossard, ряд DIN 912 M27: Ø40, высота 27, шестигранник 19, глубина 13,5 мм. Использовано для сравнения массы."
  A_shoulder_Kt:
    url: https://nao3886noda.sakura.ne.jp/thesis/pdf/773.pdf
    use: "Noda, Takase, Monda, 1997, табл. 3: круглое ступенчатое сечение в растяжении. Для 2h/D между 0,10 и 0,20 и 2r/D≥1,0 взята верхняя оценка Kt=1,271. Сбег фактической винтовой линии этим графиком не описан."
  A_root_profile:
    url: https://files.infocentre.io/files/docs_clients/126_2007771838_1256813_ISO%20965-1%20%282013%29.pdf
    use: "ISO 965-1 §11: минимальный радиус впадины 0,125P, для M27×3 это 0,375 мм."
  B_ruling_section:
    url: https://qilusteelgroup.com/wp-content/uploads/2024/02/DIN-EN10083-1.pdf
    normative_reference: "EN 10083-1:2006, приложение A, пп. A.2.1.3 и A.2.2, рис. A.1, стр. 18–19"
    use: "График для прямоугольных сечений, ширина до 360 мм. Диск Ø520 — прочая форма по п. A.2.2: согласовать определяющее сечение с кузницей. Для пакета 160–250 мм использован теплофизический экран, в котором учитываются две торцевые и боковая поверхности."
    table_url: https://asremavad.com/wp-content/uploads/2019/06/DIN-EN-10083-3-2007.pdf
    table_use: "EN 10083-3:2006, табл. 8: 34CrNiMo6+QT, 160 < d ≤ 250 или 100 < t ≤ 160 мм, Rp0,2≥600 МПа, Rm=800–950 МПа."
  B_qualified_forging:
    url: https://www.lucefin.com/oaleekso/files_mf/152353526334CrNiMo6.pdf
    publisher: Lucefin Group
    use: "Пример поковки круг Ø520, закалка в воде от 870 °C, отпуск 630 °C: на глубине 25 мм Rp0,2=828 и Rm=930 МПа, на 1/3 радиуса 750 и 900 МПа. Данные иллюстрируют возможность, режим для диска согласует кузница."
    procurement: "Rp0,2 ≥ 650 и Rm ≥ 850 МПа в тангенциальной пробе на T/4 (36 мм от действительной плоскости диска). Проба из термообработанного припуска, совпадающего по охлаждению с рабочей зоной, или из первой разрезанной заготовки. Мехсвойства в сертификате EN 10204 3.1 по партии с квалифицированным циклом ТО."
  B_GCI:
    url: https://www.asme.org/wwwasmeorg/media/resourcefiles/shop/journals/jfenumaccuracy.pdf
    use: "Celik et al., J. Fluids Eng. 130, 078001, 2008. Неравномерное отношение h, наблюдаемый порядок, GCI с Fs=1,25 для монотонных трёх сеток. Для немонотонных значений показан инженерный индекс с p=2 и Fs=3 как ориентир, без утверждения асимптотичности."
