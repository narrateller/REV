assumptions_to_validate:
  ZSF:
    - "Ø138,5 и Ø188 — чувствительность. Ø188 является диаметром выступа контрфланца. Рабочий диаметр по уплотнению B нуждается в подтверждении."
    - "135 мм — эскизная длина зажима. Кольцо опоры 39/30 мм и ограничение конуса 45–70 мм взяты с экрана T-1.7b."
    - "FZ из осадки 0,04 мм, нагрузка винта до 1,2 от средней, остаточное кручение 50 % для затяжки моментом."
    - "Допускаемое смятие материала ответной детали под головкой, температурная потеря, изгиб фланца и трубные силы открыты."
  cover:
    - "Радиальная восьмиканальная разводка MA — эскиз для сравнения. Внешний коллектор, штуцеры, отборы PTA/PTB и уплотнения отсутствуют в геометрической оценке."
    - "Жёсткость стяжек и гильзы приведена к передней опоре. Преднатяг передан распределёнными нагрузками в линейной модели."
  chamber:
    - "Из T-1.2b заданы окно, огибающие деталей, ход и 60/40. Сечения перемычки/боковин и положение стыка с корпусом восстановлены как варианты подмодели."
    - "Нижняя плоскость корпуса закреплена; реальная податливость стыка и геометрия сопряжения с рамой требуют уточнения."
round_2:
  decisions:
    repository: DECISIONS.md
    revision_with_D_GK_07: 20ad423
    scope: "A и B. Для C используется архив отчёта первого круга, передано в T-2.2b."
  boltight_TSR:
    url: https://www.nord-lock.com/globalassets/mediavalet/web-assets/downloads/tensioning-pdfs/boltight---tsr-user-manual---hs-operations.pdf
    publisher: Nord-Lock Group
    pages: [10, 36, 39, 42]
    use: "§2.4 и §4.1: LTF=max(1,10; 1,01+d/l) годится для первого назначения. При l/d=5 получается 1,21. Эскизный коэффициент 1,25 учитывает резерв +0,04; фактический перенос и разброс измеряются по удлинению на полном пакете."
    proof: "§4.4: TSR+1 M27, Ø87, площадь 1870 мм², 280 кН, TH 117 мм, габарит осевого доступа 145 мм по графе чертежа. Действуют одновременно ≥1d над гайкой и ≥2d над опорной плоскостью согласно §2.4."
  RE_20478:
    url: https://boschrexroth-russia.ru/image/catalog/docs/RE20478_2020-12.pdf
    publisher: Bosch Rexroth AG
    pages: [6, 9, 14, 15, 17]
    use: "Стр. 9: D3=240, D6=138,5, D2=212, H1=145, T1=25, T2≥55. Стр. 14: отверстие Ø30 и выступ Ø188 контрфланца, жёсткость опоры, плоскостность 0,01/100, Rz≤8. Стр. 17: R913059494 8 × M27×180, 10.9-flZn, 1150 Н·м, ±10 %, μ=0,09–0,14."
    evidence_limit: "D6 и d4 относятся к размерам чертежей, эффективный диаметр уплотнения B явно не указан. Стр. 6: давление A≤16 бар, B≤350 бар. Требуется подтверждение для своей крышки."
  VDI_R9_R11:
    url: https://www.normsplash.com/Samples/DIN/131389157/VDI-2230-Part-1-2015-en-de-2.pdf
    publisher: Verein Deutscher Ingenieure
    pages: [92, 93, 96, 97, 98, 99, 100]
    use: "Формулы (168)–(172) и интервал 0,3 ≤ FSm/F0,2min < 1 для SV/SG; (190)–(193) смятие; (195)–(210) срыв резьбы и табл. 6. В расчёте множитель 1,35 сохранён из первого круга, исходный запас SG показан отдельно."
  A_bearing:
    url: https://assets.eu.ctfassets.net/0vp0u5uh75zd/7MM4CVEWakvMoaUSg5YsPX/c4b6542d94541de714325d3d8ebb7dc7/053_056_Surface_pressure_mounted_Fastening_EN_01_2025.pdf
    use: "Для шайбы из 42CrMo4+QT при Rm≥1000 справочный консервативный pG=850 МПа обусловлен достаточной опорой, температурой и геометрией. pG материала клапана неизвестно."
  A_nut:
    url: https://dlvn.vn/uploads/files/ISO%2000898-2-2022.pdf
    proof_load_class_10_M27_N: 486500
    dimensions_url: https://www.schuster-gmbh.de/de/lieferprogramm/produkte/din-en-iso-4032/
    dimensions: "M27 ISO 4032: s=41, m=22,5…23,8 мм. Минимальная площадь по фактической опорной плоскости."
  A_baseline_head:
