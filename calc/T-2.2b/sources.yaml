materials:
  34CrNiMo6_QT:
    url: https://www.stahlwerk-augustfehn.com/wp-content/uploads/2024/01/34CrNiMo6-Technichal-data-sheet_-1.6582-new.pdf
    where: "с. 2, Mechanical properties, Flat products (QT), EN ISO 683-2"
    values_by_flat_ruling_section_mm:
      - {section_mm: [20, 60], Rp02_min_MPa: 800, Rm_min_MPa: 1000, use: "справочно для плоских сечений до 60 мм"}
      - {section_mm: [60, 100], Rp02_min_MPa: 700, Rm_min_MPa: 900, use: "засов и ярмо с расширением вокруг седла, плоское определяющее сечение по ширине"}
      - {section_mm: [100, 160], Rp02_min_MPa: 600, Rm_min_MPa: 800, use: "башмак, определяющее сечение по толщине"}
    check: "Подтвердить фактическую заготовку, определяющее сечение и направление пробы у изготовителя. Для ярма местное расширение по x >60 мм у отверстия требует отдельной проверки свойств."
  G35CrNiMo6_6_QT1:
    url: https://www.sfsa.org/wp-content/uploads/2021/10/s2.pdf
    where: "Steel Castings Handbook Supplement 2, EN 10293, G35CrNiMo6-6, QT1, 100–250 мм"
    values: {Rp02_min_MPa: 650, Rm_min_MPa: 800}
    project_analogue: calc/T-1.7/sources.yaml
    check: "Требуется сертификат для корпуса и места пробы. УЗК и МПК по аналогии T-1.7, необходимы согласование контроля и подтверждение класса FKM."
  M39_12_9_SG:
    url: https://media.bossard.com/ca-en/-/media/bossard-group/website/documents/technical-resources/en/f-004-en.pdf
    where: "таблица свойств ISO 898-1 и таблицы испытательных нагрузок, строка M39"
    values: {Rp02_min_MPa: 1100, Rm_min_MPa: 1220, proof_MPa: 970, As_mm2: 976}
    nut_url: https://media.bossard.com/ro-en/-/media/bossard-group/website/documents/technical-resources/en/f-009-en.pdf
    nut_where: "таблица пробных нагрузок полноопорных гаек, M39 класс 12, 1171 кН"
    check: "Резьба с крупным шагом P=4 мм, накатка после ТО. Фактические резьбовые допуски, сбег, твёрдость и накатка должны быть квалифицированы."
  steel_model:
    project_source: calc/T-1.7/sources.yaml
    where: steel_model_constants
    values: {E_MPa: 210000, nu: 0.30, density_kg_m3: 7850}
