round_2_assumptions:
  scope: "Расчётные проверки относятся к исследовательской геометрии в статусе HOLD."
  mesh: "C3D4, Gmsh 4.15.0, CalculiX 2.22, последовательность 36/28/21 мм по объёмному ограничителю, сгущение у кривых."
  penalty: "Kn 10000 МПа/мм, Kt 400 МПа/мм, μ=0,15. Оценка p/Kn и проба Kn 20000 МПа/мм."
  tied_joints: "Стойка–ярмо и верхний эквивалент гайки связаны TIE. Нижний анкер заменён общим закреплённым уровнем, его наружная гайка рассчитана отдельно. Раскрытие проверялось вручную и по растягивающим тягам на связанной плоскости."
  eccentricity: "Модель балки с упругими поворотными опорами по E, I и длине. Диапазон EI/L…4EI/L соответствует свободному или связанному поперечному смещению конца. Изгиб шпильки оценён по КЭ-сечениям упругого эквивалента."
  clearance: "Размерная цепь худшего сочетания. Допуски стойки, засова, базы, полного хода и температурно-сборочный резерв назначены расчётом."
  mass_sensitivity: "Плотность 7850 кг/м³. Строка 180,22142 кг является агрегатом, разнесение по деталям отсутствует."
