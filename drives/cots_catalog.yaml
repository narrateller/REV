  guide_alignment: 0.02 mm per 100 mm
  chamber_bore: H8
  punch_fit: H7/g6
  
selection_notes:
  - All components sized for 1.5 MN design envelope
  - Cylinder bore 80mm from DB-HYD-BORE-IDEAL
  - Guide spacing 200mm accommodates chamber width 150mm + clearance
  - Actual supplier models TBD based on availability and cost
  
status_definitions:
  SPECIFIED: Requirements defined, multiple suppliers available
  SELECTED_CANDIDATE: Specific type/size selected, supplier TBD
  REQUIREMENT_DEFINED: Functional requirements defined, detailed sizing pending
  CALCULATED_ASSUMED: Based on design envelope, not physically verified
